el trying all letters for the current digit. Add the path string when length equals digits length.", "timeComplexity": "O(4^n \u00b7 n)", "spaceComplexity": "O(n)", "python": "def letterCombinations(digits):\n    if not digits: return []\n    mp={'2':'abc','3':'def','4':'ghi','5':'jkl','6':'mno','7':'pqrs','8':'tuv','9':'wxyz'}\n    res=[]\n    def bt(i,path):\n        if i==len(digits): res.append(path)\n        return\n        for c in mp[digits[i]]: bt(i+1,path+c)\n    bt(0,'')\n    return res", "java": "class Solution {\n    // Approach: Backtracking\n    // Time: O(4^n \u00b7 n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Map each digit to its letters. Recurse through digits, at each level trying all letters for the current digit. Add the p\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 134, "name": "Matchsticks to Square", "category": "Backtracking", "difficulty": "Medium", "pattern": "Backtracking with Pruning", "approach": "Sort matchsticks descending. Try placing each stick into one of 4 sides. Prune if a side exceeds the target. Skip duplicate side lengths to avoid redundant branches.", "timeComplexity": "O(4^n)", "spaceComplexity": "O(n)", "python": "def makesquare(matchsticks):\n    total=sum(matchsticks)\n    if total%4: return False\n    target=total//4\n    matchsticks.sort(reverse=True)\n    sides=[0]*4\n    def bt(i):\n        if i==len(matchsticks): return len(set(sides))==1\n        for j in range(4):\n            if sides[j]+matchsticks[i]<=target:\n                sides[j]+=matchsticks[i]\n                if bt(i+1): return True\n                sides[j]-=matchsticks[i]\n                if sides[j]==0: break\n        return False\n    return bt(0)", "java": "class Solution {\n    // Approach: Backtracking with Pruning\n    // Time: O(4^n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Sort matchsticks descending. Try placing each stick into one of 4 sides. Prune if a side exceeds the target. Skip duplic\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 135, "name": "Partition to K Equal Sum Subsets", "category": "Backtracking", "difficulty": "Medium", "pattern": "Backtracking with Bitmask Memoization", "approach": "Sort descending. Try assigning each number to one of k buckets. Cache visited states using a bitmask of used numbers to avoid recomputing the same configuration.", "timeComplexity": "O(k \u00b7 2^n)", "spaceComplexity": "O(2^n)", "python": "def canPartitionKSubsets(nums, k):\n    total=sum(nums)\n    if total%k: return False\n    target=total//k\n    nums.sort(reverse=True)\n    if nums[0]>target: return False\n    memo={}\n    used=[False]*len(nums)\n    def bt(k,cur,i,mask):\n        if k==0: return True\n        if cur==target: return bt(k-1,0,0,mask)\n        if mask in memo: return memo[mask]\n        for j in range(i,len(nums)):\n            if not used[j] and cur+nums[j]<=target:\n                used[j]=True\n                res=bt(k,cur+nums[j],j+1,mask|(1<<j))\n                used[j]=False\n                if res: memo[mask]=True\n                return True\n        memo[mask]=False\n        return False\n    return bt(k,0,0,0)", "java": "class Solution {\n    // Approach: Backtracking with Bitmask Memoization\n    // Time: O(k \u00b7 2^n)  Space: O(2^n)\n    public Object solve(/* params */) {\n        // Sort descending. Try assigning each number to one of k buckets. Cache visited states using a bitmask of used numbers to \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 136, "name": "N Queens", "category": "Backtracking", "difficulty": "Hard", "pattern": "Backtracking + Sets for Conflicts", "approach": "Place one queen per row. Track occupied columns, and both diagonals (col\u2212row, col+row) in sets. When n queens are placed, record the board state.", "timeComplexity": "O(n!)", "spaceComplexity": "O(n)", "python": "def solveNQueens(n):\n    cols=set()\n    diag1=set()\n    diag2=set()\n    board=[['.']*n for _ in range(n)]\n    res=[]\n    def bt(r):\n        if r==n: res.append([''.join(row) for row in board])\n        return\n        for c in range(n):\n            if c in cols or r-c in diag1 or r+c in diag2: continue\n            cols.add(c)\n            diag1.add(r-c)\n            diag2.add(r+c)\n            board[r][c]='Q'\n            bt(r+1)\n            cols.remove(c)\n            diag1.remove(r-c)\n            diag2.remove(r+c)\n            board[r][c]='.'\n    bt(0)\n    return res", "java": "class Solution {\n    // Approach: Backtracking + Sets for Conflicts\n    // Time: O(n!)  Space: O(n)\n    public Object solve(/* params */) {\n        // Place one queen per row. Track occupied columns, and both diagonals (col\u2212row, col+row) in sets. When n queens are placed\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 137, "name": "N Queens II", "category": "Backtracking", "difficulty": "Hard", "pattern": "Backtracking (Count Only)", "approach": "Same as N Queens but only count solutions instead of recording board layouts. Use integer bitmasks for column and diagonal tracking for speed.", "timeComplexity": "O(n!)", "spaceComplexity": "O(n)", "python": "def totalNQueens(n):\n    cols=set()\n    d1=set()\n    d2=set()\n    res=[0]\n    def bt(r):\n        if r==n: res[0]+=1\n        return\n        for c in range(n):\n            if c in cols or r-c in d1 or r+c in d2: continue\n            cols.add(c)\n            d1.add(r-c)\n            d2.add(r+c)\n            bt(r+1)\n            cols.remove(c)\n            d1.remove(r-c)\n            d2.remove(r+c)\n    bt(0)\n    return res[0]", "java": "class Solution {\n    // Approach: Backtracking (Count Only)\n    // Time: O(n!)  Space: O(n)\n    public Object solve(/* params */) {\n        // Same as N Queens but only count solutions instead of recording board layouts. Use integer bitmasks for column and diagon\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 138, "name": "Word Break II", "category": "Backtracking", "difficulty": "Hard", "pattern": "Backtracking + Memoization", "approach": "For each position, try all words in the dictionary as the next segment. If the suffix from the current position is known (memoized), reuse it. Avoid redundant work.", "timeComplexity": "O(n \u00b7 2^n) worst", "spaceComplexity": "O(n \u00b7 2^n)", "python": "def wordBreak(s, wordDict):\n    words=set(wordDict)\n    memo={}\n    def bt(i):\n        if i==len(s): return ['']\n        if i in memo: return memo[i]\n        res=[]\n        for j in range(i+1,len(s)+1):\n            w=s[i:j]\n            if w in words:\n                for rest in bt(j):\n                    res.append(w+(' '+rest if rest else ''))\n        memo[i]=res\n        return res\n    return bt(0)", "java": "class Solution {\n    // Approach: Backtracking + Memoization\n    // Time: O(n \u00b7 2^n) worst  Space: O(n \u00b7 2^n)\n    public Object solve(/* params */) {\n        // For each position, try all words in the dictionary as the next segment. If the suffix from the current position is known\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 139, "name": "Implement Trie Prefix Tree", "category": "Tries", "difficulty": "Medium", "pattern": "Trie with TrieNode Array", "approach": "Each TrieNode has a children array of 26 and an isEnd flag. insert traverses/creates nodes character by character. search checks isEnd; startsWith doesn't.", "timeComplexity": "O(L) per op", "spaceComplexity": "O(n\u00b7L)", "python": "class TrieNode:\n    def __init__(self): self.ch=[None]*26\n    self.end=False\nclass Trie:\n    def __init__(self): self.root=TrieNode()\n    def insert(self,w):\n        cur=self.root\n        for c in w:\n            i=ord(c)-97\n            if not cur.ch[i]: cur.ch[i]=TrieNode()\n            cur=cur.ch[i]\n        cur.end=True\n    def search(self,w):\n        cur=self.root\n        for c in w:\n            i=ord(c)-97\n            if not cur.ch[i]: return False\n            cur=cur.ch[i]\n        return cur.end\n    def startsWith(self,p):\n        cur=self.root\n        for c in p:\n            i=ord(c)-97\n            if not cur.ch[i]: return False\n            cur=cur.ch[i]\n        return True", "java": "class Trie {\n    private Trie[] ch = new Trie[26];\n    private boolean end;\n    public void insert(String w) {\n        Trie cur = this;\n        for (char c : w.toCharArray()) {\n            int i = c - 'a';\n            if (cur.ch[i] == null) cur.ch[i] = new Trie();\n            cur = cur.ch[i];\n        }\n        cur.end = true;\n    }\n    public boolean search(String w) {\n        Trie cur = this;\n        for (char c : w.toCharArray()) {\n            if (cur.ch[c - 'a'] == null) return false;\n            cur = cur.ch[c - 'a'];\n        }\n        return cur.end;\n    }\n    public boolean startsWith(String p) {\n        Trie cur = this;\n        for (char c : p.toCharArray()) {\n            if (cur.ch[c - 'a'] == null) return false;\n            cur = cur.ch[c - 'a'];\n        }\n        return true;\n    }\n}"}, {"id": 140, "name": "Design Add And Search Words Data Structure", "category": "Tries", "difficulty": "Medium", "pattern": "Trie + DFS for '.' Wildcards", "approach": "Build a standard trie. When searching, handle '.' by recursing into all existing children of the current node.", "timeComplexity": "O(L) insert, O(26^L) search worst", "spaceComplexity": "O(n\u00b7L)", "python": "class WordDictionary:\n    def __init__(self): self.root={}\n    def addWord(self,w):\n        cur=self.root\n        for c in w: cur=cur.setdefault(c,{})\n        cur['#']=True\n    def search(self,w):\n        def dfs(node,i):\n            if i==len(w): return '#' in node\n            c=w[i]\n            if c=='.': return any(dfs(node[x],i+1) for x in node if x!='#')\n            return c in node and dfs(node[c],i+1)\n        return dfs(self.root,0)", "java": "class Solution {\n    // Approach: Trie + DFS for '.' Wildcards\n    // Time: O(L) insert, O(26^L) search worst  Space: O(n\u00b7L)\n    public Object solve(/* params */) {\n        // Build a standard trie. When searching, handle '.' by recursing into all existing children of the current node.\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 141, "name": "Extra Characters in a String", "category": "Tries", "difficulty": "Medium", "pattern": "Dynamic Programming + Trie", "approach": "dp[i] = min extra characters for s[0..i-1]. For each i, default dp[i]=dp[i-1]+1 (skip char). Check all substrings ending at i that exist in the dictionary (using a trie for fast lookup).", "timeComplexity": "O(n\u00b2)", "spaceComplexity": "O(n + dict)", "python": "def minExtraChar(s, dictionary):\n    words=set(dictionary)\n    n=len(s)\n    dp=[0]*(n+1)\n    for i in range(n-1,-1,-1):\n        dp[i]=1+dp[i+1]\n        for j in range(i+1,n+1):\n            if s[i:j] in words: dp[i]=min(dp[i],dp[j])\n    return dp[0]", "java": "class Solution {\n    // Approach: Dynamic Programming + Trie\n    // Time: O(n\u00b2)  Space: O(n + dict)\n    public Object solve(/* params */) {\n        // dp[i] = min extra characters for s[0..i-1]. For each i, default dp[i]=dp[i-1]+1 (skip char). Check all substrings ending\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 142, "name": "Word Search II", "category": "Tries", "difficulty": "Hard", "pattern": "Trie + DFS Backtracking on Grid", "approach": "Insert all words into a trie. DFS from every cell; traverse the trie simultaneously. When a trie node marks end-of-word, add the word to results. Prune branches not in the trie.", "timeComplexity": "O(m\u00b7n\u00b74\u00b73^(L-1))", "spaceComplexity": "O(total word chars)", "python": "def findWords(board, words):\n    from collections import defaultdict\n    # Build trie\n    trie={}\n    res=set()\n    for w in words:\n        t=trie\n        for c in w: t=t.setdefault(c,{})\n        t['#']=w\n    R,C=len(board),len(board[0])\n    def dfs(r,c,t):\n        if '#' in t: res.add(t['#'])\n        if r<0 or r>=R or c<0 or c>=C: return\n        ch=board[r][c]\n        if ch not in t: return\n        board[r][c]='#'\n        [dfs(r+dr,c+dc,t[ch]) for dr,dc in[(0,1),(0,-1),(1,0),(-1,0)]]\n        board[r][c]=ch\n    [dfs(r,c,trie) for r in range(R) for c in range(C)]\n    return list(res)", "java": "class Solution {\n    // Approach: Trie + DFS Backtracking on Grid\n    // Time: O(m\u00b7n\u00b74\u00b73^(L-1))  Space: O(total word chars)\n    public Object solve(/* params */) {\n        // Insert all words into a trie. DFS from every cell; traverse the trie simultaneously. When a trie node marks end-of-word,\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 143, "name": "Island Perimeter", "category": "Graphs", "difficulty": "Easy", "pattern": "Grid Traversal", "approach": "For each land cell, add 4 to the perimeter. Subtract 2 for each shared edge with an adjacent land cell (right and down neighbors are sufficient to check).", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(1)", "python": "def islandPerimeter(grid):\n    res=0\n    for r in range(len(grid)):\n        for c in range(len(grid[0])):\n            if grid[r][c]==1:\n                res+=4\n                if r>0 and grid[r-1][c]: res-=2\n                if c>0 and grid[r][c-1]: res-=2\n    return res", "java": "class Solution {\n    // Approach: Grid Traversal\n    // Time: O(m\u00b7n)  Space: O(1)\n    public Object solve(/* params */) {\n        // For each land cell, add 4 to the perimeter. Subtract 2 for each shared edge with an adjacent land cell (right and down n\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 144, "name": "Verifying An Alien Dictionary", iculty": "Medium", "pattern": "DFS / BFS Flood Fill", "approach": "Iterate over cells. On finding a '1', increment count and DFS/BFS to mark the entire island as visited by setting cells to '0'.", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(m\u00b7n)", "python": "def numIslands(grid):\n    def dfs(r,c):\n        if r<0 or r>=len(grid) or c<0 or c>=len(grid[0]) or grid[r][c]!='1': return\n        grid[r][c]='0'\n        for dr,dc in[(0,1),(0,-1),(1,0),(-1,0)]: dfs(r+dr,c+dc)\n    count=0\n    for r in range(len(grid)):\n        for c in range(len(grid[0])):\n            if grid[r][c]=='1': count+=1\n            dfs(r,c)\n    return count", "java": "class Solution {\n    public int numIslands(char[][] grid) {\n        int count = 0;\n        for (int r = 0; r < grid.length; r++) {\n            for (int c = 0; c < grid[0].length; c++) {\n                if (grid[r][c] == '1') { count++; dfs(grid, r, c); }\n            }\n        }\n        return count;\n    }\n    private void dfs(char[][] g, int r, int c) {\n        if (r < 0 || r >= g.length || c < 0 || c >= g[0].length || g[r][c] != '1') return;\n        g[r][c] = '0';\n        dfs(g, r+1, c); dfs(g, r-1, c); dfs(g, r, c+1); dfs(g, r, c-1);\n    }\n}"}, {"id": 147, "name": "Max Area of Island", "category": "Graphs", "difficulty": "Medium", "pattern": "DFS Flood Fill with Area Count", "approach": "DFS from each unvisited land cell. Count cells visited in this DFS as the island area. Return the maximum area found.", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(m\u00b7n)", "python": "def maxAreaOfIsland(grid):\n    def dfs(r,c):\n        if r<0 or r>=len(grid) or c<0 or c>=len(grid[0]) or not grid[r][c]: return 0\n        grid[r][c]=0\n        return 1+sum(dfs(r+dr,c+dc) for dr,dc in[(0,1),(0,-1),(1,0),(-1,0)])\n    return max((dfs(r,c) for r in range(len(grid)) for c in range(len(grid[0]))),default=0)", "java": "class Solution {\n    // Approach: DFS Flood Fill with Area Count\n    // Time: O(m\u r<R and 0<=nc<C and rooms[nr][nc]==2**31-1:\n                rooms[nr][nc]=rooms[r][c]+1\n                q.append((nr,nc))", "java": "class Solution {\n    // Approach: Multi-Source BFS\n    // Time: O(m\u00b7n)  Space: O(m\u00b7n)\n    public Object solve(/* params */) {\n        // Initialize the BFS queue with all gate positions (value 0). BFS outward to fill room distances. Each cell's distance is \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 150, "name": "Rotting Oranges", "category": "Graphs", "difficulty": "Medium", "pattern": "Multi-Source BFS", "approach": "Add all initially rotten oranges to the queue. BFS spreads rot level by level (each level = 1 minute). After BFS, check if any fresh oranges remain.", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(m\u00b7n)", "python": "from collections import deque\ndef orangesRotting(grid):\n    R,C=len(grid),len(grid[0])\n    q=deque()\n    fresh=0\n    for r in range(R):\n        for c in range(C):\n            if grid[r][c]==2: q.append((r,c,0))\n            elif grid[r][c]==1: fresh+=1\n    mx=0\n    while q:\n        r,c,t=q.popleft()\n        for dr,dc in[(0,1),(0,-1),(1,0),(-1,0)]:\n            nr,nc=r+dr,c+dc\n            if 0<=nr<R and 0<=nc<C and grid[nr][nc]==1:\n                grid[nr][nc]=2\n                fresh-=1\n                mx=t+1\n                q.append((nr,nc,t+1))\n    return mx if fresh==0 else -1", "java": "class Solution {\n    // Approach: Multi-Source BFS\n    // Time: O(m\u00b7n)  Space: O(m\u00b7n)\n    public Object solve(/* params */) {\n        // Add all initially rotten oranges to the queue. BFS spreads rot level by level (each level = 1 minute). After BFS, check \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 151, "name": "Pacific Atlantic Water Flow", "category": "Graphs", "difficulty": "Medium", "pattern": "Reverse BFS/DFS from Both Oceans", "approach": "BFS/DFS from all Pacific border cells; mark reachable. BFS/DFS from all Atlantic border cells; mark reachable. Cells marked by both are the answer.", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(m\u00b7n)", "python": "from collections import deque\ndef pacificAtlantic(heights):\n    R,C=len(heights),len(heights[0])\n    def bfs(starts):\n        vis=set(starts)\n        q=deque(starts)\n        while q:\n            r,c=q.popleft()\n            for dr,dc in[(0,1),(0,-1),(1,0),(-1,0)]:\n                nr,nc=r+dr,c+dc\n                if 0<=nr<R and 0<=nc<C and (nr,nc) not in vis and heights[nr][nc]>=heights[r][c]:\n                    vis.add((nr,nc))\n                    q.append((nr,nc))\n        return vis\n    pac=bfs([(0,c) for c in range(C)]+[(r,0) for r in range(R)])\n    atl=bfs([(R-1,c) for c in range(C)]+[(r,C-1) for r in range(R)])\n    return [list(p) for p in pac&atl]", "java": "class Solution {\n    // Approach: Reverse BFS/DFS from Both Oceans\n    // Time: O(m\u00b7n)  Space: O(m\u00b7n)\n    public Object solve(/* params */) {\n        // BFS/DFS from all Pacific border cells; mark reachable. BFS/DFS from all Atlantic border cells; mark reachable. Cells mar\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 152, "name": "Surrounded Regions", "category": "Graphs", "difficulty": "Medium", "pattern": "DFS from Borders", "approach": "DFS from all 'O' cells on the border, marking them safe (e.g., 'T'). Then flip all remaining 'O' to 'X' and restore 'T' back to 'O'.", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(m\u00b7n)", "python": "def solve(board):\n    R,C=len(board),len(board[0])\n    def dfs(r,c):\n        if r<0 or r>=R or c<0 or c>=C or board[r][c]!='O': return\n        board[r][c]='T'\n        for dr,dc in[(0,1),(0,-1),(1,0),(-1,0)]: dfs(r+dr,c+dc)\n    for r in range(R): dfs(r,0)\n    dfs(r,C-1)\n    for c in range(C): dfs(0,c)\n    dfs(R-1,c)\n    for r in range(R):\n        for c in range(C):\n            board[r][c]='X' if board[r][c]=='O' else ('O' if board[r][c]=='T' else board[r][c])", "java": "class Solution {\n    // Approach: DFS from Borders\n    // Time: O(m\u00b7n)  Space: O(m\u00b7n)\n    public Object solve(/* params */) {\n        // DFS from all 'O' cells on the border, marking them safe (e.g., 'T'). Then flip all remaining 'O' to 'X' and restore 'T' \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 153, "name": "Open The Lock", "category": "Graphs", "difficulty": "Medium", "pattern": "BFS on State Space", "approach": "Model each lock combination as a node. BFS from '0000', exploring all 8 one-turn neighbors. Skip deadend states. Return the step count when '0000'\u2192target.", "timeComplexity": "O(10^4 \u00b7 8)", "spaceComplexity": "O(10^4)", "python": "from collections import deque\ndef openLock(deadends, target):\n    dead=set(deadends)\n    q=deque([('0000',0)])\n    vis={'0000'}\n    while q:\n        state,steps=q.popleft()\n        if state==target: return steps\n        if state in dead: continue\n        for i in range(4):\n            for d in(1,-1):\n                new=state[:i]+str((int(state[i])+d)%10)+state[i+1:]\n                if new not in vis: vis.add(new)\n                q.append((new,steps+1))\n    return -1", "java": "class Solution {\n    // Approach: BFS on State Space\n    // Time: O(10^4 \u00b7 8)  Space: O(10^4)\n    public Object solve(/* params */) {\n        // Model each lock combination as a node. BFS from '0000', exploring all 8 one-turn neighbors. Skip deadend states. Return \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 154, "name": "Course Schedule", "category": "Graphs", "difficulty": "Medium", "pattern": "Topological Sort (Cycle Detection)", "approach": "Build the directed graph. DFS and mark nodes as visiting/visited. If a visiting node is encountered again, there's a cycle (return False). Return True if no cycles exist.", "timeComplexity": "O(V+E)", "spaceComplexity": "O(V+E)", "python": "def canFinish(numCourses, prerequisites):\n    adj=[[]for _ in range(numCourses)]\n    for a,b in prerequisites: adj[b].append(a)\n    vis=[0]*numCourses\n    def dfs(c):\n        if vis[c]==1: return False\n        if vis[c]==2: return True\n        vis[c]=1\n        for nb in adj[c]:\n            if not dfs(nb): return False\n        vis[c]=2\n        return True\n    return all(dfs(c) for c in range(numCourses))", "java": "class Solution {\n    public boolean canFinish(int n, int[][] prerequisites) {\n        List<List<Integer>> adj = new ArrayList<>();\n        for (int i = 0; i < n; i++) adj.add(new ArrayList<>());\n        for (int[] p : prerequisites) adj.get(p[1]).add(p[0]);\n        int[] vis = new int[n]; // 0=unvisited, 1=visiting, 2=done\n        for (int i = 0; i < n; i++) if (!dfs(adj, vis, i)) return false;\n        return true;\n    }\n    private boolean dfs(List<List<Integer>> adj, int[] vis, int c) {\n        if (vis[c] == 1) return false;\n        if (vis[c] == 2) return true;\n        vis[c] = 1;\n        for (int nb : adj.get(c)) if (!dfs(adj, vis, nb)) return false;\n        vis[c] = 2;\n        return true;\n    }\n}"}, {"id": 155, "name": "Course Schedule II", "category": "Graphs", "difficulty": "Medium", "pattern": "Topological Sort (Kahn's BFS or DFS)", "approach": "Kahn's: track in-degrees. Enqueue nodes with in-degree 0. Process and reduce neighbors' in-degrees; enqueue when they reach 0. If processed count equals V, return order.", "timeComplexity": "O(V+E)", "spaceComplexity": "O(V+E)", "python": "from collections import deque\ndef findOrder(n, prerequisites):\n    adj=[[]for _ in range(n)]\n    indeg=[0]*n\n    for a,b in prerequisites: adj[b].append(a)\n    indeg[a]+=1\n    q=deque(i for i in range(n) if indeg[i]==0)\n    res=[]\n    while q:\n        c=q.popleft()\n        res.append(c)\n        for nb in adj[c]:\n            indeg[nb]-=1\n            if indeg[nb]==0: q.append(nb)\n    return res if len(res)==n else []", "java": "class Solution {\n    // Approach: Topological Sort (Kahn's BFS or DFS)\n    // Time: O(V+E)  Space: O(V+E)\n    public Object solve(/* params */) {\n        // Kahn's: track in-degrees. Enqueue nodes with in-degree 0. Process and reduce neighbors' in-degrees; enqueue when they re\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 156, "name": "Graph Valid Tree", "category": "Graphs", "difficulty": "Medium", "pattern": "Union-Find or DFS Cycle Detection", "approach": "A graph of n nodes is a valid tree if it has exactly n-1 edges and is connected (no cycle). Use Union-Find: if merging two nodes that share a root, a cycle exists.", "timeComplexity": "O(n \u00b7 \u03b1(n))", "spaceComplexity": "O(n)", "python": "def validTree(n, edges):\n    if len(edges)!=n-1: return False\n    par=list(range(n))\n    def find(x): par[x]=find(par[x]) if par[x]!=x else x\n    return par[x]\n    for a,b in edges:\n        ra,rb=find(a),find(b)\n        if ra==rb: return False\n        par[ra]=rb\n    return True", "java": "class Solution {\n    // Approach: Union-Find or DFS Cycle Detection\n    // Time: O(n \u00b7 \u03b1(n))  Space: O(n)\n    public Object solve(/* params */) {\n        // A graph of n nodes is a valid tree if it has exactly n-1 edges and is connected (no cycle). Use Union-Find: if merging t\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 157, "name": "Course Schedule IV", "category": "Graphs", "difficulty": "Medium", "pattern": "Floyd-Warshall (Transitive Closure)", "approach": "Build a reachability matrix using Floyd-Warshall or transitive closure via DFS/BFS. Answer each query in O(1) by looking up reachability[u][v].", "timeComplexity": "O(V\u00b3) or O(V(V+E))", "spaceComplexity": "O(V\u00b2)", "python": "def checkIfPrerequisite(n, prerequisites, queries):\n    reach=[[False]*n for _ in range(n)]\n    for a,b in prerequisites: reach[a][b]=True\n    for k in range(n):\n        for i in range(n):\n            for j in range(n):\n                if reach[i][k] and reach[k][j]: reach[i][j]=True\n    return [reach[u][v] for u,v in queries]", "java": "class Solution {\n    // Approach: Floyd-Warshall (Transitive Closure)\n    // Time: O(V\u00b3) or O(V(V+E))  Space: O(V\u00b2)\n    public Object solve(/* params */) {\n        // Build a reachability matrix using Floyd-Warshall or transitive closure via DFS/BFS. Answer each query in O(1) by looking\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 158, "name": "Number of Connected Components In An Undirected Graph", "category": "Graphs", "difficulty": "Medium", "pattern": "Union-Find", "approach": "Use Union-Find with path compression and union by rank. For each edge, union the two endpoints. Count the number of distinct roots.", "timeComplexity": "O(n \u00b7 \u03b1(n))", "spaceComplexity": "O(n)", "python": "def countComponents(n, edges):\n    par=list(range(n))\n    def find(x): par[x]=find(par[x]) if par[x]!=x else x\n    return par[x]\n    res=n\n    for a,b in edges:\n        ra,rb=find(a),find(b)\n        if ra!=rb: par[ra]=rb\n        res-=1\n    return res", "java": "class Solution {\n    // Approach: Union-Find\n    // Time: O(n \u00b7 \u03b1(n))  Space: O(n)\n    public Object solve(/* params */) {\n        // Use Union-Find with path compression and union by rank. For each edge, union the two endpoints. Count the number of dist\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 159, "name": "Redundant Connection", "category": "Graphs", "difficulty": "Medium", "pattern": "Union-Find (Detect Cycle)", "approach": "Process edges one by one. Use Union-Find; for each edge (u,v), if they already share a root, this edge is redundant. Otherwise, union them.", "timeComplexity": "O(n \u00b7 \u03b1(n))", "spaceComplexity": "O(n)", "python": "def findRedundantConnection(edges):\n    par= ionException(\"Implement me\");\n    }\n}"}, {"id": 161, "name": "Evaluate Division", "category": "Graphs", "difficulty": "Medium", "pattern": "Graph (DFS / BFS with Weighted Edges)", "approach": "Build a weighted graph: A/B=k means edge A\u2192B=k and B\u2192A=1/k. For each query, DFS/BFS from source to destination, multiplying edge weights along the path.", "timeComplexity": "O((V+E) \u00b7 Q)", "spaceComplexity": "O(V+E)", "python": "def calcEquation(equations, values, queries):\n    from collections import defaultdict,deque\n    graph=defaultdict(dict)\n    for (a,b),v in zip(equations,values):\n        graph[a][b]=v\n        graph[b][a]=1/v\n    def bfs(src,dst):\n        if src not in graph or dst not in graph: return -1\n        q=deque([(src,1.0)])\n        vis={src}\n        while q:\n            node,prod=q.popleft()\n            if node==dst: return prod\n            for nb,w in graph[node].items():\n                if nb not in vis: vis.add(nb)\n                q.append((nb,prod*w))\n        return -1\n    return [bfs(a,b) for a,b in queries]", "java": "class Solution {\n    // Approach: Graph (DFS / BFS with Weighted Edges)\n    // Time: O((V+E) \u00b7 Q)  Space: O(V+E)\n    public Object solve(/* params */) {\n        // Build a weighted graph: A/B=k means edge A\u2192B=k and B\u2192A=1/k. For each query, DFS/BFS from source to destination, multiply\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 162, "name": "Minimum Height Trees", "category": "Graphs", "difficulty": "Medium", "pattern": "Topological Sort (Leaf Trimming)", "approach": "Iteratively remove leaf nodes (degree 1) from the outside in. The remaining 1 or 2 nodes are the MHT roots.", "timeComplexity": "O(n)", "spaceComplexity": "O(n)", "python": "def findMinHeightTrees(n, edges):\n    if n==1: return [0]\n    from collections import deque\n    adj=[set() for _ in range(n)]\n    for a,b in edges: adj[a].add(b)\n    adj[b].add(a)\n    leaves=deque(i for i in range(n) if len(adj[i])==1)\n    rem=n\n    while rem>2:\n        rem-=len(leaves)\n        nxt=deque()\n        for l in leaves:\n            nb=adj[l].pop()\n            adj[nb].remove(l)\n            if len(adj[nb])==1: nxt.append(nb)\n        leaves=nxt\n    return list(leaves)", "java": "class Solution {\n    // Approach: Topological Sort (Leaf Trimming)\n    // Time: O(n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Iteratively remove leaf nodes (degree 1) from the outside in. The remaining 1 or 2 nodes are the MHT roots.\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 163, "name": "Word Ladder", "category": "Graphs", "difficulty": "Hard", "pattern": "BFS on Word Graph", "approach": "BFS from beginWord. At each step, try changing every character to every letter; if the result is in the wordSet, add it to the queue. Return steps when endWord is reached.", "timeComplexity": "O(M\u00b2 \u00b7 N)", "spaceComplexity": "O(M\u00b2 \u00b7 N)", "python": "from collections import deque\ndef ladderLength(beginWord, endWord, wordList):\n    words=set(wordList)\n    if endWord not in words: return 0\n    q=deque([(beginWord,1)])\n    vis={beginWord}\n    while q:\n        w,steps=q.popleft()\n        for i in range(len(w)):\n            for c in 'abcdefghijklmnopqrstuvwxyz':\n                nw=w[:i]+c+w[i+1:]\n                if nw==endWord: return steps+1\n                if nw in words and nw not in vis: vis.add(nw)\n                q.append((nw,steps+1))\n    return 0", "java": "class Solution {\n    // Approach: BFS on Word Graph\n    // Time: O(M\u00b2 \u00b7 N)  Space: O(M\u00b2 \u00b7 N)\n    public Object solve(/* params */) {\n        // BFS from beginWord. At each step, try changing every character to every letter; if the result is in the wordSet, add it \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 164, "name": "Path with Minimum Effort", "category": "Ad ed Dijkstra: cost to reach a cell is the maximum elevation encountered on the path. Use a min-heap; return cost wh\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 169, "name": "Alien Dictionary", "category": "Advanced Graphs", "difficulty": "Hard", "pattern": "Topological Sort", "approach": "Derive character ordering by comparing adjacent words in the list. Build a directed graph. Topological sort (Kahn's) gives the alien alphabet. Cycle \u2192 invalid; shorter prefix \u2192 invalid.", "timeComplexity": "O(C)", "spaceComplexity": "O(1)", "python": "def alienOrder(words):\n    adj={c:set() for w in words for c in w}\n    for a,b in zip(words,words[1:]):\n        for ca,cb in zip(a,b):\n            if ca!=cb: adj[ca].add(cb)\n            break\n        else:\n            if len(a)>len(b): return ''\n    vis={}\n    res=[]\n    def dfs(c):\n        if c in vis: return vis[c]==False\n        vis[c]=True\n        for nb in adj[c]:\n            if not dfs(nb): return False\n        vis[c]=False\n        res.append(c)\n        return True\n    for c in adj:\n        if not dfs(c): return ''\n    return ''.join(reversed(res))", "java": "class Solution {\n    // Approach: Topological Sort\n    // Time: O(C)  Space: O(1)\n    public Object solve(/* params */) {\n        // Derive character ordering by comparing adjacent words in the list. Build a directed graph. Topological sort (Kahn's) giv\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 170, "name": "Cheapest Flights Within K Stops", "category": "Advanced Graphs", "difficulty": "Medium", "pattern": "Bellman-Ford (K+1 Rounds)", "approach": "Run Bellman-Ford for at most k+1 relaxation rounds (k stops = k+1 edges). Use a copy of distances per round to avoid using the same flight twice in one round.", "timeComplexity": "O(K \u00b7 E)", "spaceComplexity": "O(V)", "python": "def findCheapestPrice(n, flights, src, dst, k):\n    dist=[float('inf')]*n\n
