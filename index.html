i;\n    }\n    for (int i = n - 2, t = k + 1; i >= 0; i--) {\n      while (k >= t && cross(trees[hull[k - 2]], trees[hull[k - 1]], trees[i]) < 0) k--;\n      hull[k++] = i;\n    }\n    Set<Integer> set = new HashSet<>();\n    for (int i = 0; i < k - 1; i++) set.add(hull[i]);\n    int[][] res = new int[set.size()][2];\n    int idx = 0;\n    for (int i : set) res[idx++] = trees[i];\n    return res;\n  }\n\n  private long cross(int[] o, int[] a, int[] b) {\n    return (long) (a[0] - o[0]) * (b[1] - o[1]) - (long) (a[1] - o[1]) * (b[0] - o[0]);\n  }\n}", "description": "Given tree positions in a garden, find the minimum perimeter fence (convex hull) enclosing all trees. Return the points on the fence.", "example": "trees=[[1,1],[2,2],[2,0],[2,4],[3,3],[4,2]] → [[1,1],[2,0],[4,2],[3,3],[2,4]]", "source": "chillinterview"}, {"id": 299, "name": "Rectangle Area II", "category": "Math & Geometry", "difficulty": "Hard", "pattern": "Coordinate Compression + Sweep Line", "approach": "Sweep a horizontal line over y-events (rectangle bottom = +1, top = -1). Between consecutive events, the covered width is the sum of compressed x-gaps with count > 0; area += width × Δy. O(n²).", "timeComplexity": "O(n²)", "spaceComplexity": "O(n)", "python": "def rectangleArea(rectangles):\n    MOD = 10**9 + 7\n    xs = sorted({x for r in rectangles for x in (r[0], r[2])})\n    xi = {x: i for i, x in enumerate(xs)}\n    cnt = [0] * len(xs)\n    events = []\n    for x1, y1, x2, y2 in rectangles:\n        events.append((y1, 1, x1, x2))\n        events.append((y2, -1, x1, x2))\n    events.sort()\n    res, prev_y = 0, events[0][0]\n    for y, typ, x1, x2 in events:\n        covered = sum(xs[i + 1] - xs[i] for i in range(len(xs) - 1) if cnt[i] > 0)\n        res += covered * (y - prev_y)\n        prev_y = y\n        for i in range(xi[x1], xi[x2]):\n            cnt[i] += typ\n    return res % MOD", "java": "import java.util.*;\n\nclass Solution {\n  public int rectangleArea(int[][] rectangles) {\n    long MOD = 1_000_000_007L;\n    TreeSet<Integer> set = new TreeSet<>();\n    for (int[] r : rectangles) {\n      set.add(r[0]);\n      set.add(r[2]);\n    }\n    Integer[] xs = set.toArray(new Integer[0]);\n    Map<Integer, Integer> xi = new HashMap<>();\n    for (int i = 0; i < xs.length; i++) xi.put(xs[i], i);\n    int[][] events = new int[rectangles.length * 2][];\n    int e = 0;\n    for (int[] r : rectangles) {\n      events[e++] = new int[] {r[1], 1, r[0], r[2]};\n      events[e++] = new int[] {r[3], -1, r[0], r[2]};\n    }\n    Arrays.sort(events, (a, b) -> a[0] - b[0]);\n    int[] cnt = new int[xs.length];\n    long res = 0;\n    int prevY = events[0][0];\n    for (int[] ev : events) {\n      long covered = 0;\n      for (int i = 0; i + 1 < xs.length; i++) if (cnt[i] > 0) covered += xs[i + 1] - xs[i];\n      res = (res + covered * (ev[0] - prevY)) % MOD;\n      prevY = ev[0];\n      for (int i = xi.get(ev[2]); i < xi.get(ev[3]); i++) cnt[i] += ev[1];\n    }\n    return (int) res;\n  }\n}", "description": "Given a list of axis-aligned rectangles, return the total area covered by all rectangles (overlapping areas counted once). Answer modulo 1e9+7.", "example": "rectangles=[[0,0,2,2],[1,0,2,3],[1,0,3,1]] → 6", "source": "chillinterview"}, {"id": 300, "name": "Design Browser History", "category": "Design", "difficulty": "Medium", "pattern": "Design — two stacks or array with pointer", "approach": "Keep a list of pages and a current index. visit() truncates forward pages and appends. back()/forward() clamp the index to valid range. O(1) per operation.", "timeComplexity": "O(1) per op", "spaceComplexity": "O(n)", "python": "class BrowserHistory:\n    def __init__(self, homepage):\n        self.history = [homepage]\n        self.cur = 0\n\n    def visit(self, url):\n        self.history = self.history[: self.cur + 1]\n        self.history.append(url)\n        self.cur += 1\n\n    def back(self, steps):\n        self.cur = max(0, self.cur - steps)\n        return self.history[self.cur]\n\n    def forward(self, steps):\n        self.cur = min(len(self.history) - 1, self.cur + steps)\n        return self.history[self.cur]", "java": "import java.util.*;\n\nclass BrowserHistory {\n  private List<String> history;\n  private int cur;\n\n  public BrowserHistory(String homepage) {\n    history = new ArrayList<>();\n    history.add(homepage);\n    cur = 0;\n  }\n\n  public void visit(String url) {\n    while (history.size() > cur + 1) history.remove(history.size() - 1);\n    history.add(url);\n    cur++;\n  }\n\n  public String back(int steps) {\n    cur = Math.max(0, cur - steps);\n    return history.get(cur);\n  }\n\n  public String forward(int steps) {\n    cur = Math.min(history.size() - 1, cur + steps);\n    return history.get(cur);\n  }\n}", "description": "BrowserHistory(homepage): visit(url) clears forward history and moves to url; back(steps) moves back min(steps, available); forward(steps) moves forward min(steps, available).", "example": "BrowserHistory('leetcode.com'); visit('google.com'); visit('facebook.com'); back(1)→'google.com'; back(1)→'leetcode.com'; forward(1)→'google.com'", "source": "chillinterview"}];

const DIFF_ORDER = { Easy: 0, Medium: 1, Hard: 2 };

function DiffBadge({ diff }) {
  const cls = { Easy: 'badge-diff-easy', Medium: 'badge-diff-medium', Hard: 'badge-diff-hard' }[diff] || '';
  return React.createElement('span', { className: `badge ${cls}` }, diff);
}

function TagBadge({ source }) {
  return source === 'chillinterview'
    ? React.createElement('span', { className: 'badge badge-tag' }, 'chillinterview')
    : null;
}

function CatBadge({ cat }) {
  return React.createElement('span', { className: 'badge badge-cat' }, cat);
}


/* ── Python syntax highlighter ───────────────────────────────────────── */
function highlightPython(code) {
  var KW = ['def','return','if','elif','else','for','while','in','not','and','or',
             'True','False','None','import','from','as','class','self','break',
             'continue','pass','lambda','yield','with','raise','try','except',
             'finally','del','global','nonlocal','is'];
  var BI = ['range','len','max','min','sum','sorted','list','dict','set','tuple',
             'int','str','float','bool','enumerate','zip','map','filter','abs',
             'any','all','reversed','type','isinstance','divmod','print','next',
             'iter','super','open'];
  var s = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var SLOTS = [];
  function slot(v) { SLOTS.push(v); return '\x00' + (SLOTS.length-1) + '\x00'; }
  // comments
  s = s.replace(/#[^\n]*/g, function(m){ return slot('<span class="py-cm">'+m+'</span>'); });
  // strings (double then single)
  s = s.replace(/"(?:[^"\\]|\\.)*"/g, function(m){ return slot('<span class="py-str">'+m+'</span>'); });
  s = s.replace(/'(?:[^'\\]|\\.)*'/g, function(m){ return slot('<span class="py-str">'+m+'</span>'); });
  // decorators
  s = s.replace(/@\w+/g, function(m){ return slot('<span class="py-dec">'+m+'</span>'); });
  // numbers
  s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, function(_,n){ return slot('<span class="py-num">'+n+'</span>'); });
  // keywords
  KW.forEach(function(kw){
    s = s.replace(new RegExp('(?<![\\w])'+kw+'(?![\\w])','g'), function(m){ return slot('<span class="py-kw">'+m+'</span>'); });
  });
  // builtins (only before parens)
  BI.forEach(function(b){
    s = s.replace(new RegExp('(?<![\\w])'+b+'(?=\\s*\\()','g'), function(m){ return slot('<span class="py-bi">'+m+'</span>'); });
  });
  // class/def names - inline after keyword slot
  s = s.replace(/\bclass\s+(\w+)/g, function(_,n){ return 'class <span class="py-cls">'+n+'</span>'; });
  s = s.replace(/\bdef\s+(\w+)/g,   function(_,n){ return 'def <span class="py-fn">'+n+'</span>'; });
  // restore slots
  s = s.replace(/\x00(\d+)\x00/g, function(_,i){ return SLOTS[+i] || ''; });
  return s;
}

/* ── Java syntax highlighter ─────────────────────────────────────────── */
function highlightJava(code) {
  var KW = ['abstract','assert','boolean','break','byte','case','catch','char',
             'class','const','continue','default','do','double','else','enum',
             'extends','final','finally','float','for','goto','if','implements',
             'import','instanceof','int','interface','long','native','new',
             'package','private','protected','public','return','short','static',
             'super','switch','synchronized','this','throw','throws','transient',
             'try','void','volatile','while','var','true','false','null'];
  var TYPES = ['String','Integer','List','Map','Set','Deque','Queue','Stack',
               'ArrayList','HashMap','HashSet','LinkedList','ArrayDeque',
               'PriorityQueue','TreeMap','TreeSet','LinkedHashMap','Arrays',
               'Collections','Math','StringBuilder','Object','Comparator',
               'Node','TreeNode','ListNode'];
  var s = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var SLOTS = [];
  function slot(v){ SLOTS.push(v); return '\x00'+(SLOTS.length-1)+'\x00'; }
  // block comments
  s = s.replace(/\/\*[\s\S]*?\*\//g, function(m){ return slot('<span class="jv-cm">'+m+'</span>'); });
  // line comments
  s = s.replace(/\/\/[^\n]*/g, function(m){ return slot('<span class="jv-cm">'+m+'</span>'); });
  // strings & chars
  s = s.replace(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/g, function(m){ return slot('<span class="jv-str">'+m+'</span>'); });
  // annotations
  s = s.replace(/@\w+/g, function(m){ return slot('<span class="jv-ann">'+m+'</span>'); });
  // numbers
  s = s.replace(/\b(\d+(?:\.\d+)?[fFdDlL]?)\b/g, function(_,n){ return slot('<span class="jv-num">'+n+'</span>'); });
  // keywords
  KW.forEach(function(kw){
    s = s.replace(new RegExp('(?<![\\w])'+kw+'(?![\\w])','g'), function(m){ return slot('<span class="jv-kw">'+m+'</span>'); });
  });
  // types
  TYPES.forEach(function(t){
    s = s.replace(new RegExp('(?<![\\w])'+t+'(?![\\w])','g'), function(m){ return slot('<span class="jv-typ">'+m+'</span>'); });
  });
  // method names before (
  s = s.replace(/\b([a-z]\w*)(?=\s*\()/g, function(_,n){ return '<span class="jv-fn">'+n+'</span>'; });
  // restore slots
  s = s.replace(/\x00(\d+)\x00/g, function(_,i){ return SLOTS[+i]||''; });
  return s;
}

function CodeBlock(props) {
  var python = props.python;
  var java   = props.java;
  var _tab   = React.useState('python');
  var tab    = _tab[0];
  var setTab = _tab[1];
  var _cop   = React.useState(false);
  var copied = _cop[0];
  var setCopied = _cop[1];

  var code = tab === 'python' ? python : java;

  var highlighted = React.useMemo(function(){
    if (!code) return '';
    return tab === 'python' ? highlightPython(code) : highlightJava(code);
  }, [code, tab]);

  React.useEffect(function(){ setCopied(false); }, [tab]);

  function doCopy(e) {
    e.stopPropagation();
    navigator.clipboard.writeText(code).then(function(){
      setCopied(true);
      setTimeout(function(){ setCopied(false); }, 1800);
    }).catch(function(){});
  }

  var hasBoth = python && java;

  return React.createElement('div', { className: 'code-block-wrap', onClick: function(e){ e.stopPropagation(); } },
    React.createElement('div', { className: 'code-tab-bar' },
      React.createElement('button', {
        className: 'code-tab' + (tab==='python' ? ' active' : ''),
        onClick: function(e){ e.stopPropagation(); setTab('python'); }
      },
        React.createElement('span', { className: 'code-tab-dot python' }),
        'Python'
      ),
      hasBoth ? React.createElement('button', {
        className: 'code-tab' + (tab==='java' ? ' active' : ''),
        onClick: function(e){ e.stopPropagation(); setTab('java'); }
      },
        React.createElement('span', { className: 'code-tab-dot java' }),
        'Java'
      ) : null,
      React.createElement('div', { className: 'code-tab-actions' },
        React.createElement('button', {
          className: 'copy-btn' + (copied ? ' copied' : ''),
          onClick: doCopy
        }, copied ? '\u2713 Copied' : 'Copy')
      )
    ),
    React.createElement('div', { className: 'code-scroll' },
      React.createElement('pre', {
        className: 'code-pre',
        dangerouslySetInnerHTML: { __html: highlighted }

  );
}

function FlashCard({ problem, index, total, onPrev, onNext, hasPrev, hasNext }) {
  const [flipped, setFlipped] = useState(false);

  // Reset flip when problem changes
  useEffect(() => { setFlipped(false); }, [problem.id]);

  const handleKey = useCallback((e) => {
    if (e.key === 'ArrowRight' && hasNext) onNext();
    if (e.key === 'ArrowLeft' && hasPrev) onPrev();
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setFlipped(f => !f); }
  }, [hasNext, hasPrev, onNext, onPrev]);

  useEffect(() => {
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [handleKey]);

  // Touch-swipe state
  const touchStartX = React.useRef(null);
  const handleTouchStart = React.useCallback(e => { touchStartX.current = e.touches[0].clientX; }, []);
  const handleTouchEnd = React.useCallback(e => {
    if (touchStartX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    touchStartX.current = null;
    if (Math.abs(dx) < 40) return;           // ignore tiny swipes
    if (dx < 0 && hasNext) onNext();          // swipe left → next
    if (dx > 0 && hasPrev) onPrev();          // swipe right → prev
  }, [hasNext, hasPrev, onNext, onPrev]);

  const ArrowBtn = ({ dir, onClick, disabled }) =>
    React.createElement('button', { className: `nav-arrow nav-arrow--${dir}`, onClick, disabled, 'aria-label': dir },
      React.createElement('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' },
        React.createElement('path', { d: dir === 'prev' ? 'M15 18l-6-6 6-6' : 'M9 18l6-6-6-6' })
      )
    );

  return React.createElement('div', { style: { width: '100%', maxWidth: 720, display: 'flex', flexDirection: 'column', gap: 14 } },
    // Card stage with flanking arrows
    React.createElement('div', { className: 'card-stage' },
      React.createElement(ArrowBtn, { dir: 'prev', onClick: onPrev, disabled: !hasPrev }),
      React.createElement('div', { className: 'card-scene', onClick: () => setFlipped(f => !f), role: 'button', tabIndex: 0,
        onKeyDown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setFlipped(f => !f); }},
        onTouchStart: handleTouchStart, onTouchEnd: handleTouchEnd },
      React.createElement('div', { className: `card-inner ${flipped ? 'flipped' : ''}` },
        // Ghost sizer — invisible, always rendered, takes the max height of both faces
        React.createElement('div', { className: 'card-sizer', 'aria-hidden': 'true' },
          React.createElement('div', { className: 'card-meta', style: { marginBottom: 20 }},
            React.createElement(DiffBadge, { diff: problem.difficulty }),
            React.createElement(CatBadge, { cat: problem.category }),
            React.createElement(TagBadge, { source: problem.source }),
          ),
          React.createElement('div', { className: 'card-problem-name', style: { marginBottom: 16 }}, problem.name),
          problem.description ? React.createElement('div', { className: 'card-description' }, problem.description) : null,
          problem.example ? React.createElement('div', { className: 'card-example' }, problem.example) : null,
          React.createElement('div', { className: 'back-pattern', style: { marginBottom: 12 }}, `⟩ ${problem.pattern}`),
          React.createElement('div', { className: 'back-approach' }, problem.approach),
          React.createElement('div', { className: 'back-complexities', style: { marginTop: 20 }},
            React.createElement('div', { className: 'complexity-pill complexity-time' }, problem.timeComplexity),
            React.createElement('div', { className: 'complexity-pill complexity-space' }, problem.spaceComplexity),
          ),
          (problem.python || problem.java)
            ? React.createElement(CodeBlock, { python: problem.python, java: problem.java })
            : null
        ),
        // Front
        React.createElement('div', { className: 'card-face' },
          React.createElement('div', { className: 'card-meta' },
            React.createElement(DiffBadge, { diff: problem.difficulty }),
            React.createElement(CatBadge, { cat: problem.category }),
            React.createElement(TagBadge, { source: problem.source }),
            React.createElement('span', { className: 'card-num' }, `#${problem.id}`),
          ),
          React.createElement('div', { className: 'card-problem-name' }, problem.name),
          problem.description ? React.createElement('div', { className: 'card-description' }, problem.description) : null,
          problem.example ? React.createElement('div', { className: 'card-example' }, problem.example) : null,
          React.createElement('div', { className: 'card-hint', style: { marginTop: 'auto' } },
            React.createElement('svg', { width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
              React.createElement('path', { d: 'M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5' })),
            'Click to reveal solution'
          )
        ),
        // Back
        React.createElement('div', { className: 'card-face card-face--back' },
          React.createElement('div', { className: 'card-meta' },
            React.createElement(DiffBadge, { diff: problem.difficulty }),
            React.createElement(CatBadge, { cat: problem.category }),
            React.createElement(TagBadge, { source: problem.source }),
            React.createElement('span', { className: 'card-num' }, `#${problem.id}`),
          ),
          React.createElement('div', { className: 'back-pattern' }, `⟩ ${problem.pattern}`),
          React.createElement('div', { className: 'back-approach' }, problem.approach),
          React.createElement('div', { className: 'back-complexities' },
            React.createElement('div', { className: 'complexity-pill complexity-time' },
              React.createElement('span', { className: 'complexity-label' }, 'TIME'),
              problem.timeComplexity
            ),
            React.createElement('div', { className: 'complexity-pill complexity-space' },
              React.createElement('span', { className: 'complexity-label' }, 'SPACE'),
              problem.spaceComplexity
            ),
          ),
          (problem.python || problem.java)
            ? React.createElement(CodeBlock, { python: problem.python, java: problem.java })
            : null
        )
      )
    ),
      React.createElement(ArrowBtn, { dir: 'next', onClick: onNext, disabled: !hasNext }),
    ),
    // Counter
    React.createElement('div', { className: 'nav-counter' }, `${index + 1} / ${total}`),
    React.createElement('div', { style: { display: 'flex', gap: 8, width: '100%', maxWidth: 720 }},
      React.createElement('button', { className: 'flip-btn', onClick: () => setFlipped(f => !f) },
        flipped ? '← Hide solution' : 'Show solution →'),
    ),
    React.createElement('p', { style: { fontSize: 11, color: 'var(--muted2)', textAlign: 'center', fontFamily: 'JetBrains Mono, monospace' }},
      '← → arrow keys · Space to flip · swipe on mobile'
    )
  );
}

function App() {

  const [diffFilter, setDiffFilter] = useState('All');
  const [tagFilter, setTagFilter] = useState('All');
  const [currentIdx, setCurrentIdx] = useState(0);
  const [mode, setMode] = useState('card'); // 'card' | 'list'
  const [solved, setSolved] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem('nc250_solved') || '[]')); } catch { return new Set(); }
  });

  useEffect(() => {
    setProblems(PROBLEMS_DATA);
    setLoading(false);
  }, []);

  const categories = useMemo(() => ['All', ...new Set(problems.map(p => p.category))], [problems]);

  const filtered = useMemo(() => problems.filter(p => {
    const s = search.toLowerCase();

    return true;

  // Reset index when filter changes
  useEffect(() => { setCurrentIdx(0); }, [catFilter, diffFilter, tagFilter, search]);

  const current = filtered[currentIdx];

  const saveSolved = useCallback((set) => {
    try { localStorage.setItem('nc250_solved', JSON.stringify([...set])); } catch {}
  }, []);

  const totalSolved = useMemo(() => problems.filter(p => solved.has(p.id)).length, [problems, solved]);

  return React.createElement('div', { id: 'root' },
    // Header

        ),

          React.createElement('div', { className: 'stat-dot', style: { background: 'var(--medium)' }}),

        ),

          React.createElement('div', { className: 'stat-dot', style: { background: 'var(--hard)' }}),

    // Controls

            )
          : mode === 'card'
            ? React.createElement(FlashCard, {

                problem: current,
                index: currentIdx,

                onPrev: () => setCurrentIdx(i => Math.max(0, i - 1)),
