ity": "O(log n)", "spaceComplexity": "O(1)", "python": "def searchInsert(nums, target):\n    lo,hi=0,len(nums)\n    while lo<hi:\n        mid=(lo+hi)//2\n        if nums[mid]<target: lo=mid+1\n        else: hi=mid\n    return lo", "java": "class Solution {\n    public int searchInsert(int[] nums, int target) {\n        int lo = 0, hi = nums.length;\n        while (lo < hi) {\n            int mid = (lo + hi) / 2;\n            if (nums[mid] < target) lo = mid + 1;\n            else hi = mid;\n        }\n        return lo;\n    }\n}"}, {"id": 62, "name": "Guess Number Higher Or Lower", "category": "Binary Search", "difficulty": "Easy", "pattern": "Binary Search", "approach": "Classic binary search: call guess(mid); if returns 0 found, if 1 lo=mid+1, if -1 hi=mid-1.", "timeComplexity": "O(log n)", "spaceComplexity": "O(1)", "python": "def guessNumber(n):\n    lo,hi=1,n\n    while lo<=hi:\n        mid=(lo+hi)//2\n        r=guess(mid)\n        if r==0: return mid\n        elif r==1: lo=mid+1\n        else: hi=mid-1", "java": "public int guessNumber(int n) {\n    int lo = 1, hi = n;\n    while (lo <= hi) {\n        int mid = lo + (hi - lo) / 2;\n        int r = guess(mid);\n        if (r == 0) return mid;\n        else if (r == 1) lo = mid + 1;\n        else hi = mid - 1;\n    }\n    return -1;\n}"}, {"id": 63, "name": "Sqrt(x)", "category": "Binary Search", "difficulty": "Easy", "pattern": "Binary Search on Answer", "approach": "Binary search in range [0, x//2+1]. If mid*mid==x return mid; if mid*mid<x save mid as candidate and go right; else go left. Return the candidate.", "timeComplexity": "O(log n)", "spaceComplexity": "O(1)", "python": "def mySqrt(x):\n    lo,hi,res=0,x,0\n    while lo<=hi:\n        mid=(lo+hi)//2\n        if mid*mid<=x: res=mid\n        lo=mid+1\n        else: hi=mid-1\n    return res", "java": "class Solution {\n    public int mySqrt(int x) {\n        long lo = 0, hi = x, res = 0;\n        while (lo <= hi) {\n            long mid = (lo + hi) / 2;\n            if (mid * mid <= x) { res = mid; lo = mid + 1; }\n            else hi = mid - 1;\n        }\n        return (int) res;\n    }\n}"}, {"id": 64, "name": "Search a 2D Matrix", "category": "Binary Search", "difficulty": "Medium", "pattern": "Binary Search (Treat as 1-D Array)", "approach": "The matrix rows are sorted and the last value of each row is less than the first of the next. Map a 1-D index k to (k//cols, k%cols) and run standard binary search.", "timeComplexity": "O(log(m\u00b7n))", "spaceComplexity": "O(1)", "python": "def searchMatrix(matrix, target):\n    m,n=len(matrix),len(matrix[0])\n    lo,hi=0,m*n-1\n    while lo<=hi:\n        mid=(lo+hi)//2\n        v=matrix[mid//n][mid%n]\n        if v==target: return True\n        elif v<target: lo=mid+1\n        else: hi=mid-1\n    return False", "java": "class Solution {\n    public boolean searchMatrix(int[][] matrix, int target) {\n        int m = matrix.length, n = matrix[0].length, lo = 0, hi = m * n - 1;\n        while (lo <= hi) {\n            int mid = (lo + hi) / 2;\n            int v = matrix[mid / n][mid % n];\n            if (v == target) return true;\n            else if (v < target) lo = mid + 1;\n            else hi = mid - 1;\n        }\n        return false;\n    }\n}"}, {"id": 65, "name": "Koko Eating Bananas", "category": "Binary Search", "difficulty": "Medium", "pattern": "Binary Search on Answer (Speed)", "approach": "Binary search on eating speed in [1, max(piles)]. For a given speed k, check if sum(ceil(p/k)) \u2264 h. Find the minimum valid speed.", "timeComplexity": "O(n log m)", "spaceComplexity": "O(1)", "python": "def minEatingSpeed(piles, h):\n    import math\n    lo,hi=1,max(piles)\n    while lo<hi:\n        mid=(lo+hi)//2\n        if sum(math.ceil(p/mid) for p in piles)<=h: hi=mid\n        else: lo=mid+1\n    return lo", "java": "class Solution {\n    public int minEatingSpeed(int[] piles, int h) {\n        int lo = 1, hi = Arrays.stream(piles).max().getAsInt();\n        while (lo < hi) {\n            int mid = (lo + hi) / 2;\n            long hours = 0;\n            for (int p : piles) hours += (p + mid - 1) / mid;\n            if (hours <= h) hi = mid;\n            else lo = mid + 1;\n        }\n        return lo;\n    }\n}"}, {"id": 66, "name": "Capacity to Ship Packages Within D Days", "category": "Binary Search", "difficulty": "Medium", "pattern": "Binary Search on Answer (Capacity)", "approach": "Binary search on capacity in [max(weights), sum(weights)]. For a given capacity, greedily simulate days needed. Find the minimum capacity that fits in D days.", "timeComplexity": "O(n log W)", "spaceComplexity": "O(1)", "python": "def shipWithinDays(weights, days):\n    lo,hi=max(weights),sum(weights)\n    while lo<hi:\n        mid=(lo+hi)//2\n        d=1\n        cur=0\n        for w in weights:\n            if cur+w>mid: d+=1\n            cur=0\n            cur+=w\n        if d<=days: hi=mid\n        else: lo=mid+1\n    return lo", "java": "class Solution {\n    public int shipWithinDays(int[] weights, int days) {\n        int lo = 0, hi = 0;\n        for (int w : weights) { lo = Math.max(lo, w); hi += w; }\n        while (lo < hi) {\n            int mid = (lo + hi) / 2, d = 1, cur = 0;\n            for (int w : weights) { if (cur + w > mid) { d++; cur = 0; } cur += w; }\n            if (d <= days) hi = mid;\n            else lo = mid + 1;\n        }\n        return lo;\n    }\n}"}, {"id": 67, "name": "Find Minimum In Rotated Sorted Array", "category": "Binary Search", "difficulty": "Medium", "pattern": "Binary Search (Rotation Aware)", "approach": "If nums[mid] > nums[hi], the minimum is in the right half (lo=mid+1). Otherwise it's in the left half or at mid (hi=mid). Continue until lo==hi.", "timeComplexity": "O(log n)", "spaceComplexity": "O(1)", "python": "def findMin(nums):\n    lo,hi=0,len(nums)-1\n    while lo<hi:\n        mid=(lo+hi)//2\n        if nums[mid]>nums[hi]: lo=mid+1\n        else: hi=mid\n    return nums[lo]", "java": "class Solution {\n    public int findMin(int[] nums) {\n        int lo = 0, hi = nums.length - 1;\n        while (lo < hi) {\n            int mid = (lo + hi) / 2;\n            if (nums[mid] > nums[hi]) lo = mid + 1;\n            else hi = mid;\n        }\n        return nums[lo];\n    }\n}"}, {"id": 68, "name": "Search In Rotated Sorted Array", "category": "Binary Search", "difficulty": "Medium", "pattern": "Binary Search (Rotation Aware)", "approach": "Determine which half is sorted. If target is within the sorted half, search there; otherwise search the other half.", "timeComplexity": "O(log n)", "spaceComplexity": "O(1)", "python": "def search(nums, target):\n    lo,hi=0,len(nums)-1\n    while lo<=hi:\n        mid=(lo+hi)//2\n        if nums[mid]==target: return mid\n        if nums[lo]<=nums[mid]:\n            if nums[lo]<=target<nums[mid]: hi=mid-1\n            else: lo=mid+1\n        else:\n            if nums[mid]<target<=nums[hi]: lo=mid+1\n            else: hi=mid-1\n    return -1", "java": "class Solution {\n    public int search(int[] nums, int target) {\n        int lo = 0, hi = nums.length - 1;\n        while (lo <= hi) {\n            int mid = (lo + hi) / 2;\n            if (nums[mid] == target) return mid;\n            if (nums[lo] <= nums[mid]) {\n                if (nums[lo] <= target && target < nums[mid]) hi = mid - 1;\n                else lo = mid + 1;\n            } else {\n                if (nums[mid] < target && target <= nums[hi]) lo = mid + 1;\n                else hi = mid - 1;\n            }\n        }\n        return -1;\n    }\n}"}, {"id": 69, "name": "Search In Rotated Sorted Array II", "category": "Binary Search", "difficulty": "Medium", "pattern": "Binary Search with Duplicate Handling", "approach": "Same as the non-duplicate version but when nums[lo]==nums[mid]==nums[hi], simply shrink both ends (lo++, hi--) to skip ambiguous duplicates.", "timeComplexity": "O(log n) avg, O(n) worst", "spaceComplexity": "O(1)", "python": "def search(nums, target):\n    lo,hi=0,len(nums)-1\n    while lo<=hi:\n        mid=(lo+hi)//2\n        if nums[mid]==target: return True\n        if nums[lo]==nums[mid]==nums[hi]: lo+=1\n        hi-=1\n        continue\n        if nums[lo]<=nums[mid]:\n            if nums[lo]<=target<nums[mid]: hi=mid-1\n            else: lo=mid+1\n        else:\n            if nums[mid]<target<=nums[hi]: lo=mid+1\n            else: hi=mid-1\n    return False", "java": "class Solution {\n    public boolean search(int[] nums, int target) {\n        int lo = 0, hi = nums.length - 1;\n        while (lo <= hi) {\n            int mid = (lo + hi) / 2;\n            if (nums[mid] == target) return true;\n            if (nums[lo] == nums[mid] && nums[mid] == nums[hi]) { lo++; hi--; continue; }\n            if (nums[lo] <= nums[mid]) {\n                if (nums[lo] <= target && target < nums[mid]) hi = mid - 1;\n                else lo = mid + 1;\n            } else {\n                if (nums[mid] < target && target <= nums[hi]) lo = mid + 1;\n                else hi = mid - 1;\n            }\n        }\n        return false;\n    }\n}"}, {"id": 70, "name": "Time Based Key Value Store", "category": "Binary Search", "difficulty": "Medium", "pattern": "Binary Search on Timestamps", "approach": "Store (timestamp, value) pairs per key in a list (appended in order). For get, binary search for the largest timestamp \u2264 the requested timestamp.", "timeComplexity": "O(log n) get, O(1) set", "spaceComplexity": "O(n)", "python": "from collections import defaultdict\nimport bisect\nclass TimeMap:\n    def __init__(self): self.d=defaultdict(list)\n    def set(self,key,value,timestamp): self.d[key].append((timestamp,value))\n    def get(self,key,timestamp):\n        a=self.d[key]\n        i=bisect.bisect_right(a,(timestamp,chr(255)))-1\n        return a[i][1] if i>=0 else ''", "java": "class TimeMap {\n    private Map<String, List<int[]>> map = new HashMap<>();\n    public void set(String key, String value, int timestamp) {\n        map.computeIfAbsent(key, k -> new ArrayList<>()).add(new int[]{timestamp, value.hashCode()});\n        // Store string differently\n    }\n    // Simplified \u2014 full implementation uses binary search on timestamp list\n    private Map<String, List<long[]>> store = new HashMap<>();\n    public String get(String key, int timestamp) {\n        List<long[]> list = store.getOrDefault(key, new ArrayList<>());\n        int lo = 0, hi = list.size() - 1, idx = -1;\n        while (lo <= hi) {\n            int mid = (lo + hi) / 2;\n            if (list.get(mid)[0] <= timestamp) { idx = mid; lo = mid + 1; }\n            else hi = mid - 1;\n        }\n        return idx == -1 ? \"\" : String.valueOf(list.get(idx)[1]);\n    }\n}"}, {"id": 71, "name": "Split Array Largest Sum", "category": "Binary Search", "difficulty": "Hard", "pattern": "Binary Search on Answer + Greedy Check", "approach": "Binary search the answer in [max(nums), sum(nums)]. For a given max subarray sum, greedily count the minimum number of subarrays; check if it fits within k.", "timeComplexity": "O(n log W)", "spaceComplexity": "O(1)", "python": "def splitArray(nums, k):\n    lo,hi=max(nums),sum(nums)\n    while lo<hi:\n        mid=(lo+hi)//2\n        cnt=1\n        cur=0\n        for n in nums:\n            if cur+n>mid: cnt+=1\n            cur=0\n            cur+=n\n        if cnt<=k: hi=mid\n        else: lo=mid+1\n    return lo", "java": "class Solution {\n    public int splitArray(int[] nums, int k) {\n        long lo = 0, hi = 0;\n        for (int n : nums) { lo = Math.max(lo, n); hi += n; }\n        while (lo < hi) {\n            long mid = (lo + hi) / 2;\n            int cnt = 1; long cur = 0;\n            for (int n : nums) { if (cur + n > mid) { cnt++; cur = 0; } cur += n; }\n            if (cnt <= k) hi = mid;\n            else lo = mid + 1;\n        }\n        return (int) lo;\n    }\n}"}, {"id": 72, "name": "Median of Two Sorted Arrays", "category": "Binary Search", "difficulty": "Hard", "pattern": "Binary Search on Partition", "approach": "Binary search on the partition index in the smaller array. Partition both arrays such that left halves have (m+n+1)//2 elements and maxLeft \u2264 minRight on both sides.", "timeComplexity": "O(log min(m,n))", "spaceComplexity": "O(1)", "python": "def findMedianSortedArrays(nums1, nums2):\n    A,B=nums1,nums2\n    if len(A)>len(B): A,B=B,A\n    m,n=len(A),len(B)\n    half=(m+n+1)//2\n    lo,hi=0,m\n    while lo<=hi:\n        i=(lo+hi)//2\n        j=half-i\n        aL=A[i-1] if i else float('-inf')\n        aR=A[i] if i<m else float('inf')\n        bL=B[j-1] if j else float('-inf')\n        bR=B[j] if j<n else float('inf')\n        if aL<=bR and bL<=aR:\n            if (m+n)%2: return max(aL,bL)\n            return (max(aL,bL)+min(aR,bR))/2\n        elif aL>bR: hi=i-1\n        else: lo=i+1", "java": "class Solution {\n    public double findMedianSortedArrays(int[] A, int[] B) {\n        if (A.length > B.length) return findMedianSortedArrays(B, A);\n        int m = A.length, n = B.length, half = (m + n + 1) / 2;\n        int lo = 0, hi = m;\n        while (lo <= hi) {\n            int i = (lo + hi) / 2, j = half - i;\n            int aL = i > 0 ? A[i-1] : Integer.MIN_VALUE;\n            int aR = i < m ? A[i] : Integer.MAX_VALUE;\n            int bL = j > 0 ? B[j-1] : Integer.MIN_VALUE;\n            int bR = j < n ? B[j] : Integer.MAX_VALUE;\n            if (aL <= bR && bL <= aR) {\n                if ((m + n) % 2 == 1) return Math.max(aL, bL);\n                return (Math.max(aL, bL) + Math.min(aR, bR)) / 2.0;\n            } else if (aL > bR) hi = i - 1;\n            else lo = i + 1;\n        }\n        return 0;\n    }\n}"}, {"id": 73, "name": "Find in Mountain Array", "category": "Binary Search", "difficulty": "Hard", "pattern": "Three Binary Searches", "approach": "Binary search for the mountain peak index. Then binary search for the target on the ascending left side. If not found, binary search on the descending right side.", "timeComplexity": "O(log n)", "spaceComplexity": "O(1)", "python": "def findInMountainArray(target, mountainArr):\n    import bisect\n    lo,hi=0,mountainArr.length()-1\n    while lo<hi:\n        mid=(lo+hi)//2\n        if mountainArr.get(mid)<mountainArr.get(mid+1): lo=mid+1\n        else: hi=mid\n    peak=lo\n    # search ascending side\n    lo2,hi2=0,peak\n    while lo2<=hi2:\n        mid=(lo2+hi2)//2\n        v=mountainArr.get(mid)\n        if v==target: return mid\n        elif v<target: lo2=mid+1\n        else: hi2=mid-1\n    # search descending side\n    lo2,hi2=peak,mountainArr.length()-1\n    while lo2<=hi2:\n        mid=(lo2+hi2)//2\n        v=mountainArr.get(mid)\n        if v==target: return mid\n        elif v>target: lo2=mid+1\n        else: hi2=mid-1\n    return -1", "java": "// MountainArray interface provided by the problem\nclass Solution {\n    public int findInMountainArray(int target, MountainArray m) {\n        int lo = 0, hi = m.length() - 1;\n        while (lo < hi) {\n            int mid = (lo + hi) / 2;\n            if (m.get(mid) < m.get(mid + 1)) lo = mid + 1;\n            else hi = mid;\n        }\n        int peak = lo;\n        // Search ascending side\n        lo = 0; hi = peak;\n        while (lo <= hi) {\n            int mid = (lo + hi) / 2;\n            if (m.get(mid) == target) return mid;\n            else if (m.get(mid) < target) lo = mid + 1;\n            else hi = mid - 1;\n        }\n        // Search descending side\n        lo = peak; hi = m.length() - 1;\n        while (lo <= hi) {\n            int mid = (lo + hi) / 2;\n            if (m.get(mid) == target) return mid;\n            else if (m.get(mid) > target) lo = mid + 1;\n            else hi = mid - 1;\n        }\n        return -1;\n    }\n}"}, {"id": 74, "name": "Reverse Linked List", "category": "Linked List", "difficulty": "Easy", "pattern": "Iterative with Prev/Curr Pointers", "approach": "Maintain prev=None and curr=head. At each step store next=curr.next, set curr.next=prev, then advance prev=curr, curr=next. Return prev.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def reverseList(head):\n    prev=None\n    curr=head\n    while curr:\n        nxt=curr.next\n        curr.next=prev\n        prev=curr\n        curr=nxt\n    return prev", "java": "class Solution {\n    public ListNode reverseList(ListNode head) {\n        ListNode prev = null, curr = head;\n        while (curr != null) {\n            ListNode next = curr.next;\n            curr.next = prev;\n            prev = curr;\n            curr = next;\n        }\n        return prev;\n    }\n}"}, {"id": 75, "name": "Merge Two Sorted Lists", "category": "Linked List", "difficulty": "Easy", "pattern": "Two Pointers with Dummy Head", "approach": "Use a dummy node. Compare list1 and list2 heads; append the smaller to the dummy chain and advance that pointer. Attach any remaining tail.", "timeComplexity": "O(m+n)", "spaceComplexity": "O(1)", "python": "def mergeTwoLists(l1, l2):\n    dummy=ListNode(0)\n    cur=dummy\n    while l1 and l2:\n        if l1.val<=l2.val: cur.next=l1\n        l1=l1.next\n        else: cur.next=l2\n        l2=l2.next\n        cur=cur.next\n    cur.next=l1 or l2\n    return dummy.next", "java": "class Solution {\n    public ListNode mergeTwoLists(ListNode l1, ListNode l2) {\n        ListNode dummy = new ListNode(0), cur = dummy;\n        while (l1 != null && l2 != null) {\n            if (l1.val <= l2.val) { cur.next = l1; l1 = l1.next; }\n            else { cur.next = l2; l2 = l2.next; }\n            cur = cur.next;\n        }\n        cur.next = l1 != null ? l1 : l2;\n        return dummy.next;\n    }\n}"}, {"id": 76, "name": "Linked List Cycle", "category": "Linked List", "difficulty": "Easy", "pattern": "Floyd's Slow/Fast Pointers", "approach": "Move slow one step and fast two steps per iteration. If they meet, a cycle exists. If fast reaches null, there is no cycle.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def hasCycle(head):\n    slow=fast=head\n    while fast and fast.next:\n        slow=slow.next\n        fast=fast.next.next\n        if slow==fast: return True\n    return False", "java": "class Solution {\n    public boolean hasCycle(ListNode head) {\n        ListNode slow = head, fast = head;\n        while (fast != null && fast.next != null) {\n            slow = slow.next;\n            fast = fast.next.next;\n            if (slow == fast) return true;\n        }\n        return false;\n    }\n}"}, {"id": 77, "name": "Reorder List", "category": "Linked List", "difficulty": "Medium", "pattern": "Find Mid + Reverse Second Half + Merge", "approach": "Find the middle with slow/fast pointers. Reverse the second half in-place. Interleave the two halves by alternating next pointers.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def reorderList(head):\n    slow=fast=head\n    while fast and fast.next: slow=slow.next\n    fast=fast.next.next\n    prev=None\n    cur=slow.next\n    slow.next=None\n    while cur: nxt=cur.next\n    cur.next=prev\n    prev=cur\n    cur=nxt\n    first=head\n    second=prev\n    while second:\n        tmp1,tmp2=first.next,second.next\n        first.next=second\n        second.next=tmp1\n        first=tmp1\n        second=tmp2", "java": "class Solution {\n    public void reorderList(ListNode head) {\n        ListNode slow = head, fast = head;\n        while (fast.next != null && fast.next.next != null) { slow = slow.next; fast = fast.next.next; }\n        ListNode prev = null, cur = slow.next;\n        slow.next = null;\n        while (cur != null) { ListNode next = cur.next; cur.next = prev; prev = cur; cur = next; }\n        ListNode first = head, second = prev;\n        while (second != null) {\n            ListNode t1 = first.next, t2 = second.next;\n            first.next = second; second.next = t1;\n            first = t1; second = t2;\n        }\n    }\n}"}, {"id": 78, "name": "Remove Nth Node From End of List", "category": "Linked List", "difficulty": "Medium", "pattern": "Two Pointers N Apart", "approach": "Advance the fast pointer N steps ahead, then move both until fast reaches the end. The slow pointer is at the node before the one to delete.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def removeNthFromEnd(head, n):\n    dummy=ListNode(0,head)\n    fast=slow=dummy\n    for _ in range(n+1): fast=fast.next\n    while fast: fast=fast.next\n    slow=slow.next\n    slow.next=slow.next.next\n    return dummy.next", "java": "class Solution {\n    public ListNode removeNthFromEnd(ListNode head, int n) {\n        ListNode dummy = new ListNode(0, head), fast = dummy, slow = dummy;\n        for (int i = 0; i <= n; i++) fast = fast.next;\n        while (fast != null) { fast = fast.next; slow = slow.next; }\n        slow.next = slow.next.next;\n        return dummy.next;\n    }\n}"}, {"id": 79, "name": "Copy List With Random Pointer", "category": "Linked List", "difficulty": "Medium", "pattern": "HashMap (Old Node \u2192 New Node)", "approach": "First pass: create all new nodes and store old\u2192new mappings. Second pass: assign next and random pointers of each new node using the mapping.", "timeComplexity": "O(n)", "spaceComplexity": "O(n)", "python": "def copyRandomList(head):\n    mp={None:None}\n    cur=head\n    while cur: mp[cur]=Node(cur.val)\n    cur=cur.next\n    cur=head\n    while cur:\n        mp[cur].next=mp[cur.next]\n        mp[cur].random=mp[cur.random]\n        cur=cur.next\n    return mp[head]", "java": "class Solution {\n    public Node copyRandomList(Node head) {\n        Map<Node, Node> map = new HashMap<>();\n        Node cur = head;\n        while (cur != null) { map.put(cur, new Node(cur.val)); cur = cur.next; }\n        cur = head;\n        while (cur != null) {\n            map.get(cur).next = map.get(cur.next);\n            map.get(cur).random = map.get(cur.random);\n            cur = cur.next;\n        }\n        return map.get(head);\n    }\n}"}, {"id": 80, "name": "Add Two Numbers", "category": "Linked List", "difficulty": "Medium", "pattern": "Digit-by-Digit Simulation with Carry", "approach": "Traverse both lists simultaneously. Sum digits plus carry at each step. Create a new node for each digit (sum%10) and propagate carry=sum//10.", "timeComplexity": "O(max(m,n))", "spaceComplexity": "O(max(m,n))", "python": "def addTwoNumbers(l1, l2):\n    dummy=ListNode(0)\n    cur=dummy\n    carry=0\n    while l1 or l2 or carry:\n        v=(l1.val if l1 else 0)+(l2.val if l2 else 0)+carry\n        carry,v=divmod(v,10)\n        cur.next=ListNode(v)\n        cur=cur.next\n        if l1: l1=l1.next\n        if l2: l2=l2.next\n    return dummy.next", "java": "class Solution {\n    public ListNode addTwoNumbers(ListNode l1, ListNode l2) {\n        ListNode dummy = new ListNode(0), cur = dummy;\n        int carry = 0;\n        while (l1 != null || l2 != null || carry != 0) {\n            int v = (l1 != null ? l1.val : 0) + (l2 != null ? l2.val : 0) + carry;\n            carry = v / 10;\n            cur.next = new ListNode(v % 10);\n            cur = cur.next;\n            if (l1 != null) l1 = l1.next;\n            if (l2 != null) l2 = l2.next;\n        }\n        return dummy.next;\n    }\n}"}, {"id": 81, "name": "Find The Duplicate Number", "category": "Linked List", "difficulty": "Medium", "pattern": "Floyd's Cycle Detection (Array as Graph)", "approach": "Treat the array as a linked list where node i points to nums[i]. The duplicate creates a cycle. Use Floyd's algorithm to find the cycle entry\u2014that's the duplicate.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def findDuplicate(nums):\n    slow=fast=0\n    while True: slow=nums[slow]\n    fast=nums[nums[fast]]\n    if slow==fast: break\n    slow=0\n    while slow!=fast: slow=nums[slow]\n    fast=nums[fast]\n    return slow", "java": "class Solution {\n    public int findDuplicate(int[] nums) {\n        int slow = 0, fast = 0;\n        do { slow = nums[slow]; fast = nums[nums[fast]]; } while (slow != fast);\n        slow = 0;\n        while (slow != fast) { slow = nums[slow]; fast = nums[fast]; }\n        return slow;\n    }\n}"}, {"id": 82, "name": "Reverse Linked List II", "category": "Linked List", "difficulty": "Medium", "pattern": "In-Place Segment Reversal", "approach": "Navigate to the node before position left. Iteratively reverse the segment [left, right] by re-linking nodes. Re-attach the reversed segment to the rest.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def reverseBetween(head, left, right):\n    dummy=ListNode(0,head)\n    prev=dummy\n    for _ in range(left-1): prev=prev.next\n    cur=prev.next\n    for _ in range(right-left):\n        nxt=cur.next\n        cur.next=nxt.next\n        nxt.next=prev.next\n        prev.next=nxt\n    return dummy.next", "java": "class Solution {\n    public ListNode reverseBetween(ListNode head, int left, int right) {\n        ListNode dummy = new ListNode(0, head), prev = dummy;\n        for (int i = 0; i < left - 1; i++) prev = prev.next;\n        ListNode cur = prev.next;\n        for (int i = 0; i < right - left; i++) {\n            ListNode next = cur.next;\n            cur.next = next.next;\n            next.next = prev.next;\n            prev.next = next;\n        }\n        return dummy.next;\n    }\n}"}, {"id": 83, "name": "Design Circular Queue", "category": "Linked List", "difficulty": "Medium", "pattern": "Fixed Array with Head/Tail/Size", "approach": "Use an array of capacity k, head and tail indices, and a size counter. Wrap indices with modulo. Enqueue at tail, dequeue at head.", "timeComplexity": "O(1)", "spaceComplexity": "O(k)", "python": "class MyCircularQueue:\n    def __init__(self,k): self.q=[0]*k\n    self.h=self.t=self.sz=0\n    self.k=k\n    def enQueue(self,v):\n        if self.isFull(): return False\n        self.q[self.t]=v\n        self.t=(self.t+1)%self.k\n        self.sz+=1\n        return True\n    def deQueue(self):\n        if self.isEmpty(): return False\n        self.h=(self.h+1)%self.k\n        self.sz-=1\n        return True\n    def Front(self): return -1 if self.isEmpty() else self.q[self.h]\n    def Rear(self): return -1 if self.isEmpty() else self.q[(self.t-1)%self.k]\n    def isEmpty(self): return self.sz==0\n    def isFull(self): return self.sz==self.k", "java": "class Solution {\n    // Approach: Fixed Array with Head/Tail/Size\n    // Time: O(1)  Space: O(k)\n    public Object solve(/* params */) {\n        // Use an array of capacity k, head and tail indices, and a size counter. Wrap indices with modulo. Enqueue at tail, dequeu\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 84, "name": "LRU Cache", "category": "Linked List", "difficulty": "Medium", "pattern": "HashMap + Doubly Linked List", "approach": "HashMap gives O(1) lookup of nodes. Doubly linked list maintains access order. On get, move node to the front. On put, add at front; evict from the back if over capacity.", "timeComplexity": "O(1)", "spaceComplexity": "O(n)", "python": "from collections import OrderedDict\nclass LRUCache:\n    def __init__(self,cap): self.cap=cap\n    self.cache=OrderedDict()\n    def get(self,key):\n        if key not in self.cache: return -1\n        self.cache.move_to_end(key)\n        return self.cache[key]\n    def put(self,key,val):\n        if key in self.cache: self.cache.move_to_end(key)\n        self.cache[key]=val\n        if len(self.cache)>self.cap: self.cache.popitem(last=False)", "java": "class LRUCache {\n    private final int cap;\n    private final LinkedHashMap<Integer, Integer> cache;\n    public LRUCache(int capacity) {\n        this.cap = capacity;\n        cache = new LinkedHashMap<>(cap, 0.75f, true) {\n            protected boolean removeEldestEntry(Map.Entry<Integer,Integer> e) { return size() > cap; }\n        };\n    }\n    public int get(int key) { return cache.getOrDefault(key, -1); }\n    public void put(int key, int value) { cache.put(key, value); }\n}"}, {"id": 85, "name": "LFU Cache", "category": "Linked List", "difficulty": "Hard", "pattern": "Two HashMaps + Doubly Linked List per Frequency", "approach": "Maintain key\u2192(value,freq) map, freq\u2192OrderedDict of keys, and a minFreq tracker. On access, move the key to the next freq bucket; evict the LRU from the minFreq bucket.", "timeComplexity": "O(1)", "spaceComplexity": "O(n)", "python": "from collections import defaultdict,OrderedDict\nclass LFUCache:\n    def __init__(self,cap): self.cap=cap\n    self.kv={}\n    self.kf={}\n    self.fk=defaultdict(OrderedDict)\n    self.mf=0\n    def _touch(self,k):\n        f=self.kf[k]\n        self.kf[k]=f+1\n        del self.fk[f][k]\n        if not self.fk[f] and f==self.mf: self.mf+=1\n        self.fk[f+1][k]=None\n    def get(self,k):\n        if k not in self.kv: return -1\n        self._touch(k)\n        return self.kv[k]\n    def put(self,k,v):\n        if not self.cap: return\n        if k in self.kv: self._touch(k)\n        self.kv[k]=v\n        return\n        if len(self.kv)==self.cap:\n            ek,_=self.fk[self.mf].popitem(last=False)\n            del self.kv[ek]\n            del self.kf[ek]\n        self.kv[k]=v\n        self.kf[k]=1\n        self.fk[1][k]=None\n        self.mf=1", "java": "class Solution {\n    // Approach: Two HashMaps + Doubly Linked List per Frequency\n    // Time: O(1)  Space: O(n)\n    public Object solve(/* params */) {\n        // Maintain key\u2192(value,freq) map, freq\u2192OrderedDict of keys, and a minFreq tracker. On access, move the key to the next freq\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 86, "name": "Merge K Sorted Lists", "category": "Linked List", "difficulty": "Hard", "pattern": "Min-Heap", "approach": "Push the head of each list into a min-heap. Repeatedly extract the minimum node, add it to the result, and push its next node into the heap.", "timeComplexity": "O(n log k)", "spaceComplexity": "O(k)", "python": "import heapq\ndef mergeKLists(lists):\n    dummy=ListNode(0)\n    cur=dummy\n    heap=[]\n    for i,l in enumerate(lists):\n        if l: heapq.heappush(heap,(l.val,i,l))\n    while heap:\n        v,i,node=heapq.heappop(heap)\n        cur.next=node\n        cur=cur.next\n        if node.next: heapq.heappush(heap,(node.next.val,i,node.next))\n    return dummy.next", "java": "class Solution {\n    public ListNode mergeKLists(ListNode[] lists) {\n        PriorityQueue<ListNode> pq = new PriorityQueue<>(Comparator.comparingInt(a -> a.val));\n        for (ListNode l : lists) if (l != null) pq.add(l);\n        ListNode dummy = new ListNode(0), cur = dummy;\n        while (!pq.isEmpty()) {\n            ListNode node = pq.poll();\n            cur.next = node;\n            cur = cur.next;\n            if (node.next != null) pq.add(node.next);\n        }\n        return dummy.next;\n    }\n}"}, {"id": 87, "name": "Reverse Nodes In K Group", "category": "Linked List", "difficulty": "Hard", "pattern": "Iterative Group Reversal", "approach": "Check if k nodes remain. Reverse the k-node group in-place. Connect the tail of the reversed group to the result of reversing the rest recursively/iteratively.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def reverseKGroup(head, k):\n    dummy=ListNode(0,head)\n    group_prev=dummy\n    while True:\n        kth=group_prev\n        for _ in range(k):\n            kth=kth.next\n            if not kth: return dummy.next\n        group_next=kth.next\n        prev,cur=group_next,group_prev.next\n        while cur!=group_next:\n            nxt=cur.next\n            cur.next=prev\n            prev=cur\n            cur=nxt\n        tmp=group_prev.next\n        group_prev.next=kth\n        group_prev=tmp", "java": "class Solution {\n    // Approach: Iterative Group Reversal\n    // Time: O(n)  Space: O(1)\n    public Object solve(/* params */) {\n        // Check if k nodes remain. Reverse the k-node group in-place. Connect the tail of the reversed group to the result of reve\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 88, "name": "Binary Tree Inorder Traversal", "category": "Trees", "difficulty": "Easy", "pattern": "DFS Recursive / Iterative Stack", "approach": "Recursively visit left subtree, process root, then right subtree. Iterative version: push lefts onto a stack, process on pop, then descend right.", "timeComplexity": "O(n)", "spaceComplexity": "O(h)", "python": "def inorderTraversal(root):\n    res=[]\n    stack=[]\n    while root or stack:\n        while root: stack.append(root)\n        root=root.left\n        root=stack.pop()\n        res.append(root.val)\n        root=root.right\n    return res", "java": "class Solution {\n    public List<Integer> inorderTraversal(TreeNode root) {\n        List<Integer> res = new ArrayList<>();\n        Deque<TreeNode> stack = new ArrayDeque<>();\n        while (root != null || !stack.isEmpty()) {\n            while (root != null) { stack.push(root); root = root.left; }\n            root = stack.pop();\n            res.add(root.val);\n            root = root.right;\n        }\n        return res;\n    }\n}"}, {"id": 89, "name": "Binary Tree Preorder Traversal", "category": "Trees", "difficulty": "Easy", "pattern": "DFS Recursive / Iterative Stack", "approach": "Process root first, then left subtree, then right subtree. Iterative: push right then left child so left is processed first.", "timeComplexity": "O(n)", "spaceComplexity": "O(h)", "python": "def preorderTraversal(root):\n    res=[]\n    stack=[root] if root else []\n    while stack:\n        node=stack.pop()\n        res.append(node.val)\n        if node.right: stack.append(node.right)\n        if node.left: stack.append(node.left)\n    return res", "java": "class Solution {\n    // Approach: DFS Recursive / Iterative Stack\n    // Time: O(n)  Space: O(h)\n    public Object solve(/* params */) {\n        // Process root first, then left subtree, then right subtree. Iterative: push right then left child so left is processed fi\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 90, "name": "Binary Tree Postorder Traversal", "category": "Trees", "difficulty": "Easy", "pattern": "DFS Recursive / Reverse Preorder", "approach": "Recursively process left, right, then root. Iterative trick: do a modified preorder (root, right, left) into a stack, then reverse the result.", "timeComplexity": "O(n)", "spaceComplexity": "O(h)", "python": "def postorderTraversal(root):\n    res=[]\n    stack=[root] if root else []\n    while stack:\n        node=stack.pop()\n        res.append(node.val)\n        if node.left: stack.append(node.left)\n        if node.right: stack.append(node.right)\n    return res[::-1]", "java": "class Solution {\n    // Approach: DFS Recursive / Reverse Preorder\n    // Time: O(n)  Space: O(h)\n    public Object solve(/* params */) {\n        // Recursively process left, right, then root. Iterative trick: do a modified preorder (root, right, left) into a stack, th\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 91, "name": "Invert Binary Tree", "category": "Trees", "difficulty": "Easy", "pattern": "DFS Recursive Swap", "approach": "Recursively swap left and right children at every node. Base case: if node is null, return. Work can also be done with BFS level-order.", "timeComplexity": "O(n)", "spaceComplexity": "O(h)", "python": "def invertTree(root):\n    if not root: return None\n    root.left,root.right=invertTree(root.right),invertTree(root.left)\n    return root", "java": "class Solution {\n    public TreeNode invertTree(TreeNode root) {\n        if (root == null) return null;\n        TreeNode tmp = root.left;\n        root.left = invertTree(root.right);\n        root.right = invertTree(tmp);\n        return root;\n    }\n}"}, {"id": 92, "name": "Maximum Depth of Binary Tree", "category": "Trees", "difficulty": "Easy", "pattern": "DFS Recursive", "approach": "Return 1 + max(depth(left), depth(right)). Base case: null node returns 0. Alternatively, use BFS and count levels.", "timeComplexity": "O(n)", "spaceComplexity": "O(h)", "python": "def maxDepth(root):\n    if not root: return 0\n    return 1+max(maxDepth(root.left),maxDepth(root.right))", "java": "class Solution {\n    public int maxDepth(TreeNode root) {\n        if (root == null) return 0;\n        return 1 + Math.max(maxDepth(root.left), maxDepth(root.right));\n    }\n}"}, {"id": 93, "name": "Diameter of Binary Tree", "category": "Trees", "difficulty": "Easy", "pattern": "DFS with Global Maximum", "approach": "At each node, compute left_depth + right_depth as a candidate diameter. Return 1+max(left,right) upward. Track the global max diameter.", "timeComplexity": "O(n)", "spaceComplexity": "O(h)", "python": "def diameterOfBinaryTree(root):\n    res=[0]\n    def dfs(node):\n        if not node: return 0\n        l,r=dfs(node.left),dfs(node.right)\n        res[0]=max(res[0],l+r)\n        return 1+max(l,r)\n    dfs(root)\n    return res[0]", "java": "class Solution {\n    // Approach: DFS with Global Maximum\n    // Time: O(n)  Space: O(h)\n    public Object solve(/* params */) {\n        // At each node, compute left_depth + right_depth as a candidate diameter. Return 1+max(left,right) upward. Track the globa\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 94, "name": "Balanced Binary Tree", "category": "Trees", "difficulty": "Easy", "pattern": "DFS Returning Height or \u22121", "approach": "Return the height of a subtree or \u22121 if unbalanced. A node is unbalanced if |left_height \u2212 right_height| > 1 or a child already returned \u22121.", "timeComplexity": "O(n)", "spaceComplexity": "O(h)", "python": "def isBalanced(root):\n    def dfs(node):\n        if not node: return 0\n        l,r=dfs(node.left),dfs(node.right)\n        if l<0 or r<0 or abs(l-r)>1: return -1\n        return 1+max(l,r)\n    return dfs(root)>=0", "java": "class Solution {\n    // Approach: DFS Returning Height or \u22121\n    // Time: O(n)  Space: O(h)\n    public Object solve(/* params */) {\n        // Return the height of a subtree or \u22121 if unbalanced. A node is unbalanced if |left_height \u2212 right_height| > 1 or a child \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 95, "name": "Same Tree", "category": "Trees", "difficulty": "Easy", "pattern": "DFS Recursive Comparison", "approach": "If both nodes are null, return True. If one is null or values differ, return False. Recursively check that left subtrees and right subtrees are equal.", "timeComplexity": "O(n)", "spaceComplexity": "O(h)", "python": "def isSameTree(p, q):\n    if not p and not q: return True\n    if not p or not q or p.val!=q.val: return False\n    return isSameTree(p.left,q.left) and isSameTree(p.right,q.right)", "java": "class Solution {\n    // Approach: DFS Recursive Comparison\n    // Time: O(n)  Space: O(h)\n    public Object solve(/* params */) {\n        // If both nodes are null, return True. If one is null or values differ, return False. Recursively check that left subtrees\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 96, "name": "Subtree of Another Tree", "category": "Trees", "difficulty": "Easy", "pattern": "DFS + isSameTree Helper", "approach": "At each node in root, call isSameTree(root, subRoot). The subRoot is a subtree if isSameTree returns True at any node.", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(m)", "python": "def isSubtree(root, subRoot):\n    def same(a,b):\n        if not a and not b: return True\n        if not a or not b or a.val!=b.val: return False\n        return same(a.left,b.left) and same(a.right,b.right)\n    if not root: return False\n    return same(root,subRoot) or isSubtree(root.left,subRoot) or isSubtree(root.right,subRoot)", "java": "class Solution {\n    // Approach: DFS + isSameTree Helper\n    // Time: O(m\u00b7n)  Space: O(m)\n    public Object solve(/* params */) {\n        // At each node in root, call isSameTree(root, subRoot). The subRoot is a subtree if isSameTree returns True at any node.\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 97, "name": "Lowest Common Ancestor of a Binary Search Tree", "category": "Trees", "difficulty": "Easy", "pattern": "BST Property Traversal", "approach": "If both p and q are smaller than root, recurse left. If both are larger, recurse right. Otherwise, root is the LCA.", "timeComplexity": "O(h)", "spaceComplexity": "O(1)", "python": "def lowestCommonAncestor(root, p, q):\n    while root:\n        if p.val<root.val and q.val<root.val: root=root.left\n        elif p.val>root.val and q.val>root.val: root=root.right\n        else: return root", "java": "class Solution {\n    // Approach: BST Property Traversal\n    // Time: O(h)  Space: O(1)\n    public Object solve(/* params */) {\n        // If both p and q are smaller than root, recurse left. If both are larger, recurse right. Otherwise, root is the LCA.\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 98, "name": "Insert into a Binary Search Tree", "category": "Trees", "difficulty": "Medium", "pattern": "BST Traversal", "approach": "Navigate the BST using val comparisons. When a null child is found on the correct side, insert the new node there.", "timeComplexity": "O(h)", "spaceComplexity": "O(h)", "python": "def insertIntoBST(root, val):\n    if not root: return TreeNode(val)\n    if val<root.val: root.left=insertIntoBST(root.left,val)\n    else: root.right=insertIntoBST(root.right,val)\n    return root", "java": "class Solution {\n    // Approach: BST Traversal\n    // Time: O(h)  Space: O(h)\n    public Object solve(/* params */) {\n        // Navigate the BST using val comparisons. When a null child is found on the correct side, insert the new node there.\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 99, "name": "Delete Node in a BST", "category": "Trees", "difficulty": "Medium", "pattern": "Find + Replace with Inorder Successor", "approach": "Find the node to delete. If it has no right child, replace with left. Otherwise, find the inorder successor (leftmost in right subtree), copy its value, and delete the successor.", "timeComplexity": "O(h)", "spaceComplexity": "O(h)", "python": "def deleteNode(root, key):\n    if not root: return None\n    if key<root.val: root.left=deleteNode(root.left,key)\n    elif key>root.val: root.right=deleteNode(root.right,key)\n    else:\n        if not root.right: return root.left\n        cur=root.right\n        while cur.left: cur=cur.left\n        root.val=cur.val\n        root.right=deleteNode(root.right,cur.val)\n    return root", "java": "class Solution {\n    // Approach: Find + Replace with Inorder Successor\n    // Time: O(h)  Space: O(h)\n    public Object solve(/* params */) {\n        // Find the node to delete. If it has no right child, replace with left. Otherwise, find the inorder successor (leftmost in\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 100, "name": "Binary Tree Level Order Traversal", "category": "Trees", "difficulty": "Medium", "pattern": "BFS with Queue", "approach": "Use a queue seeded with the root. Each iteration processes all nodes at the current level, enqueueing their children. Collect nodes level by level.", "timeComplexity": "O(n)", "spaceComplexity": "O(n)", "python": "from collections import deque\ndef levelOrder(root):\n    if not root: return []\n    q=deque([root])\n    res=[]\n    while q:\n        level=[]\n        for _ in range(len(q)):\n            node=q.popleft()\n            level.append(node.val)\n            if node.left: q.append(node.left)\n            if node.right: q.append(node.right)\n        res.append(level)\n    return res", "java": "class Solution {\n    public List<List<Integer>> levelOrder(TreeNode root) {\n        List<List<Integer>> res = new ArrayList<>();\n        if (root == null) return res;\n        Queue<TreeNode> q = new LinkedList<>();\n        q.add(root);\n        while (!q.isEmpty()) {\n            List<Integer> level = new ArrayList<>();\n            for (int i = q.size(); i > 0; i--) {\n                TreeNode node = q.poll();\n                level.add(node.val);\n                if (node.left != null) q.add(node.left);\n                if (node.right != null) q.add(node.right);\n            }\n            res.add(level);\n        }\n        return res;\n    }\n}"}, {"id": 101, "name": "Binary Tree Right Side View", "category": "Trees", "difficulty": "Medium", "pattern": "BFS \u2014 Last Element per Level", "approach": "BFS level-order traversal. For each level, record only the last node's value (rightmost visible node).", "timeComplexity": "O(n)", "spaceComplexity": "O(n)", "python": "from collections import deque\ndef rightSideView(root):\n    if not root: return []\n    q=deque([root])\n    res=[]\n    while q:\n        for i in range(len(q)):\n            node=q.popleft()\n            if i==len(q): res.append(node.val)  # last in level\n            if node.left: q.append(node.left)\n            if node.right: q.append(node.right)\n        res.append(node.val)  # simplified: node after loop is last\n    return res", "java": "class Solution {\n    // Approach: BFS \u2014 Last Element per Level\n    // Time: O(n)  Space: O(n)\n    public Object solve(/* params */) {\n        // BFS level-order traversal. For each level, record only the last node's value (rightmost visible node).\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 102, "name": "Construct Quad Tree", "category": "Trees", "difficulty": "Medium", "pattern": "Divide and Conquer Recursion", "approach": "Check if all values in the region are equal. If yes, create a leaf. If not, split into four quadrants and recurse on each.", "timeComplexity": "O(n\u00b2 log n)", "spaceComplexity": "O(log n)", "python": "def construct(grid):\n    def build(r,c,n):\n        if all(grid[i][j]==grid[r][c] for i in range(r,r+n) for j in range(c,c+n)):\n            return Node(grid[r][c]==1,True)\n        h=n//2\n        return Node(True,False,build(r,c,h),build(r,c+h,h),build(r+h,c,h),build(r+h,c+h,h))\n    return build(0,0,len(grid))", "java": "class Solution {\n    // Approach: Divide and Conquer Recursion\n    // Time: O(n\u00b2 log n)  Space: O(log n)\n    public Object solve(/* params */) {\n        // Check if all values in the region are equal. If yes, create a leaf. If not, split into four quadrants and recurse on eac\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 103, "name": "Count Good Nodes In Binary Tree", "category": "Trees", "difficulty": "Medium", "pattern": "DFS Tracking Max So Far", "approach": "DFS passing the max value seen on the path from root. A node is 'good' if its value \u2265 that max. Count good nodes and update max when descending.", "timeComplexity": "O(n)", "spaceComplexity": "O(h)", "python": "def goodNodes(root):\n    def dfs(node,mx):\n        if not node: return 0\n        good=1 if node.val>=mx else 0\n        mx=max(mx,node.val)\n        return good+dfs(node.left,mx)+dfs(node.right,mx)\n    return dfs(root,root.val)", "java": "class Solution {\n    // Approach: DFS Tracking Max So Far\n    // Time: O(n)  Space: O(h)\n    public Object solve(/* params */) {\n        // DFS passing the max value seen on the path from root. A node is 'good' if its value \u2265 that max. Count good nodes and upd\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 104, "name": "Validate Binary Search Tree", "category": "Trees", "difficulty": "Medium", "pattern": "DFS with Min/Max Bounds", "approach": "Pass (min_bound, max_bound) down the recursion. A node is valid if min_bound < val < max_bound. Left subtrees tighten the upper bound; right tighten the lower bound.", "timeComplexity": "O(n)", "spaceComplexity": "O(h)", "python": "def isValidBST(root):\n    def dfs(node,lo,hi):\n        if not node: return True\n        if not(lo<node.val<hi): return False\n        return dfs(node.left,lo,node.val) and dfs(node.right,node.val,hi)\n    return dfs(root,float('-inf'),float('inf'))", "java": "class Solution {\n    public boolean isValidBST(TreeNode root) {\n        return validate(root, Long.MIN_VALUE, Long.MAX_VALUE);\n    }\n    private boolean validate(TreeNode node, long min, long max) {\n        if (node == null) return true;\n        if (node.val <= min || node.val >= max) return false;\n        return validate(node.left, min, node.val) && validate(node.right, node.val, max);\n    }\n}"}, {"id": 105, "name": "Kth Smallest Element In a Bst", "category": "Trees", "difficulty": "Medium", "pattern": "In-Order Traversal (Sorted Order)", "approach": "In-order traversal of a BST visits nodes in ascending order. Count k steps; return the value at step k.", "timeComplexity": "O(h+k)", "spaceComplexity": "O(h)", "python": "def kthSmallest(root, k):\n    stack=[]\n    cur=root\n    while cur or stack:\n        while cur: stack.append(cur)\n        cur=cur.left\n        cur=stack.pop()\n        k-=1\n        if k==0: return cur.val\n        cur=cur.right", "java": "class Solution {\n    // Approach: In-Order Traversal (Sorted Order)\n    // Time: O(h+k)  Space: O(h)\n    public Object solve(/* params */) {\n        // In-order traversal of a BST visits nodes in ascending order. Count k steps; return the value at step k.\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 106, "name": "Construct Binary Tree From Preorder And Inorder Traversal", "category": "Trees", "difficulty": "Medium", "pattern": "Recursion with Index HashMap", "approach": "The first element of preorder is the root. Find its index in inorder (use a HashMap for O(1)). Elements to its left/right in inorder form the left/right subtrees.", "timeComplexity": "O(n)", "spaceComplexity": "O(n)", "python": "def buildTree(preorder, inorder):\n    idx={v:i for i,v in enumerate(inorder)}\n    def build(lo,hi):\n        if lo>hi: return None\n        root=TreeNode(preorder.pop(0))\n        m=idx[root.val]\n        root.left=build(lo,m-1)\n        root.right=build(m+1,hi)\n        return root\n    return build(0,len(inorder)-1)", "java": "class Solution {\n    // Approach: Recursion with Index HashMap\n    // Time: O(n)  Space: O(n)\n    public Object solve(/* params */) {\n        // The first element of preorder is the root. Find its index in inorder (use a HashMap for O(1)). Elements to its left/righ\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 107, "name": "House Robber III", "category": "Trees", "difficulty": "Medium", "pattern": "Tree DP (Rob/Skip Pair)", "approach": "Each node returns (rob_this_node, skip_this_node). If robbing: value + skip_left + skip_right. If skipping: max(rob,skip)_left + max(rob,skip)_right.", "timeComplexity": "O(n)", "spaceComplexity": "O(h)", "python": "def rob(root):\n    def dfs(node):\n        if not node: return 0,0  # rob, skip\n        lr,ls=dfs(node.left)\n        rr,rs=dfs(node.right)\n        rob=node.val+ls+rs\n        skip=max(lr,ls)+max(rr,rs)\n        return rob,skip\n    return max(dfs(root))", "java": "class Solution {\n    // Approach: Tree DP (Rob/Skip Pair)\n    // Time: O(n)  Space: O(h)\n    public Object solve(/* params */) {\n        // Each node returns (rob_this_node, skip_this_node). If robbing: value + skip_left + skip_right. If skipping: max(rob,skip\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 108, "name": "Delete Leaves With a Given Value", "category": "Trees", "difficulty": "Medium", "pattern": "Post-Order DFS", "approach": "Process children before the current node. After deleting children, if the current node is now a leaf with the target value, delete it by returning null.", "timeComplexity": "O(n)", "spaceComplexity": "O(h)", "python": "def removeLeafNodes(root, target):\n    if not root: return None\n    root.left=removeLeafNodes(root.left,target)\n    root.right=removeLeafNodes(root.right,target)\n    if not root.left and not root.right and root.val==target: return None\n    return root", "java": "class Solution {\n    // Approach: Post-Order DFS\n    // Time: O(n)  Space: O(h)\n    public Object solve(/* params */) {\n        // Process children before the current node. After deleting children, if the current node is now a leaf with the target val\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 109, "name": "Binary Tree Maximum Path Sum", "category": "Trees", "difficulty": "Hard", "pattern": "DFS Tracking Global Max", "approach": "Each node returns the max gain from a single downward path (left or right). The path through a node is node.val + max_left_gain + max_right_gain. Update global max.", "timeComplexity": "O(n)", "spaceComplexity": "O(h)", "python": "def maxPathSum(root):\n    res=[root.val]\n    def dfs(node):\n        if not node: return 0\n        l,r=max(0,dfs(node.left)),max(0,dfs(node.right))\n        res[0]=max(res[0],node.val+l+r)\n        return node.val+max(l,r)\n    dfs(root)\n    return res[0]", "java": "class Solution {\n    private int res = Integer.MIN_VALUE;\n    public int maxPathSum(TreeNode root) {\n        dfs(root);\n        return res;\n    }\n    private int dfs(TreeNode node) {\n        if (node == null) return 0;\n        int l = Math.max(0, dfs(node.left));\n        int r = Math.max(0, dfs(node.right));\n        res = Math.max(res, node.val + l + r);\n        return node.val + Math.max(l, r);\n    }\n}"}, {"id": 110, "name": "Serialize And Deserialize Binary Tree", "category": "Trees", "difficulty": "Hard", "pattern": "Pre-Order DFS with Null Markers", "approach": "Serialize using pre-order DFS, writing null markers for missing nodes. Deserialize by consuming values from a queue and recursively reconstructing the tree.", "timeComplexity": "O(n)", "spaceComplexity": "O(n)", "python": "class Codec:\n    def serialize(self,root):\n        def dfs(n): return 'N' if not n else f'{n.val},{dfs(n.left)},{dfs(n.right)}'\n        return dfs(root)\n    def deserialize(self,data):\n        q=iter(data.split(','))\n        def dfs():\n            v=next(q)\n            if v=='N': return None\n            node=TreeNode(int(v))\n            node.left=dfs()\n            node.right=dfs()\n            return node\n        return dfs()", "java": "class Solution {\n    // Approach: Pre-Order DFS with Null Markers\n    // Time: O(n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Serialize using pre-order DFS, writing null markers for missing nodes. Deserialize by consuming values from a queue and \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 111, "name": "Kth Largest Element In a Stream", "category": "Heap / Priority Queue", "difficulty": "Easy", "pattern": "Min-Heap of Size k", "approach": "Maintain a min-heap of size k. On each add, push the value; if the heap exceeds k, pop the minimum. The heap top is always the kth largest.", "timeComplexity": "O(log k) per add", "spaceComplexity": "O(k)", "python": "import heapq\nclass KthLargest:\n    def __init__(self,k,nums): self.k=k\n    self.heap=nums\n    heapq.heapify(self.heap)\n    def add(self,val):\n        heapq.heappush(self.heap,val)\n        while len(self.heap)>self.k: heapq.heappop(self.heap)\n        return self.heap[0]", "java": "class KthLargest {\n    private final int k;\n    private final PriorityQueue<Integer> pq;\n    public KthLargest(int k, int[] nums) {\n        this.k = k;\n        pq = new PriorityQueue<>();\n        for (int n : nums) add(n);\n    }\n    public int add(int val) {\n        pq.offer(val);\n        if (pq.size() > k) pq.poll();\n        return pq.peek();\n    }\n}"}, {"id": 112, "name": "Last Stone Weight", "category": "Heap / Priority Queue", "difficulty": "Easy", "pattern": "Max-Heap Simulation", "approach": "Push all stone weights into a max-heap. While more than one stone remains, pop the two largest and push back their difference if non-zero.", "timeComplexity": "O(n log n)", "spaceComplexity": "O(n)", "python": "import heapq\ndef lastStoneWeight(stones):\n    heap=[-s for s in stones]\n    heapq.heapify(heap)\n    while len(heap)>1:\n        a,b=-heapq.heappop(heap),-heapq.heappop(heap)\n        if a!=b: heapq.heappush(heap,-(a-b))\n    return -heap[0] if heap else 0", "java": "class Solution {\n    // Approach: Max-Heap Simulation\n    // Time: O(n log n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Push all stone weights into a max-heap. While more than one stone remains, pop the two largest and push back their diffe\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 113, "name": "K Closest Points to Origin", "category": "Heap / Priority Queue", "difficulty": "Medium", "pattern": "Max-Heap of Size k", "approach": "Maintain a max-heap of size k keyed by distance\u00b2. Push each point; if heap size exceeds k, pop the farthest. Return the remaining k points.", "timeComplexity": "O(n log k)", "spaceComplexity": "O(k)", "python": "import heapq\ndef kClosest(points, k):\n    heap=[]\n    for x,y in points:\n        heapq.heappush(heap,(-(x*x+y*y),x,y))\n        if len(heap)>k: heapq.heappop(heap)\n    return [[x,y] for _,x,y in heap]", "java": "class Solution {\n    // Approach: Max-Heap of Size k\n    // Time: O(n log k)  Space: O(k)\n    public Object solve(/* params */) {\n        // Maintain a max-heap of size k keyed by distance\u00b2. Push each point; if heap size exceeds k, pop the farthest. Return the \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 114, "name": "Kth Largest Element In An Array", "category": "Heap / Priority Queue", "difficulty": "Medium", "pattern": "QuickSelect", "approach": "Partition the array around a pivot. If the pivot lands at index n-k, return it. Recurse into only the relevant partition. Average O(n).", "timeComplexity": "O(n) avg, O(n\u00b2) worst", "spaceComplexity": "O(1)", "python": "def findKthLargest(nums, k):\n    import random\n    def qs(lo,hi,target):\n        pivot=nums[hi]\n        p=lo\n        for i in range(lo,hi):\n            if nums[i]<=pivot: nums[i],nums[p]=nums[p],nums[i]\n            p+=1\n        nums[p],nums[hi]=nums[hi],nums[p]\n        if p==target: return nums[p]\n        elif p<target: return qs(p+1,hi,target)\n        else: return qs(lo,p-1,target)\n    return qs(0,len(nums)-1,len(nums)-k)", "java": "class Solution {\n    // Approach: QuickSelect\n    // Time: O(n) avg, O(n\u00b2) worst  Space: O(1)\n    public Object solve(/* params */) {\n        // Partition the array around a pivot. If the pivot lands at index n-k, return it. Recurse into only the relevant partition\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 115, "name": "Task Scheduler", "category": "Heap / Priority Queue", "difficulty": "Medium", "pattern": "Greedy with Max-Heap", "approach": "Always schedule the most frequent remaining task. After scheduling n+1 tasks (or fewer if exhausted), refill the heap. Count idle cycles when the heap is empty mid-cycle.", "timeComplexity": "O(n log k)", "spaceComplexity": "O(k)", "python": "import heapq\nfrom collections import Counter\ndef leastInterval(tasks, n):\n    cnt=Counter(tasks)\n    heap=[-c for c in cnt.values()]\n    heapq.heapify(heap)\n    time=0\n    q=[]\n    while heap or q:\n        time+=1\n        if heap:\n            c=1+heapq.heappop(heap)\n            if c: q.append((c,time+n))\n        if q and q[0][1]==time: heapq.heappush(heap,q.pop(0)[0])\n    return time", "java": "class Solution {\n    // Approach: Greedy with Max-Heap\n    // Time: O(n log k)  Space: O(k)\n    public Object solve(/* params */) {\n        // Always schedule the most frequent remaining task. After scheduling n+1 tasks (or fewer if exhausted), refill the heap. C\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 116, "name": "Design Twitter", "category": "Heap / Priority Queue", "difficulty": "Medium", "pattern": "Min-Heap Merge of Recent Tweets", "approach": "Each user stores tweets with a global timestamp. getNewsFeed merges the 10 most recent tweets from followed users using a max-heap (or min-heap of size 10).", "timeComplexity": "O(k log k) per feed", "spaceComplexity": "O(n)", "python": "import heapq\nfrom collections import defaultdict\nclass Twitter:\n    def __init__(self): self.tweets=defaultdict(list)\n    self.following=defaultdict(set)\n    self.time=0\n    def postTweet(self,u,t): self.tweets[u].append((-self.time,t))\n    self.time+=1\n    def getNewsFeed(self,u):\n        heap=[]\n        users=self.following[u]|{u}\n        for uid in users:\n            for tweet in self.tweets[uid][-10:]: heapq.heappush(heap,tweet)\n        return [t for _,t in heapq.nsmallest(10,heap)]\n    def follow(self,u,v): self.following[u].add(v)\n    def unfollow(self,u,v): self.following[u].discard(v)", "java": "class Solution {\n    // Approach: Min-Heap Merge of Recent Tweets\n    // Time: O(k log k) per feed  Space: O(n)\n    public Object solve(/* params */) {\n        // Each user stores tweets with a global timestamp. getNewsFeed merges the 10 most recent tweets from followed users using \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 117, "name": "Single Threaded CPU", "category": "Heap / Priority Queue", "difficulty": "Hard", "pattern": "Min-Heap by (Processing Time, Task Index)", "approach": "Sort tasks by arrival time. Use a clock variable. When the CPU is free, advance the clock to the next arrival if no tasks are ready. Push ready tasks to a min-heap and process the smallest.", "timeComplexity": "O(n log n)", "spaceComplexity": "O(n)", "python": "import heapq\ndef getOrder(tasks):\n    tasks=sorted((e,p,i) for i,(e,p) in enumerate(tasks))\n    heap=[]\n    time=0\n    idx=0\n    res=[]\n    while idx<len(tasks) or heap:\n        if not heap and idx<len(tasks): time=tasks[idx][0]\n        while idx<len(tasks) and tasks[idx][0]<=time:\n            _,p,i=tasks[idx]\n            heapq.heappush(heap,(p,i))\n            idx+=1\n        p,i=heapq.heappop(heap)\n        time+=p\n        res.append(i)\n    return res", "java": "class Solution {\n    // Approach: Min-Heap by (Processing Time, Task Index)\n    // Time: O(n log n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Sort tasks by arrival time. Use a clock variable. When the CPU is free, advance the clock to the next arrival if no task\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 118, "name": "Reorganize String", "category": "Heap / Priority Queue", "difficulty": "Medium", "pattern": "Greedy Max-Heap", "approach": "Use a max-heap of (frequency, char). Alternate: pop the top, append char, decrement freq, then push the previously set-aside character back. Fail if max freq > (n+1)//2.", "timeComplexity": "O(n log k)", "spaceComplexity": "O(k)", "python": "import heapq\nfrom collections import Counter\ndef reorganizeString(s):\n    cnt=Counter(s)\n    if max(cnt.values())>(len(s)+1)//2: return ''\n    heap=[(-c,ch) for ch,c in cnt.items()]\n    heapq.heapify(heap)\n    res=''\n    prev=(0,'')\n    while heap:\n        c,ch=heapq.heappop(heap)\n        res+=ch\n        if prev[0]<0: heapq.heappush(heap,prev)\n        prev=(c+1,ch)\n    if prev[0]<0: heapq.heappush(heap,prev)\n    c,ch=heapq.heappop(heap)\n    res+=ch\n    return res", "java": "class Solution {\n    // Approach: Greedy Max-Heap\n    // Time: O(n log k)  Space: O(k)\n    public Object solve(/* params */) {\n        // Use a max-heap of (frequency, char). Alternate: pop the top, append char, decrement freq, then push the previously set-a\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 119, "name": "Longest Happy String", "category": "Heap / Priority Queue", "difficulty": "Medium", "pattern": "Greedy Max-Heap", "approach": "Always pick the most frequent character that doesn't violate the no-three-consecutive rule. If the top would create a triple, use the second most frequent instead.", "timeComplexity": "O(n log k)", "spaceComplexity": "O(k)", "python": "import heapq\nfrom collections import Counter\ndef longestDiverseString(a, b, c):\n    heap=[(-a,'a'),(-b,'b'),(-c,'c')]\n    heapq.heapify(heap)\n    res=''\n    while heap:\n        c1,ch1=heapq.heappop(heap)\n        if len(res)>=2 and res[-1]==res[-2]==ch1:\n            if not heap: break\n            c2,ch2=heapq.heappop(heap)\n            res+=ch2\n            if c2+1: heapq.heappush(heap,(c2+1,ch2))\n            heapq.heappush(heap,(c1,ch1))\n        else:\n            res+=ch1\n            if c1+1: heapq.heappush(heap,(c1+1,ch1))\n    return res", "java": "class Solution {\n    // Approach: Greedy Max-Heap\n    // Time: O(n log k)  Space: O(k)\n    public Object solve(/* params */) {\n        // Always pick the most frequent character that doesn't violate the no-three-consecutive rule. If the top would create a tr\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 120, "name": "Car Pooling", "category": "Heap / Priority Queue", "difficulty": "Medium", "pattern": "Min-Heap of Drop-off Times", "approach": "Sort trips by start. At each pickup, add passengers. Use a heap to drop off passengers before processing the next pickup (if their dropoff time \u2264 current start). Check capacity.", "timeComplexity": "O(n log n)", "spaceComplexity": "O(n)", "python": "import heapq\ndef carPooling(trips, capacity):\n    trips.sort()\n    heap=[]\n    curr=0\n    for num,start,end in trips:\n        while heap and heap[0][0]<=start:\n            curr-=heapq.heappop(heap)[1]\n        curr+=num\n        if curr>capacity: return False\n        heapq.heappush(heap,(end,num))\n    return True", "java": "class Solution {\n    // Approach: Min-Heap of Drop-off Times\n    // Time: O(n log n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Sort trips by start. At each pickup, add passengers. Use a heap to drop off passengers before processing the next pickup\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 121, "name": "Find Median From Data Stream", "category": "Heap / Priority Queue", "difficulty": "Hard", "pattern": "Two Heaps (Max + Min)", "approach": "Maintain a max-heap for the lower half and a min-heap for the upper half. Keep them balanced (size difference \u2264 1). Median is the top of the larger heap or the average of both tops.", "timeComplexity": "O(log n) add, O(1) median", "spaceComplexity": "O(n)", "python": "import heapq\nclass MedianFinder:\n    def __init__(self): self.lo=[]\n    self.hi=[]\n    def addNum(self,num):\n        heapq.heappush(self.lo,-num)\n        heapq.heappush(self.hi,-heapq.heappop(self.lo))\n        if len(self.hi)>len(self.lo): heapq.heappush(self.lo,-heapq.heappop(self.hi))\n    def findMedian(self):\n        if len(self.lo)>len(self.hi): return -self.lo[0]\n        return (-self.lo[0]+self.hi[0])/2", "java": "class MedianFinder {\n    private PriorityQueue<Integer> lo = new PriorityQueue<>(Collections.reverseOrder());\n    private PriorityQueue<Integer> hi = new PriorityQueue<>();\n    public void addNum(int num) {\n        lo.offer(num);\n        hi.offer(lo.poll());\n        if (hi.size() > lo.size()) lo.offer(hi.poll());\n    }\n    public double findMedian() {\n        return lo.size() > hi.size() ? lo.peek() : (lo.peek() + hi.peek()) / 2.0;\n    }\n}"}, {"id": 122, "name": "IPO", "category": "Heap / Priority Queue", "difficulty": "Hard", "pattern": "Two Heaps (Capital + Profit)", "approach": "Min-heap by capital for unavailable projects; max-heap by profit for available ones. For each of k rounds, unlock all affordable projects into the max-heap, then pick the most profitable.", "timeComplexity": "O(n log n)", "spaceComplexity": "O(n)", "python": "import heapq\ndef findMaximizedCapital(k, w, profits, capital):\n    projects=sorted(zip(capital,profits))\n    i=0\n    heap=[]\n    for _ in range(k):\n        while i<len(projects) and projects[i][0]<=w:\n            heapq.heappush(heap,-projects[i][1])\n            i+=1\n        if not heap: break\n        w-=heapq.heappop(heap)\n    return w", "java": "class Solution {\n    // Approach: Two Heaps (Capital + Profit)\n    // Time: O(n log n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Min-heap by capital for unavailable projects; max-heap by profit for available ones. For each of k rounds, unlock all af\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 123, "name": "Sum of All Subsets XOR Total", "category": "Backtracking", "difficulty": "Easy", "pattern": "Backtracking / Bit Manipulation", "approach": "Enumerate all 2^n subsets. XOR all elements in each subset and sum up the results. Alternatively, the answer is nums[0] | nums[1] | ... shifted by (n-1) positions.", "timeComplexity": "O(2^n)", "spaceComplexity": "O(n)", "python": "def subsetXORSum(nums):\n    from functools import reduce\n    from operator import or_\n    return reduce(or_,nums,0)<<(len(nums)-1)", "java": "class Solution {\n    // Approach: Backtracking / Bit Manipulation\n    // Time: O(2^n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Enumerate all 2^n subsets. XOR all elements in each subset and sum up the results. Alternatively, the answer is nums[0] \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 124, "name": "Subsets", "category": "Backtracking", "difficulty": "Medium", "pattern": "Backtracking", "approach": "At each index, choose to include or exclude the element. Recurse on both choices. Add the current path to results at every call (not just at leaves).", "timeComplexity": "O(2^n)", "spaceComplexity": "O(n)", "python": "def subsets(nums):\n    res=[[]]\n    for n in nums: res+=[s+[n] for s in res]\n    return res", "java": "class Solution {\n    // Approach: Backtracking\n    // Time: O(2^n)  Space: O(n)\n    public Object solve(/* params */) {\n        // At each index, choose to include or exclude the element. Recurse on both choices. Add the current path to results at eve\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 125, "name": "Combination Sum", "category": "Backtracking", "difficulty": "Medium", "pattern": "Backtracking (Reuse Allowed)", "approach": "Sort candidates. At each step, try including candidates[i] (same index allowed for reuse) or skip to i+1. Prune branches where running sum exceeds target.", "timeComplexity": "O(2^(target/min))", "spaceComplexity": "O(target/min)", "python": "def combinationSum(candidates, target):\n    res=[]\n    def bt(i,cur,total):\n        if total==target: res.append(cur[:])\n        return\n        if i>=len(candidates) or total>target: return\n        cur.append(candidates[i])\n        bt(i,cur,total+candidates[i])\n        cur.pop()\n        bt(i+1,cur,total)\n    bt(0,[],0)\n    return res", "java": "class Solution {\n    // Approach: Backtracking (Reuse Allowed)\n    // Time: O(2^(target/min))  Space: O(target/min)\n    public Object solve(/* params */) {\n        // Sort candidates. At each step, try including candidates[i] (same index allowed for reuse) or skip to i+1. Prune branches\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 126, "name": "Combination Sum II", "category": "Backtracking", "difficulty": "Medium", "pattern": "Backtracking + Skip Duplicates", "approach": "Sort candidates. Same as Combination Sum but move to i+1 after including an element (no reuse). Skip duplicate candidates at the same recursion level to avoid duplicate subsets.", "timeComplexity": "O(2^n)", "spaceComplexity": "O(n)", "python": "def combinationSum2(candidates, target):\n    candidates.sort()\n    res=[]\n    def bt(i,cur,total):\n        if total==target: res.append(cur[:])\n        return\n        for j in range(i,len(candidates)):\n            if j>i and candidates[j]==candidates[j-1]: continue\n            if total+candidates[j]>target: break\n            cur.append(candidates[j])\n            bt(j+1,cur,total+candidates[j])\n            cur.pop()\n    bt(0,[],0)\n    return res", "java": "class Solution {\n    // Approach: Backtracking + Skip Duplicates\n    // Time: O(2^n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Sort candidates. Same as Combination Sum but move to i+1 after including an element (no reuse). Skip duplicate candidate\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 127, "name": "Combinations", "category": "Backtracking", "difficulty": "Medium", "pattern": "Backtracking", "approach": "Choose k numbers from 1..n in increasing order. At each step, pick a number from start to n, recurse with start+1, then backtrack.", "timeComplexity": "O(k \u00b7 C(n,k))", "spaceComplexity": "O(k)", "python": "def combine(n, k):\n    res=[]\n    def bt(start,path):\n        if len(path)==k: res.append(path[:])\n        return\n        for i in range(start,n+1): path.append(i)\n        bt(i+1,path)\n        path.pop()\n    bt(1,[])\n    return res", "java": "class Solution {\n    // Approach: Backtracking\n    // Time: O(k \u00b7 C(n,k))  Space: O(k)\n    public Object solve(/* params */) {\n        // Choose k numbers from 1..n in increasing order. At each step, pick a number from start to n, recurse with start+1, then \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 128, "name": "Permutations", "category": "Backtracking", "difficulty": "Medium", "pattern": "Backtracking (Swap-in-Place or Used Array)", "approach": "Use a boolean 'used' array. At each position, try all unused numbers. When the current permutation reaches length n, add it to results.", "timeComplexity": "O(n \u00b7 n!)", "spaceComplexity": "O(n)", "python": "def permute(nums):\n    res=[]\n    def bt(path,used):\n        if len(path)==len(nums): res.append(path[:])\n        return\n        for i,n in enumerate(nums):\n            if not used[i]: used[i]=True\n            path.append(n)\n            bt(path,used)\n            path.pop()\n            used[i]=False\n    bt([],[False]*len(nums))\n    return res", "java": "class Solution {\n    // Approach: Backtracking (Swap-in-Place or Used Array)\n    // Time: O(n \u00b7 n!)  Space: O(n)\n    public Object solve(/* params */) {\n        // Use a boolean 'used' array. At each position, try all unused numbers. When the current permutation reaches length n, add\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 129, "name": "Subsets II", "category": "Backtracking", "difficulty": "Medium", "pattern": "Backtracking + Skip Duplicates", "approach": "Sort the input. Same as Subsets, but skip duplicate values at the same recursion depth (if i > start and nums[i]==nums[i-1], skip).", "timeComplexity": "O(2^n)", "spaceComplexity": "O(n)", "python": "def subsetsWithDup(nums):\n    nums.sort()\n    res=[]\n    def bt(i,path):\n        res.append(path[:])\n        for j in range(i,len(nums)):\n            if j>i and nums[j]==nums[j-1]: continue\n            path.append(nums[j])\n            bt(j+1,path)\n            path.pop()\n    bt(0,[])\n    return res", "java": "class Solution {\n    // Approach: Backtracking + Skip Duplicates\n    // Time: O(2^n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Sort the input. Same as Subsets, but skip duplicate values at the same recursion depth (if i > start and nums[i]==nums[i\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 130, "name": "Permutations II", "category": "Backtracking", "difficulty": "Medium", "pattern": "Backtracking + Skip Duplicates", "approach": "Sort the input. Use a 'used' array. Skip nums[i] if it's a duplicate of nums[i-1] and nums[i-1] is not currently used (to prevent same-position duplicates).", "timeComplexity": "O(n \u00b7 n!)", "spaceComplexity": "O(n)", "python": "def permuteUnique(nums):\n    nums.sort()\n    res=[]\n    def bt(path,used):\n        if len(path)==len(nums): res.append(path[:])\n        return\n        for i in range(len(nums)):\n            if used[i] or (i>0 and nums[i]==nums[i-1] and not used[i-1]): continue\n            used[i]=True\n            path.append(nums[i])\n            bt(path,used)\n            path.pop()\n            used[i]=False\n    bt([],[False]*len(nums))\n    return res", "java": "class Solution {\n    // Approach: Backtracking + Skip Duplicates\n    // Time: O(n \u00b7 n!)  Space: O(n)\n    public Object solve(/* params */) {\n        // Sort the input. Use a 'used' array. Skip nums[i] if it's a duplicate of nums[i-1] and nums[i-1] is not currently used (t\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 131, "name": "Word Search", "category": "Backtracking", "difficulty": "Medium", "pattern": "DFS Backtracking on Grid", "approach": "For each cell matching word[0], DFS in 4 directions. Mark a cell as visited (e.g., set to '#') before recursing; restore it after. Prune when characters don't match.", "timeComplexity": "O(m\u00b7n\u00b74^L)", "spaceComplexity": "O(L)", "python": "def exist(board, word):\n    R,C=len(board),len(board[0])\n    def dfs(r,c,i):\n        if i==len(word): return True\n        if r<0 or r>=R or c<0 or c>=C or board[r][c]!=word[i]: return False\n        tmp=board[r][c]\n        board[r][c]='#'\n        res=any(dfs(r+dr,c+dc,i+1) for dr,dc in[(0,1),(0,-1),(1,0),(-1,0)])\n        board[r][c]=tmp\n        return res\n    return any(dfs(r,c,0) for r in range(R) for c in range(C))", "java": "class Solution {\n    // Approach: DFS Backtracking on Grid\n    // Time: O(m\u00b7n\u00b74^L)  Space: O(L)\n    public Object solve(/* params */) {\n        // For each cell matching word[0], DFS in 4 directions. Mark a cell as visited (e.g., set to '#') before recursing; restore\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 132, "name": "Palindrome Partitioning", "category": "Backtracking", "difficulty": "Medium", "pattern": "Backtracking + Palindrome Check", "approach": "At each start index, try all end indices. If substring is a palindrome, add it to the current path and recurse. Precompute palindrome DP for speed.", "timeComplexity": "O(n \u00b7 2^n)", "spaceComplexity": "O(n)", "python": "def partition(s):\n    res=[]\n    def bt(start,path):\n        if start==len(s): res.append(path[:])\n        return\n        for end in range(start,len(s)):\n            sub=s[start:end+1]\n            if sub==sub[::-1]: path.append(sub)\n            bt(end+1,path)\n            path.pop()\n    bt(0,[])\n    return res", "java": "class Solution {\n    // Approach: Backtracking + Palindrome Check\n    // Time: O(n \u00b7 2^n)  Space: O(n)\n    public Object solve(/* params */) {\n        // At each start index, try all end indices. If substring is a palindrome, add it to the current path and recurse. Precompu\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 133, "name": "Letter Combinations of a Phone Number", "category": "Backtracking", "difficulty": "Medium", "pattern": "Backtracking", "approach": "Map each digit to its letters. Recurse through digits, at each lev
