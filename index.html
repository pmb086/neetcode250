s[i][3])\n    return [crit,pseudo]", "java": "class Solution {\n    // Approach: MST + Edge Inclusion / Exclusion\n    // Time: O(E\u00b2 \u00b7 \u03b1(V))  Space: O(V+E)\n    public Object solve(/* params */) {\n        // Find the MST weight. An edge is critical if removing it increases the MST weight. An edge is pseudo-critical if forcing \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 172, "name": "Build a Matrix With Conditions", "category": "Advanced Graphs", "difficulty": "Hard", "pattern": "Topological Sort (Rows + Columns)", "approach": "Run topological sort separately for row conditions and column conditions to get orderings. If a cycle exists, return []. Place k at (row_pos[k], col_pos[k]) in the matrix.", "timeComplexity": "O(k + conditions)", "spaceComplexity": "O(k\u00b2)", "python": "def buildMatrix(k, rowConditions, colConditions):\n    from collections import deque,defaultdict\n    def topo(k,conds):\n        adj=defaultdict(list)\n        indeg=[0]*(k+1)\n        for a,b in conds: adj[a].append(b)\n        indeg[b]+=1\n        q=deque(i for i in range(1,k+1) if indeg[i]==0)\n        order=[]\n        while q:\n            u=q.popleft()\n            order.append(u)\n            for v in adj[u]: indeg[v]-=1\n            if indeg[v]==0: q.append(v)\n        return order if len(order)==k else []\n    rOrder=topo(k,rowConditions)\n    cOrder=topo(k,colConditions)\n    if not rOrder or not cOrder: return []\n    rPos={v:i for i,v in enumerate(rOrder)}\n    cPos={v:i for i,v in enumerate(cOrder)}\n    mat=[[0]*k for _ in range(k)]\n    for v in range(1,k+1): mat[rPos[v]][cPos[v]]=v\n    return mat", "java": "class Solution {\n    // Approach: Topological Sort (Rows + Columns)\n    // Time: O(k + conditions)  Space: O(k\u00b2)\n    public Object solve(/* params */) {\n        // Run topological sort separately for row conditions and column conditions to get orderings. If a cycle exists, return [].\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 173, "name": "Greatest Common Divisor Traversal", "category": "Advanced Graphs", "difficulty": "Hard", "pattern": "Union-Find via Prime Factorization", "approach": "Map each prime factor to a representative number. For each number, union it with the first occurrence of each of its prime factors. Check if all numbers share one component.", "timeComplexity": "O(n \u00b7 \u221amax_val)", "spaceComplexity": "O(n + max_val)", "python": "def canTraverseAllPairs(nums):\n    from math import isqrt\n    par=list(range(len(nums)))\n    prime_to_idx={}\n    def find(x): par[x]=find(par[x]) if par[x]!=x else x\n    return par[x]\n    def union(a,b): par[find(a)]=find(b)\n    for i,n in enumerate(nums):\n        d=2\n        while d*d<=n:\n            if n%d==0:\n                if d in prime_to_idx: union(i,prime_to_idx[d])\n                prime_to_idx[d]=i\n                while n%d==0: n//=d\n            d+=1\n        if n>1:\n            if n in prime_to_idx: union(i,prime_to_idx[n])\n            prime_to_idx[n]=i\n    return len(set(find(i) for i in range(len(nums))))==1", "java": "class Solution {\n    // Approach: Union-Find via Prime Factorization\n    // Time: O(n \u00b7 \u221amax_val)  Space: O(n + max_val)\n    public Object solve(/* params */) {\n        // Map each prime factor to a representative number. For each number, union it with the first occurrence of each of its pri\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 174, "name": "Climbing Stairs", "category": "1-D DP", "difficulty": "Easy", "pattern": "Fibonacci DP", "approach": "dp[i] = dp[i-1] + dp[i-2] (1 or 2 steps). Base cases: dp[1]=1, dp[2]=2. Only track the last two values.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def climbStairs(n):\n    a,b=1,1\n    for _ in range(n-1): a,b=b,a+b\n    return b", "java": "class Solution {\n    public int climbStairs(int n) {\n        int a = 1, b = 1;\n        for (int i = 2; i <= n; i++) { int tmp = a + b; a = b; b = tmp; }\n        return b;\n    }\n}"}, {"id": 175, "name": "Min Cost Climbing Stairs", "category": "1-D DP", "difficulty": "Easy", "pattern": "1-D DP", "approach": "dp[i] = cost[i] + min(dp[i-1], dp[i-2]). The answer is min(dp[n-1], dp[n-2]).", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def minCostClimbingStairs(cost):\n    a,b=cost[0],cost[1]\n    for i in range(2,len(cost)): a,b=b,cost[i]+min(a,b)\n    return min(a,b)", "java": "class Solution {\n    // Approach: 1-D DP\n    // Time: O(n)  Space: O(1)\n    public Object solve(/* params */) {\n        // dp[i] = cost[i] + min(dp[i-1], dp[i-2]). The answer is min(dp[n-1], dp[n-2]).\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 176, "name": "N-th Tribonacci Number", "category": "1-D DP", "difficulty": "Easy", "pattern": "Iterative DP with 3 Variables", "approach": "T(n) = T(n-1) + T(n-2) + T(n-3). Maintain three variables and update them in each step.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def tribonacci(n):\n    if n==0: return 0\n    if n<=2: return 1\n    a,b,c=0,1,1\n    for _ in range(n-2): a,b,c=b,c,a+b+c\n    return c", "java": "class Solution {\n    // Approach: Iterative DP with 3 Variables\n    // Time: O(n)  Space: O(1)\n    public Object solve(/* params */) {\n        // T(n) = T(n-1) + T(n-2) + T(n-3). Maintain three variables and update them in each step.\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 177, "name": "House Robber", "category": "1-D DP", "difficulty": "Medium", "pattern": "1-D DP", "approach": "dp[i] = max(dp[i-1], dp[i-2] + nums[i]). Track only two previous values. Answer is dp[n-1].", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def rob(nums):\n    prev2,prev1=0,0\n    for n in nums: prev2,prev1=prev1,max(prev1,prev2+n)\n    return prev1", "java": "class Solution {\n    public int rob(int[] nums) {\n        int prev2 = 0, prev1 = 0;\n        for (int n : nums) { int tmp = Math.max(prev1, prev2 + n); prev2 = prev1; prev1 = tmp; }\n        return prev1;\n    }\n}"}, {"id": 178, "name": "House Robber II", "category": "1-D DP", "difficulty": "Medium", "pattern": "1-D DP (Two Passes)", "approach": "Since the array is circular (can't rob first and last), run House Robber on nums[0..n-2] and nums[1..n-1] separately. Return the max of both.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def rob(nums):\n    def rob1(arr):\n        a,b=0,0\n        for n in arr: a,b=b,max(b,a+n)\n        return b\n    return max(nums[0],rob1(nums[:-1]),rob1(nums[1:]))", "java": "class Solution {\n    // Approach: 1-D DP (Two Passes)\n    // Time: O(n)  Space: O(1)\n    public Object solve(/* params */) {\n        // Since the array is circular (can't rob first and last), run House Robber on nums[0..n-2] and nums[1..n-1] separately. Re\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 179, "name": "Longest Palindromic Substring", "category": "1-D DP", "difficulty": "Medium", "pattern": "Expand Around Center", "approach": "For each character (and each pair), expand outward while characters match. Track the longest palindrome found. O(n\u00b2) time, O(1) space.", "timeComplexity": "O(n\u00b2)", "spaceComplexity": "O(1)", "python": "def longestPalindrome(s):\n    res=''\n    for i in range(len(s)):\n        for lo,hi in[(i,i),(i,i+1)]:\n            while lo>=0 and hi<len(s) and s[lo]==s[hi]: lo-=1\n            hi+=1\n            if hi-lo-1>len(res): res=s[lo+1:hi]\n    return res", "java": "class Solution {\n    // Approach: Expand Around Center\n    // Time: O(n\u00b2)  Space: O(1)\n    public Object solve(/* params */) {\n        // For each character (and each pair), expand outward while characters match. Track the longest palindrome found. O(n\u00b2) tim\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 180, "name": "Palindromic Substrings", "category": "1-D DP", "difficulty": "Medium", "pattern": "Expand Around Center", "approach": "For each character and each pair as center, count palindromes by expanding outward. Sum all valid expansions.", "timeComplexity": "O(n\u00b2)", "spaceComplexity": "O(1)", "python": "def countSubstrings(s):\n    count=0\n    for i in range(len(s)):\n        for lo,hi in[(i,i),(i,i+1)]:\n            while lo>=0 and hi<len(s) and s[lo]==s[hi]: count+=1\n            lo-=1\n            hi+=1\n    return count", "java": "class Solution {\n    // Approach: Expand Around Center\n    // Time: O(n\u00b2)  Space: O(1)\n    public Object solve(/* params */) {\n        // For each character and each pair as center, count palindromes by expanding outward. Sum all valid expansions.\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 181, "name": "Decode Ways", "category": "1-D DP", "difficulty": "Medium", "pattern": "1-D DP", "approach": "dp[i] = ways to decode s[0..i-1]. A single digit (1-9) adds dp[i-1]; a two-digit number (10-26) adds dp[i-2]. Handle leading zeros.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def numDecodings(s):\n    if not s or s[0]=='0': return 0\n    a,b=1,1\n    for i in range(1,len(s)):\n        c=b if s[i]!='0' else 0\n        if 10<=int(s[i-1:i+1])<=26: c+=a\n        a,b=b,c\n    return b", "java": "class Solution {\n    // Approach: 1-D DP\n    // Time: O(n)  Space: O(1)\n    public Object solve(/* params */) {\n        // dp[i] = ways to decode s[0..i-1]. A single digit (1-9) adds dp[i-1]; a two-digit number (10-26) adds dp[i-2]. Handle lea\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 182, "name": "Coin Change", "category": "1-D DP", "difficulty": "Medium", "pattern": "1-D DP (Unbounded Knapsack)", "approach": "dp[i] = min coins to make amount i. dp[0]=0. For each amount, try every coin: dp[i] = min(dp[i], dp[i-coin]+1). Return dp[amount] or -1.", "timeComplexity": "O(n\u00b7amount)", "spaceComplexity": "O(amount)", "python": "def coinChange(coins, amount):\n    dp=[float('inf')]*(amount+1)\n    dp[0]=0\n    for i in range(1,amount+1):\n        for c in coins:\n            if i>=c: dp[i]=min(dp[i],dp[i-c]+1)\n    return dp[amount] if dp[amount]!=float('inf') else -1", "java": "class Solution {\n    public int coinChange(int[] coins, int amount) {\n        int[] dp = new int[amount + 1];\n        Arrays.fill(dp, amount + 1);\n        dp[0] = 0;\n        for (int i = 1; i <= amount; i++)\n            for (int c : coins)\n                if (i >= c) dp[i] = Math.min(dp[i], dp[i - c] + 1);\n        return dp[amount] > amount ? -1 : dp[amount];\n    }\n}"}, {"id": 183, "name": "Maximum Product Subarray", "category": "1-D DP", "difficulty": "Medium", "pattern": "Track Max and Min Products", "approach": "Keep running maxProd and minProd (min matters because negatives flip signs). At each element: new max = max(n, n*maxProd, n*minProd) and update min similarly.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def maxProduct(nums):\n    mx=mn=res=nums[0]\n    for n in nums[1:]:\n        mx,mn=max(n,mx*n,mn*n),min(n,mx*n,mn*n)\n        res=max(res,mx)\n    return res", "java": "class Solution {\n    // Approach: Track Max and Min Products\n    // Time: O(n)  Space: O(1)\n    public Object solve(/* params */) {\n        // Keep running maxProd and minProd (min matters because negatives flip signs). At each element: new max = max(n, n*maxProd\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 184, "name": "Word Break", "category": "1-D DP", "difficulty": "Medium", "pattern": "1-D DP", "approach": "dp[i] = True if s[0..i-1] can be segmented. dp[0]=True. For each i, check all j<i: if dp[j] and s[j..i-1] is in the word set, dp[i]=True.", "timeComplexity": "O(n\u00b2 \u00b7 m)", "spaceComplexity": "O(n)", "python": "def wordBreak(s, wordDict):\n    words=set(wordDict)\n    dp=[False]*(len(s)+1)\n    dp[0]=True\n    for i in range(1,len(s)+1):\n        for j in range(i):\n            if dp[j] and s[j:i] in words: dp[i]=True\n            break\n    return dp[-1]", "java": "class Solution {\n    // Approach: 1-D DP\n    // Time: O(n\u00b2 \u00b7 m)  Space: O(n)\n    public Object solve(/* params */) {\n        // dp[i] = True if s[0..i-1] can be segmented. dp[0]=True. For each i, check all j<i: if dp[j] and s[j..i-1] is in the word\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 185, "name": "Longest Increasing Subsequence", "category": "1-D DP", "difficulty": "Medium", "pattern": "DP + Binary Search (Patience Sorting)", "approach": "Maintain a 'tails' array where tails[i] is the smallest tail of all increasing subsequences of length i+1. Binary search to find where to place each number.", "timeComplexity": "O(n log n)", "spaceComplexity": "O(n)", "python": "def lengthOfLIS(nums):\n    import bisect\n    tails=[]\n    for n in nums:\n        i=bisect.bisect_left(tails,n)\n        if i==len(tails): tails.append(n)\n        else: tails[i]=n\n    return len(tails)", "java": "class Solution {\n    public int lengthOfLIS(int[] nums) {\n        List<Integer> tails = new ArrayList<>();\n        for (int n : nums) {\n            int lo = 0, hi = tails.size();\n            while (lo < hi) {\n                int mid = (lo + hi) / 2;\n                if (tails.get(mid) < n) lo = mid + 1;\n                else hi = mid;\n            }\n            if (lo == tails.size()) tails.add(n);\n            else tails.set(lo, n);\n        }\n        return tails.size();\n    }\n}"}, {"id": 186, "name": "Partition Equal Subset Sum", "category": "1-D DP", "difficulty": "Medium", "pattern": "0-1 Knapsack DP", "approach": "Target = sum/2. dp[i] = can we reach sum i? Iterate numbers; for each, update dp backward (or use bitset). Return dp[target].", "timeComplexity": "O(n \u00b7 sum)", "spaceComplexity": "O(sum)", "python": "def canPartition(nums):\n    total=sum(nums)\n    if total%2: return False\n    target=total//2\n    dp={0}\n    for n in nums: dp={s+n for s in dp}|dp\n    return target in dp", "java": "class Solution {\n    // Approach: 0-1 Knapsack DP\n    // Time: O(n \u00b7 sum)  Space: O(sum)\n    public Object solve(/* params */) {\n        // Target = sum/2. dp[i] = can we reach sum i? Iterate numbers; for each, update dp backward (or use bitset). Return dp[tar\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 187, "name": "Combination Sum IV", "category": "1-D DP", "difficulty": "Medium", "pattern": "1-D DP (Order Matters)", "approach": "dp[i] = number of ordered combinations summing to i. dp[0]=1. For each amount i, add dp[i-num] for each num \u2264 i.", "timeComplexity": "O(n\u00b7target)", "spaceComplexity": "O(target)", "python": "def combinationSum4(nums, target):\n    dp=[0]*(target+1)\n    dp[0]=1\n    for i in range(1,target+1):\n        for n in nums:\n            if i>=n: dp[i]+=dp[i-n]\n    return dp[target]", "java": "class Solution {\n    // Approach: 1-D DP (Order Matters)\n    // Time: O(n\u00b7target)  Space: O(target)\n    public Object solve(/* params */) {\n        // dp[i] = number of ordered combinations summing to i. dp[0]=1. For each amount i, add dp[i-num] for each num \u2264 i.\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 188, "name": "Perfect Squares", "category": "1-D DP", "difficulty": "Medium", "pattern": "1-D DP (BFS also works)", "approach": "dp[i] = min perfect squares summing to i. For each i, try all perfect squares j\u00b2\u2264i: dp[i]=min(dp[i], dp[i-j\u00b2]+1).", "timeComplexity": "O(n\u00b7\u221an)", "spaceComplexity": "O(n)", "python": "def numSquares(n):\n    dp=[float('inf')]*(n+1)\n    dp[0]=0\n    for i in range(1,n+1):\n        j=1\n        while j*j<=i: dp[i]=min(dp[i],dp[i-j*j]+1)\n        j+=1\n    return dp[n]", "java": "class Solution {\n    // Approach: 1-D DP (BFS also works)\n    // Time: O(n\u00b7\u221an)  Space: O(n)\n    public Object solve(/* params */) {\n        // dp[i] = min perfect squares summing to i. For each i, try all perfect squares j\u00b2\u2264i: dp[i]=min(dp[i], dp[i-j\u00b2]+1).\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 189, "name": "Integer Break", "category": "1-D DP", "difficulty": "Medium", "pattern": "DP or Math (Power of 3s)", "approach": "Math insight: break into 3s as much as possible. DP approach: dp[i]=max product for integer i; try dp[j]*(i-j) and j*(i-j) for all j.", "timeComplexity": "O(n)", "spaceComplexity": "O(n)", "python": "def integerBreak(n):\n    if n<=3: return n-1\n    res=1\n    while n>4: res*=3\n    n-=3\n    return res*n", "java": "class Solution {\n    // Approach: DP or Math (Power of 3s)\n    // Time: O(n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Math insight: break into 3s as much as possible. DP approach: dp[i]=max product for integer i; try dp[j]*(i-j) and j*(i-\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 190, "name": "Stone Game III", "category": "1-D DP", "difficulty": "Hard", "pattern": "1-D DP from the End", "approach": "dp[i] = max score difference Alice can achieve starting from index i. Try taking 1, 2, or 3 stones: dp[i] = max(sum(i..i+k) - dp[i+k+1]) for k in 0..2.", "timeComplexity": "O(n)", "spaceComplexity": "O(n)", "python": "def stoneGameIII(stoneValue):\n    n=len(stoneValue)\n    dp=[0]*(n+1)\n    for i in range(n-1,-1,-1):\n        best=float('-inf')\n        total=0\n        for k in range(1,4):\n            if i+k>n: break\n            total+=stoneValue[i+k-1]\n            best=max(best,total-dp[i+k])\n        dp[i]=best\n    return 'Alice' if dp[0]>0 else 'Bob' if dp[0]<0 else 'Tie'", "java": "class Solution {\n    // Approach: 1-D DP from the End\n    // Time: O(n)  Space: O(n)\n    public Object solve(/* params */) {\n        // dp[i] = max score difference Alice can achieve starting from index i. Try taking 1, 2, or 3 stones: dp[i] = max(sum(i..i\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 191, "name": "Unique Paths", "category": "2-D DP", "difficulty": "Medium", "pattern": "2-D DP (Grid)", "approach": "dp[i][j] = dp[i-1][j] + dp[i][j-1]. Base case: first row and column = 1. The answer is dp[m-1][n-1]. Optimise with 1-D rolling array.", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(n)", "python": "def uniquePaths(m, n):\n    dp=[1]*n\n    for _ in range(m-1):\n        for j in range(1,n): dp[j]+=dp[j-1]\n    return dp[-1]", "java": "class Solution {\n    // Approach: 2-D DP (Grid)\n    // Time: O(m\u00b7n)  Space: O(n)\n    public Object solve(/* params */) {\n        // dp[i][j] = dp[i-1][j] + dp[i][j-1]. Base case: first row and column = 1. The answer is dp[m-1][n-1]. Optimise with 1-D r\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 192, "name": "Unique Paths II", "category": "2-D DP", "difficulty": "Medium", "pattern": "2-D DP with Obstacle Handling", "approach": "Same as Unique Paths but set dp[i][j]=0 whenever obstacleGrid[i][j]==1. Initialise the first row/column carefully stopping at any obstacle.", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(n)", "python": "def uniquePathsWithObstacles(grid):\n    m,n=len(grid),len(grid[0])\n    dp=[0]*n\n    dp[0]=1\n    for r in range(m):\n        for c in range(n):\n            if grid[r][c]: dp[c]=0\n            elif c>0: dp[c]+=dp[c-1]\n    return dp[-1]", "java": "class Solution {\n    // Approach: 2-D DP with Obstacle Handling\n    // Time: O(m\u00b7n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Same as Unique Paths but set dp[i][j]=0 whenever obstacleGrid[i][j]==1. Initialise the first row/column carefully stoppi\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 193, "name": "Minimum Path Sum", "category": "2-D DP", "difficulty": "Medium", "pattern": "2-D DP", "approach": "dp[i][j] = grid[i][j] + min(dp[i-1][j], dp[i][j-1]). Process left-to-right, top-to-bottom. First row and column are prefix sums.", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(1)", "python": "def minPathSum(grid):\n    m,n=len(grid),len(grid[0])\n    for r in range(m):\n        for c in range(n):\n            if r==0 and c==0: continue\n            top=grid[r-1][c] if r>0 else float('inf')\n            left=grid[r][c-1] if c>0 else float('inf')\n            grid[r][c]+=min(top,left)\n    return grid[-1][-1]", "java": "class Solution {\n    // Approach: 2-D DP\n    // Time: O(m\u00b7n)  Space: O(1)\n    public Object solve(/* params */) {\n        // dp[i][j] = grid[i][j] + min(dp[i-1][j], dp[i][j-1]). Process left-to-right, top-to-bottom. First row and column are pref\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 194, "name": "Longest Common Subsequence", "category": "2-D DP", "difficulty": "Medium", "pattern": "2-D DP", "approach": "dp[i][j] = LCS length of text1[0..i-1] and text2[0..j-1]. If characters match, dp[i][j]=dp[i-1][j-1]+1; else max(dp[i-1][j], dp[i][j-1]).", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(m\u00b7n)", "python": "def longestCommonSubsequence(text1, text2):\n    m,n=len(text1),len(text2)\n    dp=[[0]*(n+1) for _ in range(m+1)]\n    for i in range(1,m+1):\n        for j in range(1,n+1):\n            if text1[i-1]==text2[j-1]: dp[i][j]=dp[i-1][j-1]+1\n            else: dp[i][j]=max(dp[i-1][j],dp[i][j-1])\n    return dp[m][n]", "java": "class Solution {\n    public int longestCommonSubsequence(String t1, String t2) {\n        int m = t1.length(), n = t2.length();\n        int[][] dp = new int[m + 1][n + 1];\n        for (int i = 1; i <= m; i++)\n            for (int j = 1; j <= n; j++)\n                dp[i][j] = t1.charAt(i-1) == t2.charAt(j-1)\n                    ? dp[i-1][j-1] + 1\n                    : Math.max(dp[i-1][j], dp[i][j-1]);\n        return dp[m][n];\n    }\n}"}, {"id": 195, "name": "Last Stone Weight II", "category": "2-D DP", "difficulty": "Hard", "pattern": "0-1 Knapsack \u2192 Partition", "approach": "Minimize |S1-S2| where S1+S2=total. Find the largest subset sum \u2264 total//2 using knapsack DP. Answer = total \u2212 2*best.", "timeComplexity": "O(n \u00b7 sum)", "spaceComplexity": "O(sum)", "python": "def lastStoneWeightII(stones):\n    total=sum(stones)\n    dp={0}\n    for s in stones: dp={x+s for x in dp}|dp\n    best=max(x for x in dp if x<=total//2)\n    return total-2*best", "java": "class Solution {\n    // Approach: 0-1 Knapsack \u2192 Partition\n    // Time: O(n \u00b7 sum)  Space: O(sum)\n    public Object solve(/* params */) {\n        // Minimize |S1-S2| where S1+S2=total. Find the largest subset sum \u2264 total//2 using knapsack DP. Answer = total \u2212 2*best.\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 196, "name": "Best Time to Buy And Sell Stock With Cooldown", "category": "2-D DP", "difficulty": "Medium", "pattern": "State Machine DP", "approach": "Three states: held (holding stock), sold (just sold, cooldown), rest (can buy). Transitions: held = max(held, rest-price); sold = held+price; rest = max(rest, sold).", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def maxProfit(prices):\n    held=float('-inf')\n    sold=0\n    rest=0\n    for p in prices:\n        held,sold,rest=max(held,rest-p),held+p,max(rest,sold)\n    return max(sold,rest)", "java": "class Solution {\n    // Approach: State Machine DP\n    // Time: O(n)  Space: O(1)\n    public Object solve(/* params */) {\n        // Three states: held (holding stock), sold (just sold, cooldown), rest (can buy). Transitions: held = max(held, rest-price\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 197, "name": "Coin Change II", "category": "2-D DP", "difficulty": "Medium", "pattern": "2-D DP (Unbounded Knapsack \u2014 Combinations)", "approach": "dp[i][j] = ways to make amount j using first i coin types. dp[i][j] = dp[i-1][j] + dp[i][j-coins[i-1]]. Use 1-D rolling to save space.", "timeComplexity": "O(n\u00b7amount)", "spaceComplexity": "O(amount)", "python": "def change(amount, coins):\n    dp=[0]*(amount+1)\n    dp[0]=1\n    for c in coins:\n        for i in range(c,amount+1): dp[i]+=dp[i-c]\n    return dp[amount]", "java": "class Solution {\n    // Approach: 2-D DP (Unbounded Knapsack \u2014 Combinations)\n    // Time: O(n\u00b7amount)  Space: O(amount)\n    public Object solve(/* params */) {\n        // dp[i][j] = ways to make amount j using first i coin types. dp[i][j] = dp[i-1][j] + dp[i][j-coins[i-1]]. Use 1-D rolling \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 198, "name": "Target Sum", "category": "2-D DP", "difficulty": "Medium", "pattern": "DP (Subset Sum variant)", "approach": "Assign + or \u2212 to each number. P = set of positives, N = set of negatives. P\u2212N=target and P+N=sum. So P=(target+sum)/2. Count subsets summing to P.", "timeComplexity": "O(n\u00b7sum)", "spaceComplexity": "O(sum)", "python": "def findTargetSumWays(nums, target):\n    total=sum(nums)\n    if (total+target)%2 or abs(target)>total: return 0\n    P=(total+target)//2\n    dp=[0]*(P+1)\n    dp[0]=1\n    for n in nums:\n        for j in range(P,n-1,-1): dp[j]+=dp[j-n]\n    return dp[P]", "java": "class Solution {\n    // Approach: DP (Subset Sum variant)\n    // Time: O(n\u00b7sum)  Space: O(sum)\n    public Object solve(/* params */) {\n        // Assign + or \u2212 to each number. P = set of positives, N = set of negatives. P\u2212N=target and P+N=sum. So P=(target+sum)/2. C\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 199, "name": "Interleaving String", "category": "2-D DP", "difficulty": "Medium", "pattern": "2-D DP", "approach": "dp[i][j] = can s3[0..i+j-1] be formed by interleaving s1[0..i-1] and s2[0..j-1]. Transition: dp[i][j] = (dp[i-1][j] and s1[i-1]==s3[i+j-1]) or (dp[i][j-1] and s2[j-1]==s3[i+j-1]).", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(m\u00b7n)", "python": "def isInterleave(s1, s2, s3):\n    m,n=len(s1),len(s2)\n    if m+n!=len(s3): return False\n    dp=[[False]*(n+1) for _ in range(m+1)]\n    dp[0][0]=True\n    for i in range(m+1):\n        for j in range(n+1):\n            if i>0: dp[i][j]|=dp[i-1][j] and s1[i-1]==s3[i+j-1]\n            if j>0: dp[i][j]|=dp[i][j-1] and s2[j-1]==s3[i+j-1]\n    return dp[m][n]", "java": "class Solution {\n    // Approach: 2-D DP\n    // Time: O(m\u00b7n)  Space: O(m\u00b7n)\n    public Object solve(/* params */) {\n        // dp[i][j] = can s3[0..i+j-1] be formed by interleaving s1[0..i-1] and s2[0..j-1]. Transition: dp[i][j] = (dp[i-1][j] and \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 200, "name": "Stone Game", "category": "2-D DP", "difficulty": "Medium", "pattern": "Math / DP", "approach": "Alice always wins if she plays optimally (math: first player always wins when total is odd). DP: dp[i][j] = max score difference for piles[i..j].", "timeComplexity": "O(n\u00b2)", "spaceComplexity": "O(n\u00b2)", "python": "def stoneGame(piles):\n    return True  # Alice always wins (math proof)\n    # DP: dp[i][j] = max lead for current player in piles[i..j]\n    # dp[i][j] = max(piles[i]-dp[i+1][j], piles[j]-dp[i][j-1])", "java": "class Solution {\n    // Approach: Math / DP\n    // Time: O(n\u00b2)  Space: O(n\u00b2)\n    public Object solve(/* params */) {\n        // Alice always wins if she plays optimally (math: first player always wins when total is odd). DP: dp[i][j] = max score di\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 201, "name": "Stone Game II", "category": "2-D DP", "difficulty": "Medium", "pattern": "Memoized Recursion", "approach": "dp(i, M) = max stones current player can collect from piles[i:]. They take piles[i:i+X] for 1\u2264X\u22642M, then M=max(M,X). Use suffix sums for fast range queries.", "timeComplexity": "O(n\u00b2)", "spaceComplexity": "O(n\u00b2)", "python": "def stoneGameII(piles):\n    n=len(piles)\n    dp=[[0]*n for _ in range(n)]\n    suf=[0]*(n+1)\n    for i in range(n-1,-1,-1): suf[i]=suf[i+1]+piles[i]\n    def rec(i,M):\n        if i>=n: return 0\n        if dp[i][M-1]: return dp[i][M-1]\n        best=0\n        for X in range(1,2*M+1):\n            best=max(best,suf[i]-rec(i+X,max(M,X)))\n        dp[i][M-1]=best\n        return best\n    return rec(0,1)", "java": "class Solution {\n    // Approach: Memoized Recursion\n    // Time: O(n\u00b2)  Space: O(n\u00b2)\n    public Object solve(/* params */) {\n        // dp(i, M) = max stones current player can collect from piles[i:]. They take piles[i:i+X] for 1\u2264X\u22642M, then M=max(M,X). Use\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 202, "name": "Longest Increasing Path In a Matrix", "category": "2-D DP", "difficulty": "Hard", "pattern": "DFS + Memoization", "approach": "From each cell, DFS in 4 directions only to strictly larger cells. Memoize the longest path starting from each cell. Return the global maximum.", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(m\u00b7n)", "python": "def longestIncreasingPath(matrix):\n    R,C=len(matrix),len(matrix[0])\n    memo={}\n    def dfs(r,c):\n        if (r,c) in memo: return memo[(r,c)]\n        best=1\n        for dr,dc in[(0,1),(0,-1),(1,0),(-1,0)]:\n            nr,nc=r+dr,c+dc\n            if 0<=nr<R and 0<=nc<C and matrix[nr][nc]>matrix[r][c]:\n                best=max(best,1+dfs(nr,nc))\n        memo[(r,c)]=best\n        return best\n    return max(dfs(r,c) for r in range(R) for c in range(C))", "java": "class Solution {\n    // Approach: DFS + Memoization\n    // Time: O(m\u00b7n)  Space: O(m\u00b7n)\n    public Object solve(/* params */) {\n        // From each cell, DFS in 4 directions only to strictly larger cells. Memoize the longest path starting from each cell. Ret\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 203, "name": "Distinct Subsequences", "category": "2-D DP", "difficulty": "Hard", "pattern": "2-D DP", "approach": "dp[i][j] = number of ways to form t[0..j-1] from s[0..i-1]. If s[i-1]==t[j-1]: dp[i][j]=dp[i-1][j-1]+dp[i-1][j]; else dp[i][j]=dp[i-1][j].", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(m\u00b7n)", "python": "def numDistinct(s, t):\n    m,n=len(s),len(t)\n    dp=[[0]*(n+1) for _ in range(m+1)]\n    for i in range(m+1): dp[i][0]=1\n    for i in range(1,m+1):\n        for j in range(1,n+1):\n            dp[i][j]=dp[i-1][j]+(dp[i-1][j-1] if s[i-1]==t[j-1] else 0)\n    return dp[m][n]", "java": "class Solution {\n    // Approach: 2-D DP\n    // Time: O(m\u00b7n)  Space: O(m\u00b7n)\n    public Object solve(/* params */) {\n        // dp[i][j] = number of ways to form t[0..j-1] from s[0..i-1]. If s[i-1]==t[j-1]: dp[i][j]=dp[i-1][j-1]+dp[i-1][j]; else dp\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 204, "name": "Edit Distance", "category": "2-D DP", "difficulty": "Medium", "pattern": "2-D DP", "approach": "dp[i][j] = edits to convert word1[0..i-1] to word2[0..j-1]. If chars match, dp[i][j]=dp[i-1][j-1]; else min(insert, delete, replace) = 1+min(dp[i][j-1], dp[i-1][j], dp[i-1][j-1]).", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(m\u00b7n)", "python": "def minDistance(word1, word2):\n    m,n=len(word1),len(word2)\n    dp=list(range(n+1))\n    for i in range(1,m+1):\n        prev=dp[0]\n        dp[0]=i\n        for j in range(1,n+1):\n            tmp=dp[j]\n            if word1[i-1]==word2[j-1]: dp[j]=prev\n            else: dp[j]=1+min(prev,dp[j],dp[j-1])\n            prev=tmp\n    return dp[n]", "java": "class Solution {\n    public int minDistance(String w1, String w2) {\n        int m = w1.length(), n = w2.length();\n        int[] dp = new int[n + 1];\n        for (int j = 0; j <= n; j++) dp[j] = j;\n        for (int i = 1; i <= m; i++) {\n            int prev = dp[0]; dp[0] = i;\n            for (int j = 1; j <= n; j++) {\n                int tmp = dp[j];\n                dp[j] = w1.charAt(i-1) == w2.charAt(j-1) ? prev : 1 + Math.min(prev, Math.min(dp[j], dp[j-1]));\n                prev = tmp;\n            }\n        }\n        return dp[n];\n    }\n}"}, {"id": 205, "name": "Burst Balloons", "category": "2-D DP", "difficulty": "Hard", "pattern": "Interval DP", "approach": "dp[l][r] = max coins from bursting all balloons in (l,r) (exclusive). Try each k in (l,r) as the last to burst: coins = nums[l]*nums[k]*nums[r] + dp[l][k] + dp[k][r].", "timeComplexity": "O(n\u00b3)", "spaceComplexity": "O(n\u00b2)", "python": "def maxCoins(nums):\n    nums=[1]+nums+[1]\n    n=len(nums)\n    dp=[[0]*n for _ in range(n)]\n    for length in range(2,n):\n        for left in range(n-length):\n            right=left+length\n            for k in range(left+1,right):\n                dp[left][right]=max(dp[left][right],nums[left]*nums[k]*nums[right]+dp[left][k]+dp[k][right])\n    return dp[0][n-1]", "java": "class Solution {\n    // Approach: Interval DP\n    // Time: O(n\u00b3)  Space: O(n\u00b2)\n    public Object solve(/* params */) {\n        // dp[l][r] = max coins from bursting all balloons in (l,r) (exclusive). Try each k in (l,r) as the last to burst: coins = \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 206, "name": "Regular Expression Matching", "category": "2-D DP", "difficulty": "Hard", "pattern": "2-D DP", "approach": "dp[i][j] = does p[0..j-1] match s[0..i-1]? '*' means 0 or more of previous char: dp[i][j] = dp[i][j-2] (zero) or (p[j-1] matches s[i-1] and dp[i-1][j]).", "timeComplexity": "O(m\u00b7n)", "spaceComplexity": "O(m\u00b7n)", "python": "def isMatch(s, p):\n    m,n=len(s),len(p)\n    dp=[[False]*(n+1) for _ in range(m+1)]\n    dp[0][0]=True\n    for j in range(2,n+1):\n        if p[j-1]=='*': dp[0][j]=dp[0][j-2]\n    for i in range(1,m+1):\n        for j in range(1,n+1):\n            if p[j-1]=='*':\n                dp[i][j]=dp[i][j-2] or (dp[i-1][j] and (p[j-2]==s[i-1] or p[j-2]=='.'))\n            elif p[j-1]=='.' or p[j-1]==s[i-1]: dp[i][j]=dp[i-1][j-1]\n    return dp[m][n]", "java": "class Solution {\n    // Approach: 2-D DP\n    // Time: O(m\u00b7n)  Space: O(m\u00b7n)\n    public Object solve(/* params */) {\n        // dp[i][j] = does p[0..j-1] match s[0..i-1]? '*' means 0 or more of previous char: dp[i][j] = dp[i][j-2] (zero) or (p[j-1]\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 207, "name": "Lemonade Change", "category": "Greedy", "difficulty": "Easy", "pattern": "Greedy (Simulate Change)", "approach": "Track counts of $5 and $10 bills. For $10 use a $5; for $20 prefer $10+$5 else use three $5s. Return False if change can't be made at any step.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def lemonadeChange(bills):\n    five=ten=0\n    for b in bills:\n        if b==5: five+=1\n        elif b==10:\n            if not five: return False\n            five-=1\n            ten+=1\n        else:\n            if ten and five: ten-=1\n            five-=1\n            elif five>=3: five-=3\n            else: return False\n    return True", "java": "class Solution {\n    // Approach: Greedy (Simulate Change)\n    // Time: O(n)  Space: O(1)\n    public Object solve(/* params */) {\n        // Track counts of $5 and $10 bills. For $10 use a $5; for $20 prefer $10+$5 else use three $5s. Return False if change can\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 208, "name": "Maximum Subarray", "category": "Greedy", "difficulty": "Medium", "pattern": "Kadane's Algorithm", "approach": "Track currentSum and maxSum. currentSum = max(nums[i], currentSum + nums[i]). If currentSum < 0, reset to 0 (start a new subarray). maxSum tracks the best seen.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def maxSubArray(nums):\n    cur=mx=nums[0]\n    for n in nums[1:]: cur=max(n,cur+n)\n    mx=max(mx,cur)\n    return mx", "java": "class Solution {\n    public int maxSubArray(int[] nums) {\n        int cur = nums[0], mx = nums[0];\n        for (int i = 1; i < nums.length; i++) {\n            cur = Math.max(nums[i], cur + nums[i]);\n            mx = Math.max(mx, cur);\n        }\n        return mx;\n    }\n}"}, {"id": 209, "name": "Maximum Sum Circular Subarray", "category": "Greedy", "difficulty": "Medium", "pattern": "Kadane's + Circular Case", "approach": "Max circular subarray = total sum \u2212 min subarray sum (non-wrapping). Answer is max(max_subarray, total \u2212 min_subarray). Handle all-negatives edge case.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def maxSubarraySumCircular(nums):\n    total=sum(nums)\n    mx=cur_mx=nums[0]\n    mn=cur_mn=nums[0]\n    for n in nums[1:]:\n        cur_mx=max(n,cur_mx+n)\n        mx=max(mx,cur_mx)\n        cur_mn=min(n,cur_mn+n)\n        mn=min(mn,cur_mn)\n    return max(mx,total-mn) if mx>0 else mx", "java": "class Solution {\n    // Approach: Kadane's + Circular Case\n    // Time: O(n)  Space: O(1)\n    public Object solve(/* params */) {\n        // Max circular subarray = total sum \u2212 min subarray sum (non-wrapping). Answer is max(max_subarray, total \u2212 min_subarray). \n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 210, "name": "Longest Turbulent Subarray", "category": "Greedy", "difficulty": "Medium", "pattern": "Sliding Window / Greedy", "approach": "Track increasing and decreasing run lengths. inc = 1 if prev<curr else 1; dec = 1 if prev>curr else 1. Update max with max(inc,dec). Reset on equal elements.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def maxTurbulenceSize(arr):\n    inc=dec=res=1\n    for i in range(1,len(arr)):\n        if arr[i]>arr[i-1]: inc=dec+1\n        dec=1\n        elif arr[i]<arr[i-1]: dec=inc+1\n        inc=1\n        else: inc=dec=1\n        res=max(res,inc,dec)\n    return res", "java": "class Solution {\n    // Approach: Sliding Window / Greedy\n    // Time: O(n)  Space: O(1)\n    public Object solve(/* params */) {\n        // Track increasing and decreasing run lengths. inc = 1 if prev<curr else 1; dec = 1 if prev>curr else 1. Update max with m\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 211, "name": "Jump Game", "category": "Greedy", "difficulty": "Medium", "pattern": "Greedy (Track Max Reachable)", "approach": "Track maxReach. For each index i \u2264 maxReach, update maxReach = max(maxReach, i+nums[i]). If maxReach \u2265 n-1 at any point, return True.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def canJump(nums):\n    reach=0\n    for i,n in enumerate(nums):\n        if i>reach: return False\n        reach=max(reach,i+n)\n    return True", "java": "class Solution {\n    public boolean canJump(int[] nums) {\n        int reach = 0;\n        for (int i = 0; i < nums.length; i++) {\n            if (i > reach) return false;\n            reach = Math.max(reach, i + nums[i]);\n        }\n        return true;\n    }\n}"}, {"id": 212, "name": "Jump Game II", "category": "Greedy", "difficulty": "Medium", "pattern": "Greedy (BFS-level Approach)", "approach": "Think of jumps as BFS levels. Track current level's farthest reach and next level's farthest reach. When you exhaust the current level, take a jump.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def jump(nums):\n    jumps=cur_end=far=0\n    for i in range(len(nums)-1):\n        far=max(far,i+nums[i])\n        if i==cur_end: jumps+=1\n        cur_end=far\n    return jumps", "java": "class Solution {\n    // Approach: Greedy (BFS-level Approach)\n    // Time: O(n)  Space: O(1)\n    public Object solve(/* params */) {\n        // Think of jumps as BFS levels. Track current level's farthest reach and next level's farthest reach. When you exhaust the\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 213, "name": "Jump Game VII", "category": "Greedy", "difficulty": "Medium", "pattern": "BFS / Prefix Sum (Range Reachability)", "approach": "Use a prefix sum to efficiently count reachable positions in [i+minJump, i+maxJump]. Mark cells reachable when the count > 0. Avoid redundant re-processing.", "timeComplexity": "O(n)", "spaceComplexity": "O(n)", "python": "def canReach(s, minJump, maxJump):\n    n=len(s)\n    reach=0\n    pre=[0]*(n+1)\n    pre[1]=1\n    for i in range(1,n):\n        if i<=reach and s[i]=='0':\n            lo=max(0,i-maxJump)\n            hi=i-minJump\n            if hi>=0 and pre[hi+1]-pre[max(0,lo)]>0:\n                reach=i\n                pre[i+1]=pre[i]+1\n                continue\n        pre[i+1]=pre[i]\n    return s[n-1]=='0' and n-1<=reach", "java": "class Solution {\n    // Approach: BFS / Prefix Sum (Range Reachability)\n    // Time: O(n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Use a prefix sum to efficiently count reachable positions in [i+minJump, i+maxJump]. Mark cells reachable when the count\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 214, "name": "Gas Station", "category": "Greedy", "difficulty": "Medium", "pattern": "Greedy (Single Pass)", "approach": "Track totalGas - totalCost: if negative, no solution. Otherwise, scan: if running tank < 0 at position i, start = i+1 and reset tank. Return start.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def canCompleteCircuit(gas, cost):\n    total=cur=start=0\n    for i in range(len(gas)):\n        total+=gas[i]-cost[i]\n        cur+=gas[i]-cost[i]\n        if cur<0: start=i+1\n        cur=0\n    return start if total>=0 else -1", "java": "class Solution {\n    // Approach: Greedy (Single Pass)\n    // Time: O(n)  Space: O(1)\n    public Object solve(/* params */) {\n        // Track totalGas - totalCost: if negative, no solution. Otherwise, scan: if running tank < 0 at position i, start = i+1 an\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 215, "name": "Hand of Straights", "category": "Greedy", "difficulty": "Medium", "pattern": "Greedy + Ordered Map", "approach": "Sort hand into an ordered frequency map. For each smallest card, try to extend consecutive runs of size groupSize. Decrement counts accordingly.", "timeComplexity": "O(n log n)", "spaceComplexity": "O(n)", "python": "def isNStraightHand(hand, groupSize):\n    from collections import Counter\n    import heapq\n    if len(hand)%groupSize: return False\n    cnt=Counter(hand)\n    heap=list(cnt.keys())\n    heapq.heapify(heap)\n    while heap:\n        mn=heap[0]\n        for i in range(groupSize):\n            if cnt[mn+i]==0: return False\n            cnt[mn+i]-=1\n            if cnt[mn+i]==0: heapq.heappop(heap)\n            # simplified\n        # re-heapify on min removal\n    return True", "java": "class Solution {\n    // Approach: Greedy + Ordered Map\n    // Time: O(n log n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Sort hand into an ordered frequency map. For each smallest card, try to extend consecutive runs of size groupSize. Decre\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 216, "name": "Dota2 Senate", "category": "Greedy", "difficulty": "Medium", "pattern": "Greedy with Two Queues", "approach": "Use queues of indices for Radiant and Dire. The senator with the smaller index bans the other. The banned senator gets re-added to the back of their queue with index + n to simulate future rounds.", "timeComplexity": "O(n)", "spaceComplexity": "O(n)", "python": "from collections import deque\ndef predictPartyVictory(senate):\n    R=deque()\n    D=deque()\n    for i,s in enumerate(senate):\n        if s=='R': R.append(i)\n        else: D.append(i)\n    n=len(senate)\n    while R and D:\n        r,d=R.popleft(),D.popleft()\n        if r<d: R.append(r+n)\n        else: D.append(d+n)\n    return 'Radiant' if R else 'Dire'", "java": "class Solution {\n    // Approach: Greedy with Two Queues\n    // Time: O(n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Use queues of indices for Radiant and Dire. The senator with the smaller index bans the other. The banned senator gets r\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 217, "name": "Merge Triplets to Form Target Triplet", "category": "Greedy", "difficulty": "Medium", "pattern": "Greedy (Filter + OR Merge)", "approach": "Discard any triplet with a component exceeding the target. Among remaining triplets, OR (max) all components. If the result equals the target, return True.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def mergeTriplets(triplets, target):\n    a,b,c=target\n    res=[0,0,0]\n    for x,y,z in triplets:\n        if x<=a and y<=b and z<=c:\n            res[0]=max(res[0],x)\n            res[1]=max(res[1],y)\n            res[2]=max(res[2],z)\n    return res==list(target)", "java": "class Solution {\n    // Approach: Greedy (Filter + OR Merge)\n    // Time: O(n)  Space: O(1)\n    public Object solve(/* params */) {\n        // Discard any triplet with a component exceeding the target. Among remaining triplets, OR (max) all components. If the res\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 218, "name": "Partition Labels", "category": "Greedy", "difficulty": "Medium", "pattern": "Greedy (Last Occurrence Map)", "approach": "For each character, store its last occurrence index. Scan and track the current end of the partition as the max last-occurrence of any seen character. When i==end, record partition.", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def partitionLabels(s):\n    last={c:i for i,c in enumerate(s)}\n    res=[]\n    start=end=0\n    for i,c in enumerate(s):\n        end=max(end,last[c])\n        if i==end: res.append(end-start+1)\n        start=end+1\n    return res", "java": "class Solution {\n    // Approach: Greedy (Last Occurrence Map)\n    // Time: O(n)  Space: O(1)\n    public Object solve(/* params */) {\n        // For each character, store its last occurrence index. Scan and track the current end of the partition as the max last-occ\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 219, "name": "Valid Parenthesis String", "category": "Greedy", "difficulty": "Medium", "pattern": "Greedy (Track Min/Max Open Count)", "approach": "Track the range [lo, hi] of possible open-parenthesis counts. '(' increments both; ')' decrements both; '*' widens range by 1 each side. Return True if lo==0 at end (hi stays \u2265 0 throughout).", "timeComplexity": "O(n)", "spaceComplexity": "O(1)", "python": "def checkValidString(s):\n    lo=hi=0\n    for c in s:\n        if c=='(': lo+=1\n        hi+=1\n        elif c==')': lo-=1\n        hi-=1\n        else: lo-=1\n        hi+=1\n        if hi<0: return False\n        lo=max(lo,0)\n    return lo==0", "java": "class Solution {\n    // Approach: Greedy (Track Min/Max Open Count)\n    // Time: O(n)  Space: O(1)\n    public Object solve(/* params */) {\n        // Track the range [lo, hi] of possible open-parenthesis counts. '(' increments both; ')' decrements both; '*' widens range\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 220, "name": "Candy", "category": "Greedy", "difficulty": "Hard", "pattern": "Two-Pass Greedy", "approach": "Left pass: give more candy than the left neighbor if rating is higher. Right pass: give more candy than the right neighbor if rating is higher. Sum the result.", "timeComplexity": "O(n)", "spaceComplexity": "O(n)", "python": "def candy(ratings):\n    n=len(ratings)\n    c=[1]*n\n    for i in range(1,n):\n        if ratings[i]>ratings[i-1]: c[i]=c[i-1]+1\n    for i in range(n-2,-1,-1):\n        if ratings[i]>ratings[i+1]: c[i]=max(c[i],c[i+1]+1)\n    return sum(c)", "java": "class Solution {\n    // Approach: Two-Pass Greedy\n    // Time: O(n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Left pass: give more candy than the left neighbor if rating is higher. Right pass: give more candy than the right neighb\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 221, "name": "Insert Interval", "category": "Intervals", "difficulty": "Medium", "pattern": "Linear Scan + Merge", "approach": "Add all intervals that end before the new interval starts. Merge all overlapping intervals with the new one (expand start/end). Append remaining intervals.", "timeComplexity": "O(n)", "spaceComplexity": "O(n)", "python": "def insert(intervals, newInterval):\n    res=[]\n    i=0\n    n=len(intervals)\n    while i<n and intervals[i][1]<newInterval[0]: res.append(intervals[i])\n    i+=1\n    while i<n and intervals[i][0]<=newInterval[1]:\n        newInterval[0]=min(newInterval[0],intervals[i][0])\n        newInterval[1]=max(newInterval[1],intervals[i][1])\n        i+=1\n    res.append(newInterval)\n    while i<n: res.append(intervals[i])\n    i+=1\n    return res", "java": "class Solution {\n    public int[][] insert(int[][] intervals, int[] newInterval) {\n        List<int[]> res = new ArrayList<>();\n        int i = 0, n = intervals.length;\n        while (i < n && intervals[i][1] < newInterval[0]) res.add(intervals[i++]);\n        while (i < n && intervals[i][0] <= newInterval[1]) {\n            newInterval[0] = Math.min(newInterval[0], intervals[i][0]);\n            newInterval[1] = Math.max(newInterval[1], intervals[i][1]);\n            i++;\n        }\n        res.add(newInterval);\n        while (i < n) res.add(intervals[i++]);\n        return res.toArray(new int[0][]);\n    }\n}"}, {"id": 222, "name": "Merge Intervals", "category": "Intervals", "difficulty": "Medium", "pattern": "Sort + Linear Merge", "approach": "Sort intervals by start. Iterate; if the current interval overlaps the last merged one (start \u2264 prev_end), merge by extending end. Otherwise, append a new interval.", "timeComplexity": "O(n log n)", "spaceComplexity": "O(n)", "python": "def merge(intervals):\n    intervals.sort()\n    res=[intervals[0]]\n    for s,e in intervals[1:]:\n        if s<=res[-1][1]: res[-1][1]=max(res[-1][1],e)\n        else: res.append([s,e])\n    return res", "java": "class Solution {\n    public int[][] merge(int[][] intervals) {\n        Arrays.sort(intervals, (a, b) -> a[0] - b[0]);\n        List<int[]> res = new ArrayList<>();\n        res.add(intervals[0]);\n        for (int i = 1; i < intervals.length; i++) {\n            int[] last = res.get(res.size() - 1);\n            if (intervals[i][0] <= last[1]) last[1] = Math.max(last[1], intervals[i][1]);\n            else res.add(intervals[i]);\n        }\n        return res.toArray(new int[0][]);\n    }\n}"}, {"id": 223, "name": "Non Overlapping Intervals", "category": "Intervals", "difficulty": "Medium", "pattern": "Greedy (Minimum Removals)", "approach": "Sort by end time. Greedily keep intervals with the earliest end time. Skip any interval that overlaps with the last kept one. Count removals.", "timeComplexity": "O(n log n)", "spaceComplexity": "O(1)", "python": "def eraseOverlapIntervals(intervals):\n    intervals.sort(key=lambda x:x[1])\n    end=float('-inf')\n    cnt=0\n    for s,e in intervals:\n        if s>=end: end=e\n        else: cnt+=1\n    return cnt", "java": "class Solution {\n    // Approach: Greedy (Minimum Removals)\n    // Time: O(n log n)  Space: O(1)\n    public Object solve(/* params */) {\n        // Sort by end time. Greedily keep intervals with the earliest end time. Skip any interval that overlaps with the last kept\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 224, "name": "Meeting Rooms", "category": "Intervals", "difficulty": "Easy", "pattern": "Sort + Adjacent Check", "approach": "Sort intervals by start time. If any meeting's start time is less than the previous one's end time, return False. Otherwise True.", "timeComplexity": "O(n log n)", "spaceComplexity": "O(1)", "python": "def canAttendMeetings(intervals):\n    intervals.sort()\n    for i in range(1,len(intervals)):\n        if intervals[i][0]<intervals[i-1][1]: return False\n    return True", "java": "class Solution {\n    // Approach: Sort + Adjacent Check\n    // Time: O(n log n)  Space: O(1)\n    public Object solve(/* params */) {\n        // Sort intervals by start time. If any meeting's start time is less than the previous one's end time, return False. Otherw\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 225, "name": "Meeting Rooms II", "category": "Intervals", "difficulty": "Medium", "pattern": "Min-Heap of End Times", "approach": "Sort by start time. Use a min-heap of end times. For each meeting, if it starts after the earliest ending meeting, reuse that room (pop and push new end). Otherwise add a room.", "timeComplexity": "O(n log n)", "spaceComplexity": "O(n)", "python": "import heapq\ndef minMeetingRooms(intervals):\n    intervals.sort()\n    heap=[]\n    for s,e in intervals:\n        if heap and heap[0]<=s: heapq.heappop(heap)\n        heapq.heappush(heap,e)\n    return len(heap)", "java": "class Solution {\n    // Approach: Min-Heap of End Times\n    // Time: O(n log n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Sort by start time. Use a min-heap of end times. For each meeting, if it starts after the earliest ending meeting, reuse\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 226, "name": "Meeting Rooms III", "category": "Intervals", "difficulty": "Hard", "pattern": "Two Min-Heaps (Available + In-Use)", "approach": "Use a min-heap of available room indices and a min-heap of (end_time, room_idx) for in-use rooms. For each meeting, free expired rooms, assign the lowest-indexed available room, track meeting counts.", "timeComplexity": "O(n log n)", "spaceComplexity": "O(n)", "python": "import heapq\ndef mostBooked(n, meetings):\n    meetings.sort()\n    avail=list(range(n))\n    used=[]\n    cnt=[0]*n\n    heapq.heapify(avail)\n    for s,e in meetings:\n        while used and used[0][0]<=s: _,r=heapq.heappop(used)\n        heapq.heappush(avail,r)\n        if avail: r=heapq.heappop(avail)\n        else: t,r=heapq.heappop(used)\n        e=t+(e-s)\n        cnt[r]+=1\n        heapq.heappush(used,(e,r))\n    return cnt.index(max(cnt))", "java": "class Solution {\n    // Approach: Two Min-Heaps (Available + In-Use)\n    // Time: O(n log n)  Space: O(n)\n    public Object solve(/* params */) {\n        // Use a min-heap of available room indices and a min-heap of (end_time, room_idx) for in-use rooms. For each meeting, free\n        throw new UnsupportedOperationException(\"Implement me\");\n    }\n}"}, {"id": 227, "name": "Minimum Interval to Include Each Query", "category": "Intervals", "difficulty": "Hard", "pattern": "Sort Queries + Min-Heap", "approach": "Sort intervals by start and queries by value. For each query, add all intervals that started \u2264 query to a min-heap keyed by size. Remove intervals whose end < query. The heap top is the answer.", "timeComplexity": "O((n+m) log n)", "spaceComplexity": "O(n+m)", "python": "import heapq\ndef minInterval(intervals, queries):\n    intervals.sort()\n    res={}\n    order=sorted(range(len(queries)),key=lambda i:queries[i])\n    heap=[]\n    i=0\n    for qi in order:\n        q=queries[qi]\n        while i<len(intervals) and intervals[i][0]<=q:\n            l /* ── Python syntax highlighter ───────────────────────────────────────── */
function highlightPython(code) {
  var KW = ['def','return','if','elif','else','for','while','in','not','and','or',
             'True','False','None','import','from','as','class','self','break',
             'continue','pass','lambda','yield','with','raise','try','except',
             'finally','del','global','nonlocal','is'];
  var BI = ['range','len','max','min','sum','sorted','list','dict','set','tuple',
             'int','str','float','bool','enumerate','zip','map','filter','abs',
             'any','all','reversed','type','isinstance','divmod','print','next',
             'iter','super','open'];
  var s = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var SLOTS = [];
  function slot(v) { SLOTS.push(v); return '\x00' + (SLOTS.length-1) + '\x00'; }
  // comments
  s = s.replace(/#[^\n]*/g, function(m){ return slot('<span class="py-cm">'+m+'</span>'); });
  // strings (double then single)
  s = s.replace(/"(?:[^"\\]|\\.)*"/g, function(m){ return slot('<span class="py-str">'+m+'</span>'); });
  s = s.replace(/'(?:[^'\\]|\\.)*'/g, function(m){ return slot('<span class="py-str">'+m+'</span>'); });
  // decorators
  s = s.replace(/@\w+/g, function(m){ return slot('<span class="py-dec">'+m+'</span>'); });
  // numbers
  s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, function(_,n){ return slot('<span class="py-num">'+n+'</span>'); });
  // keywords
  KW.forEach(function(kw){
    s = s.replace(new RegExp('(?<![\\w])'+kw+'(?![\\w])','g'), function(m){ return slot('<span class="py-kw">'+m+'</span>'); });
  });
  // builtins (only before parens)
  BI.forEach(function(b){
    s = s.replace(new RegExp('(?<![\\w])'+b+'(?=\\s*\\()','g'), function(m){ return slot('<span class="py-bi">'+m+'</span>'); });
  });
  // class/def names - inline after keyword slot
  s = s.replace(/\bclass\s+(\w+)/g, function(_,n){ return 'class <span class="py-cls">'+n+'</span>'; });
  s = s.replace(/\bdef\s+(\w+)/g,   function(_,n){ return 'def <span class="py-fn">'+n+'</span>'; });
  // restore slots
  s = s.replace(/\x00(\d+)\x00/g, function(_,i){ return SLOTS[+i] || ''; });
  return s;
}

  var s = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var SLOTS = [];
  function slot(v){ SLOTS.push(v); return '\x00'+(SLOTS.length-1)+'\x00'; }
  // block comments
  s = s.replace(/\/\*[\s\S]*?\*\//g, function(m){ return slot('<span class="jv-cm">'+m+'</span>'); });
  // line comments
  s = s.replace(/\/\/[^\n]*/g, function(m){ return slot('<span class="jv-cm">'+m+'</span>'); });
  // strings & chars
  s = s.replace(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/g, function(m){ return slot('<span class="jv-str">'+m+'</span>'); });
  // annotations
  s = s.replace(/@\w+/g, function(m){ return slot('<span class="jv-ann">'+m+'</span>'); });
  // numbers
  s = s.replace(/\b(\d+(?:\.\d+)?[fFdDlL]?)\b/g, function(_,n){ return slot('<span class="jv-num">'+n+'</span>'); });
  // keywords
  KW.forEach(function(kw){
    s = s.replace(new RegExp('(?<![\\w])'+kw+'(?![\\w])','g'), function(m){ return slot('<span class="jv-kw">'+m+'</span>'); });
  });
  // types
  TYPES.forEach(function(t){
    s = s.replace(new RegExp('(?<![\\w])'+t+'(?![\\w])','g'), function(m){ return slot('<span class="jv-typ">'+m+'</span>'); });
  });
  // method names before (
  s = s.replace(/\b([a-z]\w*)(?=\s*\()/g, function(_,n){ return '<span class="jv-fn">'+n+'</span>'; });
  // restore slots
  s = s.replace(/\x00(\d+)\x00/g, function(_,i){ return SLOTS[+i]||''; });
  return s;
}

/* ── CodeBlock component ─────────────────────────────────────────────── */
function CodeBlock(props) {
  var python = props.python;
  var java   = props.java;
  var _tab   = React.useState('python');
  var tab    = _tab[0];
  var setTab = _tab[1];
  var _cop   = React.useState(false);
  var copied = _cop[0];
  var setCopied = _cop[1];

  var code = tab === 'python' ? python : java;

  var highlighted = React.useMemo(function(){
    if (!code) return '';
    return tab === 'python' ? highlightPython(code) : highlightJava(code);
  }, [code, tab]);

  React.useEffect(function(){ setCopied(false); }, [tab]);

  function doCopy(e) {
    e.stopPropagation();
    navigator.clipboard.writeText(code).then(function(){
      setCopied(true);
      setTimeout(function(){ setCopied(false); }, 1800);
    }).catch(function(){});
  }

  var hasBoth = python && java;

  return React.createElement('div', { className: 'code-block-wrap', onClick: function(e){ e.stopPropagation(); } },
    React.createElement('div', { className: 'code-tab-bar' },
      React.createElement('button', {
        className: 'code-tab' + (tab==='python' ? ' active' : ''),
        onClick: function(e){ e.stopPropagation(); setTab('python'); }
      },
        React.createElement('span', { className: 'code-tab-dot python' }),
        'Python'
      ),
      hasBoth ? React.createElement('button', {
        className: 'code-tab' + (tab==='java' ? ' active' : ''),
        onClick: function(e){ e.stopPropagation(); setTab('java'); }
      },
        React.createElement('span', { className: 'code-tab-dot java' }),
        'Java'
      ) : null,
      React.createElement('div', { className: 'code-tab-actions' },
        React.createElement('button', {
          className: 'copy-btn' + (copied ? ' copied' : ''),
          onClick: doCopy
        }, copied ? '\u2713 Copied' : 'Copy')
      )
    ),
    React.createElement('div', { className: 'code-scroll' },
      React.createElement('pre', {
        className: 'code-pre',
        dangerouslySetInnerHTML: { __html: highlighted }
      })
    )
  );
}

function FlashCard({ problem, index, total, onPrev, onNext, hasPrev, hasNext }) {
  const [flipped, setFlipped] = useState(false);

  // Reset flip when problem changes
  useEffect(() => { setFlipped(false); }, [problem.id]);

  const handleKey = useCallback((e) => {
    if (e.key === 'ArrowRight' && hasNext) onNext();
    if (e.key === 'ArrowLeft' && hasPrev) onPrev();
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setFlipped(f => !f); }
  }, [hasNext, hasPrev, onNext, onPrev]);

  useEffect(() => {
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [handleKey]);

  return React.createElement('div', { style: { width: '100%', maxWidth: 720, display: 'flex', flexDirection: 'column', gap: 14 } },
    // Card
    React.createElement('div', { className: 'card-scene', onClick: () => setFlipped(f => !f), role: 'button', tabIndex: 0,
      onKeyDown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setFlipped(f => !f); }}},
      React.createElement('div', { className: `card-inner ${flipped ? 'flipped' : ''}` },
        // Ghost sizer — invisible, always rendered, takes the max height of both faces
        React.createElement('div', { className: 'card-sizer', 'aria-hidden': 'true' },
          React.createElement('div', { className: 'card-meta', style: { marginBottom: 20 }},
            React.createElement(DiffBadge, { diff: problem.difficulty }),
            React.createElement(CatBadge, { cat: problem.category }),
          ),
          React.createElement('div', { className: 'card-problem-name', style: { marginBottom: 16 }}, problem.name),
          React.createElement('div', { className: 'back-pattern', style: { marginBottom: 12 }}, `⟩ ${problem.pattern}`),
          React.createElement('div', { className: 'back-approach' }, problem.approach),
          React.createElement('div', { className: 'back-complexities', style: { marginTop: 20 }},
            React.createElement('div', { className: 'complexity-pill complexity-time' }, problem.timeComplexity),
            React.createElement('div', { className: 'complexity-pill complexity-space' }, problem.spaceComplexity),
          ),
          (problem.python || problem.java)
            ? React.createElement(CodeBlock, { python: problem.python, java: problem.java })
            : null
        ),
        // Front
        React.createElement('div', { className: 'card-face' },
          React.createElement('div', { className: 'card-meta' },
            React.createElement(DiffBadge, { diff: problem.difficulty }),
            React.createElement(CatBadge, { cat: problem.category }),
            React.createElement('span', { className: 'card-num' }, `#${problem.id}`),
          ),
          React.createElement('div', { className: 'card-problem-name' }, problem.name),
          React.createElement('div', { className: 'card-hint' },
            React.createElement('svg', { width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
              React.createElement('path', { d: 'M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5' })),
            'Click to reveal solution'
          )
        ),
        // Back
        React.createElement('div', { className: 'card-face card-face--back' },
          React.createElement('div', { className: 'card-meta' },
            React.createElement(DiffBadge, { diff: problem.difficulty }),
            React.createElement(CatBadge, { cat: problem.category }),
            React.createElement('span', { className: 'card-num' }, `#${problem.id}`),
          ),
          React.createElement('div', { className: 'back-pattern' }, `⟩ ${problem.pattern}`),
          React.createElement('div', { className: 'back-approach' }, problem.approach),
          React.createElement('div', { className: 'back-complexities' },
            React.createElement('div', { className: 'complexity-pill complexity-time' },
              React.createElement('span', { className: 'complexity-label' }, 'TIME'),
              problem.timeComplexity
            ),
            React.createElement('div', { className: 'complexity-pill complexity-space' },
              React.createElement('span', { className: 'complexity-label' }, 'SPACE'),
              problem.spaceComplexity
            ),
          ),
          (problem.python || problem.java)
            ? React.createElement(CodeBlock, { python: problem.python, java: problem.java })
            : null
        )
      )
    ),
    // Nav row
    React.createElement('div', { className: 'nav-row' },
      React.createElement('button', { className: 'nav-btn', onClick: onPrev, disabled: !hasPrev },
        React.createElement('svg', { width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
          React.createElement('path', { d: 'M15 18l-6-6 6-6' })),
        'Prev'
      ),
      React.createElement('span', { className: 'nav-center' }, `${index + 1} / ${total}`),
      React.createElement('button', { className: 'nav-btn', onClick: onNext, disabled: !hasNext },
        'Next',
        React.createElement('svg', { width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
          React.createElement('path', { d: 'M9 18l6-6-6-6' }))
      )
    ),
    React.createElement('div', { style: { display: 'flex', gap: 8, width: '100%', maxWidth: 720 }},
      React.createElement('button', { className: 'flip-btn', onClick: () => setFlipped(f => !f) },
        flipped ? '← Hide solution' : 'Show solution →'),
    ),
    React.createElement('p', { style: { fontSize: 11, color: 'var(--muted2)', textAlign: 'center', fontFamily: 'JetBrains Mono, monospace' }},
      '← → arrow keys to navigate · Space to flip'
    )
  );
}

function ListRow({ problem, active, onClick }) {
  return React.createElement('div', { className: `list-item ${active ? 'active' : ''}`, onClick },
    React.createElement('span', { className: 'list-num' }, `#${problem.id}`),
    React.createElement('span', { className: 'list-name' }, problem.name),
    React.createElement('div', { className: 'list-badges' },
      React.createElement(DiffBadge, { diff: problem.difficulty }),
    )
  );
}

function App() {
  const [problems, setProblems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [catFilter, setCatFilter] = useState('All');
  const [diffFilter, setDiffFilter] = useState('All');
  const [currentIdx, setCurrentIdx] = useState(0);
  const [mode, setMode] = useState('card'); // 'card' | 'list'
  const [solved, setSolved] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem('nc250_solved') || '[]')); } catch { return new Set(); }
  });

  useEffect(() => {
    setProblems(PROBLEMS_DATA);
    setLoading(false);
  }, []);

  const categories = useMemo(() => ['All', ...new Set(problems.map(p => p.category))], [problems]);

  const filtered = useMemo(() => problems.filter(p => {
    const s = search.toLowerCase();
    if (s && !p.name.toLowerCase().includes(s) && !p.pattern.toLowerCase().includes(s)) return false;
    if (catFilter !== 'All' && p.category !== catFilter) return false;
    if (diffFilter !== 'All' && p.difficulty !== diffFilter) return false;
    return true;
  }), [problems, search, catFilter, diffFilter]);

  // Reset index when filter changes
  useEffect(() => { setCurrentIdx(0); }, [catFilter, diffFilter, search]);

  const current = filtered[currentIdx];

  const saveSolved = useCallback((set) => {
    try { localStorage.setItem('nc250_solved', JSON.stringify([...set])); } catch {}
  }, []);

  const totalSolved = useMemo(() => problems.filter(p => solved.has(p.id)).length, [problems, solved]);

  return React.createElement('div', { id: 'root' },
    // Header
    React.createElement('header', null,
      React.createElement('div', { className: 'logo' },
        React.createElement('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, style: { color: 'var(--accent)' }},
          React.createElement('rect', { x: 2, y: 3, width: 20, height: 14, rx: 2 }),
          React.createElement('line', { x1: 8, y1: 21, x2: 16, y2: 21 }),
          React.createElement('line', { x1: 12, y1: 17, x2: 12, y2: 21 })
        ),
        React.createElement('span', null, 'neetcode'),
        React.createElement('span', { className: 'logo-slash' }, '/'),
        React.createElement('span', { style: { color: 'var(--text)' }}, '250 flashcards'),
      ),
      React.createElement('div', { className: 'header-stats' },
        React.createElement('div', { className: 'stat-pill' },
          React.createElement('div', { className: 'stat-dot', style: { background: 'var(--easy)' }}),
          `${problems.filter(p=>p.difficulty==='Easy').length} Easy`
        ),
        React.createElement('div', { className: 'stat-pill' },
          React.createElement('div', { className: 'stat-dot', style: { background: 'var(--medium)' }}),
          `${problems.filter(p=>p.difficulty==='Medium').length} Med`
        ),
        React.createElement('div', { className: 'stat-pill' },
          React.createElement('div', { className: 'stat-dot', style: { background: 'var(--hard)' }}),
          `${problems.filter(p=>p.difficulty==='Hard').length} Hard`
        ),
      )
    ),

    // Controls
    React.createElement('div', { className: 'controls' },
      // Search
      React.createElement('div', { className: 'search-wrap' },
        React.createElement('svg', { width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
          React.createElement('circle', { cx: 11, cy: 11, r: 8 }),
          React.createElement('path', { d: 'm21 21-4.35-4.35' })
        ),
        React.createElement('input', { type: 'text', placeholder: 'Search problem or pattern…', value: search, onChange: e => setSearch(e.target.value) })
      ),
      // Category filter
      React.createElement('select', { value: catFilter, onChange: e => setCatFilter(e.target.value) },
        categories.map(c => React.createElement('option', { key: c, value: c }, c))
      ),
      // Difficulty filter
      React.createElement('select', { value: diffFilter, onChange: e => setDiffFilter(e.target.value) },
        ['All', 'Easy', 'Medium', 'Hard'].map(d => React.createElement('option', { key: d, value: d }, d))
      ),
      // Shuffle
      React.createElement('button', { className: 'btn', onClick: () => {
        const r = Math.floor(Math.random() * filtered.length);
        setCurrentIdx(r);
      }},
        React.createElement('svg', { width: 13, height: 13, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
          React.createElement('polyline', { points: '16 3 21 3 21 8' }),
          React.createElement('line', { x1: 4, y1: 20, x2: 21, y2: 3 }),
          React.createElement('polyline', { points: '21 16 21 21 16 21' }),
          React.createElement('line', { x1: 15, y1: 15, x2: 21, y2: 21 })
        ),
        'Shuffle'
      ),
      // Mode toggle
      React.createElement('div', { className: 'mode-toggle' },
        React.createElement('button', { className: `mode-btn ${mode === 'card' ? 'active' : ''}`, onClick: () => setMode('card') },
          React.createElement('svg', { width: 12, height: 12, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
            React.createElement('rect', { x: 2, y: 4, width: 20, height: 16, rx: 2 })
          ),
          'Card'
        ),
        React.createElement('button', { className: `mode-btn ${mode === 'list' ? 'active' : ''}`, onClick: () => setMode('list') },
          React.createElement('svg', { width: 12, height: 12, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
            React.createElement('line', { x1: 8, y1: 6, x2: 21, y2: 6 }),
            React.createElement('line', { x1: 8, y1: 12, x2: 21, y2: 12 }),
            React.createElement('line', { x1: 8, y1: 18, x2: 21, y2: 18 }),

          ),
          'List'
        ),
      ),
      // Progress
      React.createElement('div', { className: 'progress-bar-wrap' },
        React.createElement('span', null, `${filtered.length} shown`),
      )
    ),

    // Main
    React.createElement('main', null,
      loading
        ? React.createElement('div', { style: { color: 'var(--muted)', fontFamily: 'JetBrains Mono, monospace', fontSize: 14, paddingTop: 60 }}, 'Loading problems…')
        : filtered.length === 0
          ? React.createElement('div', { className: 'empty' },
              React.createElement('h3', null, 'No problems match'),
              React.createElement('p', { style: { marginTop: 8, fontSize: 13 }}, 'Try a different search or filter')
            )
          : mode === 'card'
            ? React.createElement(FlashCard, {
                key: current.id,
                problem: current,
                index: currentIdx,
                total: filtered.length,
                onPrev: () => setCurrentIdx(i => Math.max(0, i - 1)),
                onNext: () => setCurrentIdx(i => Math.min(filtered.length - 1, i + 1)),
                hasPrev: currentIdx > 0,
                hasNext: currentIdx < filtered.length - 1,
              })
            : React.createElement('div', { className: 'list-mode' },
                filtered.map((p, i) =>
                  React.createElement(ListRow, {
                    key: p.id, problem: p, active: i === currentIdx,
                    onClick: () => { setCurrentIdx(i); setMode('card'); }
                  })
                )
              )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
